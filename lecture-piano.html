<style>
/* Pupitre : la laque d'ébène du piano autour d'une feuille de musique crème.
   La partition reste toujours encre sombre sur papier, comme sur le pupitre, même de nuit.
   Mise en page : rail de navigation à gauche en paysage, barre d'onglets en bas en portrait ;
   en séance, plein écran avec une barre d'étapes collante. */
:root {
  --bg: #0f1216;
  --surface: #161a20;
  --surface-2: #1d232b;
  --surface-3: #262d37;
  --line: #2d3540;
  --text: #ece6d8;
  --text-2: #a9b1bc;
  --text-3: #808a97;
  --accent: #8fb2dd;
  --accent-strong: #b8d0ec;
  --accent-soft: rgba(143, 178, 221, 0.14);
  --on-accent: #0c1726;
  --series-2: #d9a85c;
  --ok: #6cc596;
  --warn: #e8b85a;
  --bad: #f07d70;
  --on-ok: #0b1a12;
  --on-warn: #241600;
  --on-bad: #2a0703;
  --paper: #e7dfcc;
  --paper-2: #ddd3bc;
  --paper-edge: #c7bb9f;
  --ink: #1c1a16;
  --ink-2: #57524a;
  --staff-ink: #3d3a33;
  --ok-ink: #1c7448;
  --near-ink: #9a5f06;
  --off-ink: #b4561a;
  --bad-ink: #b0281f;
  --miss-ink: #8b8578;
  --cur-ink: #2c5c9a;
  --hl: rgba(44, 92, 154, 0.16);
  --shadow: 0 18px 44px -20px rgba(0, 0, 0, 0.6);
  --font-display: 'Bodoni Moda', 'Bodoni 72', Didot, 'Bodoni MT', Georgia, serif;
  --font-ui: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}
:root[data-ui='light'],
:root[data-ui='auto'][data-theme='light'] {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --surface-3: #e1e6ec;
  --line: #d3dae3;
  --text: #16202b;
  --text-2: #4f5b6a;
  --text-3: #6b7684;
  --accent: #2c5c9a;
  --accent-strong: #1f4677;
  --accent-soft: rgba(44, 92, 154, 0.1);
  --on-accent: #ffffff;
  --series-2: #a86e12;
  --ok: #1e8a55;
  --warn: #a8700f;
  --bad: #c2382e;
  --on-ok: #ffffff;
  --on-warn: #ffffff;
  --on-bad: #ffffff;
  --paper: #fbf7ec;
  --paper-2: #f2ebda;
  --paper-edge: #e0d5bc;
  --hl: rgba(44, 92, 154, 0.13);
  --shadow: 0 14px 34px -16px rgba(22, 32, 43, 0.28);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root[data-ui='auto']:not([data-theme='dark']) {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-2: #f3f5f8;
    --surface-3: #e1e6ec;
    --line: #d3dae3;
    --text: #16202b;
    --text-2: #4f5b6a;
    --text-3: #6b7684;
    --accent: #2c5c9a;
    --accent-strong: #1f4677;
    --accent-soft: rgba(44, 92, 154, 0.1);
    --on-accent: #ffffff;
    --series-2: #a86e12;
    --ok: #1e8a55;
    --warn: #a8700f;
    --bad: #c2382e;
    --on-ok: #ffffff;
    --on-warn: #ffffff;
    --on-bad: #ffffff;
    --paper: #fbf7ec;
    --paper-2: #f2ebda;
    --paper-edge: #e0d5bc;
    --hl: rgba(44, 92, 154, 0.13);
    --shadow: 0 14px 34px -16px rgba(22, 32, 43, 0.28);
    color-scheme: light;
  }
}

/* ---------- Base ---------- */
[hidden] { display: none !important; }
html { font-size: 106.25%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
p { margin: 0; }
b, strong { font-weight: 700; }

.app { display: grid; grid-template-columns: 96px minmax(0, 1fr); min-height: 100dvh; }
.main { min-width: 0; padding: 28px max(24px, env(safe-area-inset-right, 0px)) 48px 32px; outline: none; }
.screen { min-width: 0; }
.page { display: flex; flex-direction: column; gap: 24px; max-width: 1280px; }

/* ---------- Navigation ---------- */
.rail {
  position: sticky;
  top: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 16px 8px 12px max(8px, env(safe-area-inset-left, 0px));
  background: var(--surface);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  z-index: 30;
}
.brand { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 14px; color: var(--accent); }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; color: var(--text); letter-spacing: 0.01em; }
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 62px;
  padding: 8px 4px;
  border: 0;
  border-radius: 14px;
  background: none;
  color: var(--text-2);
  font: 600 0.74rem/1.1 var(--font-ui);
  cursor: pointer;
}
.nav-item:hover { color: var(--text); background: var(--surface-2); }
.nav-item.on { color: var(--accent-strong); background: var(--accent-soft); }
.nav-status { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 12px; font-size: 0.72rem; font-weight: 600; color: var(--text-2); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--text-3); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(108, 197, 150, 0.2); }
.dot.mid { background: var(--warn); }

.app.focus { grid-template-columns: minmax(0, 1fr); }
.app.focus .rail { display: none; }
.app.focus .main { padding-top: 0; padding-left: max(24px, env(safe-area-inset-left, 0px)); }

@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: fixed;
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    height: auto;
    flex-direction: row;
    justify-content: space-around;
    gap: 2px;
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
    border-right: 0;
    border-top: 1px solid var(--line);
    overflow: visible;
  }
  .brand, .nav-status { display: none; }
  .nav-item { flex: 1 1 0; min-width: 0; min-height: 56px; font-size: 0.68rem; }
  .main { padding: 22px max(16px, env(safe-area-inset-right, 0px)) calc(104px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .app.focus .main { padding-bottom: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (max-width: 560px) { .nav-item span { display: none; } }

/* ---------- Typographie ---------- */
.display {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(2rem, 4.2vw, 3rem);
  line-height: 1.04;
  letter-spacing: -0.012em;
  margin: 0;
  text-wrap: balance;
}
.display-sm { font-family: var(--font-display); font-weight: 600; font-size: 1.9rem; line-height: 1.1; margin: 0.15em 0 0.3em; text-wrap: balance; }
.eyebrow { font-size: 0.76rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 0 0 0.45rem; }
.h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.7rem; margin: 0; }
.h2 { font-size: 1.1rem; font-weight: 700; margin: 0 0 0.2rem; }
.h3 { font-size: 1rem; font-weight: 700; margin: 0.6rem 0 0.2rem; }
.lead { font-size: 1.14rem; max-width: 62ch; }
.muted { color: var(--text-2); }
.sub { color: var(--text-3); font-size: 0.85rem; }
.lab, dt { display: block; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-2); }
.mono { font-family: var(--font-mono); font-size: 0.9rem; }
.page-head { display: flex; flex-direction: column; gap: 2px; }
.page-head .sub { font-size: 1rem; margin-top: 6px; color: var(--text-2); }

/* ---------- Boutons et contrôles ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 52px;
  padding: 0 1.2rem;
  border: 1px solid transparent;
  border-radius: 13px;
  font: 700 1rem/1.15 var(--font-ui);
  cursor: pointer;
  text-align: center;
  transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.08s;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.secondary { background: var(--surface-2); color: var(--text); border-color: var(--line); }
.btn.secondary:hover { border-color: var(--accent); }
.btn.ghost { background: transparent; color: var(--text-2); }
.btn.ghost:hover { color: var(--text); background: var(--surface-2); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.big { min-height: 60px; padding: 0 1.5rem; font-size: 1.08rem; }
.btn.sm { min-height: 48px; padding: 0 0.95rem; font-size: 0.94rem; }
.btn.xs { min-height: 48px; padding: 0 0.75rem; font-size: 0.86rem; }
.btn.pulse { animation: pulse 1.3s ease-in-out infinite; }
.icon-btn {
  flex: none;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text);
  cursor: pointer;
}
.icon-btn:hover { border-color: var(--accent); }
.ic { flex: none; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.actions.wrap { gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.row.slim { margin: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 48px;
  padding: 0 1rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text);
  font: 600 0.95rem var(--font-ui);
  cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip b { font-family: var(--font-display); font-size: 1.1rem; margin-right: 2px; }

.stepper { display: inline-flex; align-items: stretch; align-self: flex-start; border: 1px solid var(--line); border-radius: 13px; overflow: hidden; background: var(--surface-2); }
.st-btn { width: 52px; min-height: 52px; border: 0; background: none; color: var(--text); cursor: pointer; display: grid; place-items: center; }
.st-btn:hover { background: var(--surface-3); }
.st-val { min-width: 4.4ch; display: flex; align-items: center; justify-content: center; gap: 2px; padding: 0 0.5rem; border-inline: 1px solid var(--line); font-weight: 700; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.st-val small { font-size: 0.8rem; font-weight: 600; color: var(--text-2); }
.stepper.big .st-btn { width: 60px; min-height: 60px; }
.stepper.big .st-val { font-size: 1.6rem; min-width: 3.4ch; }

.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.form { display: flex; flex-direction: column; gap: 18px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; }
.input {
  width: 100%;
  min-height: 52px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text);
}
textarea.input { min-height: 96px; resize: vertical; line-height: 1.45; }
select.input { padding-right: 10px; }
.code { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: 0.84rem/1.45 var(--font-mono); resize: vertical; margin-top: 10px; }
.range { width: 100%; min-height: 48px; accent-color: var(--accent); }
.switch { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw-track { position: relative; flex: none; width: 52px; height: 30px; border-radius: 999px; background: var(--surface-3); transition: background-color 0.2s; }
.sw-track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--text); transition: left 0.2s, background-color 0.2s; }
.switch input:checked + .sw-track { background: var(--accent); }
.switch input:checked + .sw-track::after { left: 25px; background: var(--on-accent); }
.switch input:focus-visible + .sw-track { outline: 3px solid var(--accent); outline-offset: 2px; }

.pill { display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.03em; white-space: nowrap; }
.pill.ok { background: rgba(108, 197, 150, 0.18); color: var(--ok); }
.pill.accent { background: var(--accent-soft); color: var(--accent-strong); }

/* ---------- Surfaces ---------- */
.card { display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 18px 20px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.card-head .h2 { margin: 0; }
.paper { background: var(--paper); color: var(--ink); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--paper-edge), var(--shadow); }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 14px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.banner > p { flex: 1 1 280px; }
.banner.warn { border-color: var(--warn); }
.banner.accent { border-color: var(--accent); background: var(--accent-soft); }
.banner.slim { padding: 10px 14px; }
.banner-act { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.empty { display: flex; flex-direction: column; gap: 12px; padding: 22px; border: 1px dashed var(--line); border-radius: 16px; }

/* ---------- Notation ---------- */
.nt { display: block; color: var(--ink); max-width: 100%; height: auto; }
.nt path { fill: currentColor; }
.nt .sl, .nt .ll, .nt .stem, .nt .bl { fill: none; stroke: currentColor; }
.nt .sl { stroke: var(--staff-ink); }
.nt .bar-hl { fill: var(--hl); opacity: 0; transition: opacity 0.12s; }
.nt .bar-hl.on { opacity: 1; }
.nt .n-ok, .nt .stem.n-ok { color: var(--ok-ink); }
.nt .n-near { color: var(--near-ink); }
.nt .n-off { color: var(--off-ink); }
.nt .n-bad { color: var(--bad-ink); }
.nt .n-miss { color: var(--miss-ink); opacity: 0.75; }
.nt .hm { cursor: pointer; }
.nt .hm-mark { fill: var(--bad-ink); }
.tempo { display: inline-flex; align-items: center; gap: 0.2em; white-space: nowrap; vertical-align: middle; }
.tempo .tnote { display: block; }
.tempo-eq { font-variant-numeric: tabular-nums lining-nums; }
.stage { position: relative; display: grid; place-items: center; min-height: min(46vh, 440px); padding: 12px; overflow: hidden; }
.stage .nt { width: min(100%, 600px); }
.score-paper { padding: 14px 10px; overflow-x: auto; min-height: 120px; }
.score-paper .nt { width: 100%; }
.pause-veil { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(231, 223, 204, 0.88); color: var(--ink); font: 600 1.7rem var(--font-display); z-index: 2; }

/* ---------- Accueil ---------- */
.home-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.paper-card { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 26px 28px; box-shadow: inset 0 0 0 1px var(--paper-edge), var(--shadow); }
.tn-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.tn-title { font-family: var(--font-display); font-weight: 600; font-size: 2rem; margin: 0; }
.tn-sub { color: var(--ink-2); margin-top: 2px; }
.program-list { list-style: none; margin: 18px 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.program-list li { display: grid; grid-template-columns: 2.2rem auto minmax(1rem, 1fr) auto; grid-template-areas: 'n t dots m' '. d d d'; column-gap: 10px; align-items: baseline; }
.pl-n { grid-area: n; font-family: var(--font-display); font-size: 1.7rem; line-height: 1; color: var(--accent); }
.pl-t { grid-area: t; font-weight: 700; font-size: 1.08rem; }
.pl-dots { grid-area: dots; border-bottom: 2px dotted var(--line); transform: translateY(-5px); }
.pl-m { grid-area: m; font-weight: 700; font-variant-numeric: tabular-nums; }
.pl-d { grid-area: d; color: var(--text-2); font-size: 0.96rem; line-height: 1.5; }
.paper-card .pl-n { color: var(--cur-ink); }
.paper-card .pl-dots { border-color: var(--paper-edge); }
.paper-card .pl-d { color: var(--ink-2); }
.paper-card .btn.primary { background: var(--cur-ink); color: #fff; }
.paper-card .btn.primary:hover { background: #234c80; }
.paper-card .btn.secondary { background: transparent; color: var(--ink); border-color: var(--paper-edge); }
.paper-card .pill { background: rgba(28, 26, 22, 0.08); color: var(--ink-2); }
.paper-card .pill.ok { background: rgba(28, 116, 72, 0.14); color: var(--ok-ink); }
.paper-card .pill.accent { background: rgba(44, 92, 154, 0.14); color: var(--cur-ink); }
.side-tiles { display: grid; gap: 14px; }
.tile { display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); text-align: left; }
.tile .lab { display: flex; align-items: center; gap: 6px; }
.tile-big { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 600; font-size: 2.5rem; line-height: 1.1; }
.tile-big small { font-family: var(--font-ui); font-size: 1rem; font-weight: 600; color: var(--text-2); }
.tile-mid { font-size: 1.2rem; }
.tile-btn { cursor: pointer; }
.tile-btn:hover { border-color: var(--accent); }
.tile-btn.ok { border-color: rgba(108, 197, 150, 0.5); }
.tile-btn.ok .tile-mid { color: var(--ok); }
.free-strip { display: flex; flex-direction: column; gap: 12px; }
.free-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .free-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .free-grid { grid-template-columns: minmax(0, 1fr); } }
.free-tile {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-areas: 'i t' 'i d';
  column-gap: 14px;
  row-gap: 2px;
  align-items: center;
  min-height: 86px;
  padding: 16px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.free-tile:hover { border-color: var(--accent); }
.free-tile .ic { grid-area: i; color: var(--accent); }
.ft-t { grid-area: t; font-weight: 700; }
.ft-d { grid-area: d; color: var(--text-2); font-size: 0.88rem; line-height: 1.35; }
.free-grid.big .free-tile { min-height: 110px; }

/* ---------- Séance ---------- */
.session { display: flex; flex-direction: column; gap: 16px; }
.sbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.sbar.quiet .steps, .sbar.quiet .sbar-right { opacity: 0.45; pointer-events: none; }
.sbar-right { display: flex; align-items: center; gap: 10px; }
.steps { flex: 1; min-width: 0; display: flex; gap: 6px; margin: 0; padding: 0; list-style: none; overflow-x: auto; scrollbar-width: none; }
.steps li { flex: 1 1 0; min-width: 0; }
.step {
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 52px;
  padding: 0 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text-2);
  font: 600 0.95rem var(--font-ui);
  white-space: nowrap;
  overflow: hidden;
  cursor: pointer;
}
.steps.diag .step { cursor: default; }
.step.cur { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
.step-n { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font-size: 0.84rem; font-weight: 700; }
.step.done .step-n { background: var(--ok); color: var(--on-ok); }
.step.skipped { opacity: 0.6; }
.step.cur .step-n { background: var(--accent); color: var(--on-accent); }
.step-l { overflow: hidden; text-overflow: ellipsis; }
.step-m { margin-left: auto; color: var(--text-3); font-size: 0.8rem; }
.step-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
.timer { font-family: var(--font-display); font-weight: 600; font-size: 2.2rem; line-height: 1; min-width: 3.6ch; text-align: right; font-variant-numeric: tabular-nums lining-nums; }
.timer.over { color: var(--warn); }
.timer.paused { opacity: 0.45; }
@media (max-width: 1280px) { .step-m { display: none; } }
@media (max-width: 899px) {
  .sbar { flex-wrap: wrap; }
  .steps { order: 3; flex-basis: 100%; }
  .step-l { display: none; }
  .step.cur .step-l { display: inline; }
  .sbar-right { margin-left: auto; }
  .steps li:has(.step.cur) { flex-grow: 2.4; }
}
@media (max-width: 560px) {
  .hide-narrow { display: none; }
  #ss-next { width: 52px; padding: 0; }
  .sbar { gap: 8px; }
  .sbar-right { gap: 8px; }
  .timer { font-size: 1.8rem; }
}
.sbody { min-width: 0; }

/* Exercice de notes */
.drill { display: flex; flex-direction: column; gap: 14px; }
.drill-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.drill-set { color: var(--text-2); font-weight: 600; }
.feedback { min-height: 1.6em; margin: 4px 0; font-size: 1.22rem; font-weight: 700; text-align: center; text-wrap: balance; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }
.feedback.info { color: var(--accent); }
.feedback.left { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; text-align: left; font-size: 1.02rem; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.metrics.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metric { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.metric b { font-size: 1.75rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
.metric.good b, .metric.good .sub { color: var(--ok); }
.metric.alert { border-color: var(--bad); }
.metric.alert b { color: var(--bad); }
.done-card { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--ink); padding: 20px; }
.done-card .eyebrow { color: var(--cur-ink); }
.done-card .big-num small { color: var(--ink-2); }

/* Déchiffrage */
.reading { display: flex; flex-direction: column; gap: 14px; }
.never-strip { padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-display); font-style: italic; font-size: 1.3rem; text-align: center; }
.never-strip.slim { font-size: 1.1rem; padding: 6px 12px; }
.reading:has(.pr.play) > .never-strip { display: none; }
.piece-rail { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 10px; }
.piece-rail:empty { display: none; }
.pc { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.pc-n { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font-weight: 700; }
.pc-txt { display: flex; flex-direction: column; min-width: 0; }
.pc-l { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-r { color: var(--text-2); font-size: 0.85rem; }
.pc.cur { border-color: var(--accent); }
.pc.cur .pc-n { background: var(--accent); color: var(--on-accent); }
.pc.done .pc-n { background: var(--ok); color: var(--on-ok); }
.pr { display: flex; flex-direction: column; gap: 20px; }
.pr-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 20px; }
.pr-title { font-family: var(--font-display); font-weight: 600; font-size: 1.8rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.pr-tempo { display: flex; align-items: center; gap: 12px; font-size: 1.45rem; font-weight: 700; }
.analyse { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; }
.ring { position: relative; width: 210px; height: 210px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface-3); stroke-width: 8; }
.ring-fg { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.2s linear; }
.ring-txt { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-txt b { font-family: var(--font-display); font-weight: 600; font-size: 4.2rem; line-height: 1; font-variant-numeric: tabular-nums lining-nums; }
.ring-txt span { color: var(--text-2); }
.analyse-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.checklist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
.check { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font-weight: 600; text-align: left; cursor: pointer; }
.check .ic { opacity: 0.25; }
.check.on { color: var(--text); border-color: var(--ok); }
.check.on .ic { opacity: 1; color: var(--ok); }
.hint { color: var(--text-3); font-size: 0.92rem; }
.never { font-family: var(--font-display); font-style: italic; font-size: clamp(1.6rem, 3.4vw, 2.5rem); line-height: 1.15; text-align: center; text-wrap: balance; }
.beat-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.beat { width: 168px; height: 168px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-family: var(--font-display); font-weight: 600; font-size: 4.6rem; line-height: 1; font-variant-numeric: lining-nums; }
.beat.count { color: var(--accent); border-color: var(--accent); }
.beat.downbeat { border-color: var(--text); }
.beat.hit { animation: hit 0.22s ease-out; }
.beat.small { width: 76px; height: 76px; font-size: 2.1rem; }
.beat-sub { color: var(--text-2); font-weight: 600; }
.review-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 18px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px 22px; margin: 0; }
.facts div { display: flex; flex-direction: column; gap: 2px; }
.facts dd { margin: 0; font-size: 1.02rem; }
.summary { display: flex; flex-direction: column; gap: 16px; }
.verdict { display: flex; flex-direction: column; gap: 4px; padding: 18px 20px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
.verdict.up { border-color: var(--ok); }
.verdict.down { border-color: var(--warn); }
.verdict .btn { align-self: flex-start; margin-top: 8px; }
.verdict-main { display: flex; align-items: center; gap: 14px; font-family: var(--font-display); font-weight: 600; font-size: 2.5rem; line-height: 1.1; }
.delta { padding: 4px 12px; border-radius: 999px; background: var(--surface-3); font: 700 1rem var(--font-ui); }
.verdict.up .delta { background: var(--ok); color: var(--on-ok); }
.verdict.down .delta { background: var(--warn); color: var(--on-warn); }
.impro { display: flex; flex-direction: column; gap: 12px; }
.degrees { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
.degrees li { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.degrees b { font-family: var(--font-display); font-size: 1.4rem; margin-right: 6px; }
.big-clock { font-family: var(--font-display); font-weight: 600; font-size: 4.2rem; line-height: 1; font-variant-numeric: tabular-nums lining-nums; }
.big-num { font-family: var(--font-display); font-weight: 600; font-size: 2.7rem; line-height: 1; margin: 0; font-variant-numeric: lining-nums; }
.big-num small { font-family: var(--font-ui); font-size: 1rem; font-weight: 600; color: var(--text-2); }

/* Rythme, motifs, déchiffrage généré */
.rhythm, .motifs, .gen { display: flex; flex-direction: column; gap: 14px; }
.opts { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 22px; }
.opts .field { min-width: 0; }
.tap-pad { width: 100%; min-height: 128px; border-radius: 18px; border: 2px dashed var(--accent); background: var(--accent-soft); color: var(--text); font: 700 1.4rem var(--font-ui); cursor: pointer; touch-action: none; }
.tap-pad.hit { animation: hit 0.18s ease-out; }
.history:empty { display: none; }
.tries { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 0; padding: 0; list-style: none; }
.tries li { display: flex; flex-direction: column; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.tries b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.tries span { color: var(--text-2); font: 0.78rem var(--font-mono); }
.motif-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.motif-head .eyebrow { margin: 0; }
.marks { display: flex; gap: 6px; margin: 0; padding: 0; list-style: none; }
.marks li { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--line); }
.marks li.ok { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.marks li.ko { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.timebar { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.timebar span { display: block; width: 0; height: 100%; background: var(--accent); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--text-2); font-size: 0.88rem; }
.lg { display: inline-block; width: 14px; height: 14px; margin-right: 4px; border-radius: 50%; vertical-align: -2px; }
.lg.ok { background: var(--ok-ink); }
.lg.near { background: var(--near-ink); }
.lg.off { background: var(--off-ink); }
.lg.bad { background: var(--bad-ink); }
.lg.miss { background: var(--miss-ink); }
.lg.none { background: rgba(140, 133, 120, 0.45); }

/* Compte rendu */
.report { display: flex; flex-direction: column; gap: 18px; }
.report-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 26px; align-items: start; }
.report-grid > section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.report-form { gap: 18px !important; }
.saved { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.saved .table-wrap, .saved .verdict { align-self: stretch; }

/* Tableaux */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.tbl thead th { background: var(--surface); color: var(--text-2); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; }
.tbl tbody th { font-weight: 700; }
.tbl .num { text-align: right; }
.tbl tbody tr:last-child > * { border-bottom: 0; }
.diag-tbl th small { display: block; color: var(--text-3); font-weight: 500; letter-spacing: 0; text-transform: none; }

/* ---------- Progrès ---------- */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)); gap: 16px; }
.chart { margin: 0; padding: 14px 16px 8px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
.chart figcaption { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-weight: 700; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--text-3); font: 12px var(--font-ui); }
.chart .line { fill: none; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { stroke: none; opacity: 0.13; }
.chart .end { stroke: var(--surface); stroke-width: 2.5; }
.chart .endlab { font: 700 13px var(--font-ui); }
.chart .s0.line { stroke: var(--accent); }
.chart .s0.area, .chart .s0.end, .chart .s0.endlab, .chart .s0.bar { fill: var(--accent); }
.chart .s1.line { stroke: var(--series-2); }
.chart .s1.area, .chart .s1.end, .chart .s1.endlab, .chart .s1.bar { fill: var(--series-2); }
.chart.example svg { opacity: 0.5; }
.chart-empty { padding: 30px 0; text-align: center; }
.legend-row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 4px; color: var(--text-2); font-size: 0.88rem; }
.sw { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border-radius: 3px; vertical-align: -1px; }
.sw.s0 { background: var(--accent); }
.sw.s1 { background: var(--series-2); }
.heat-wrap { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 12px; overflow-x: auto; }
.heat-wrap .nt { width: min(100%, 860px); }
.slow-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
.slow-list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 10px; align-items: baseline; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.slow-list b { font-size: 1.1rem; }
.slow-list .num { font-variant-numeric: tabular-nums; font-weight: 700; }
.slow-list .muted { grid-column: 1 / -1; font-size: 0.8rem; }

/* ---------- Programme ---------- */
.weeks { display: grid; gap: 10px; }
.week { border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.week.cur { border-color: var(--accent); }
.week summary { display: grid; grid-template-columns: 40px auto auto minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 58px; padding: 10px 16px; list-style: none; cursor: pointer; }
.week summary::-webkit-details-marker { display: none; }
.wk-n { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-3); font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; }
.week.cur .wk-n { background: var(--accent); color: var(--on-accent); }
.wk-t { font-weight: 700; white-space: nowrap; }
.wk-p { color: var(--text-2); font-size: 0.85rem; white-space: nowrap; }
.wk-c { min-width: 0; overflow: hidden; color: var(--text-2); text-overflow: ellipsis; white-space: nowrap; }
.wk-done { color: var(--ok); font-weight: 700; font-variant-numeric: tabular-nums; }
.week-body { display: flex; flex-direction: column; gap: 14px; padding: 4px 16px 18px; }
.piece-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.piece-chips .chip { min-width: 68px; }
.program-top { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); align-items: end; gap: 18px; }
@media (max-width: 760px) {
  .week summary { grid-template-columns: 40px minmax(0, 1fr) auto; }
  .wk-p, .wk-c { display: none; }
  .program-top { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- MIDI, réglages, diagnostic ---------- */
.midi-grid, .settings-grid, .diag-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 390px), 1fr)); gap: 16px; align-items: start; }
.status { display: flex; align-items: flex-start; gap: 14px; }
.status .dot { margin-top: 7px; }
.status .h2 { margin-bottom: 4px; }
.ports { display: grid; gap: 8px; }
.port { display: flex; flex-direction: column; gap: 2px; min-height: 56px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); text-align: left; cursor: pointer; }
.port span { color: var(--text-2); font-size: 0.85rem; }
.port.on { border-color: var(--accent); background: var(--accent-soft); }
.monitor { display: flex; flex-direction: column; gap: 4px; max-height: 300px; margin: 0; padding: 0; overflow: auto; list-style: none; }
.monitor li { display: grid; grid-template-columns: 5.5rem 4.6rem 4.6rem minmax(0, 1fr); align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); }
.monitor li:first-child:not(.muted) { box-shadow: inset 0 0 0 1px var(--accent); }
.monitor .tag { justify-self: end; color: var(--text-2); font-size: 0.78rem; }
.mini-kbd { display: flex; align-items: center; justify-content: center; min-height: 84px; padding: 8px; }
.mini-kbd .muted { color: var(--ink-2); }
.lat-row { display: flex; align-items: center; gap: 20px; }
.mic-row { display: flex; align-items: center; gap: 14px; }
.meter-bar { position: relative; flex: 1; height: 14px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.meter-bar span { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ok); }
.meter-bar i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--warn); }
.help-list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding-left: 1.3rem; }
.help-list li::marker { color: var(--accent); font-family: var(--font-display); font-weight: 600; }
.test-list { display: flex; flex-direction: column; gap: 10px; margin: 0; padding-left: 1.4rem; }
.test-list li::marker { color: var(--accent); font-family: var(--font-display); font-weight: 600; }
.test-list span { display: block; color: var(--text-2); font-size: 0.93rem; }
.diag-intro { display: flex; flex-direction: column; gap: 12px; max-width: 780px; }
.topo { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.glance-pad { width: min(100%, 440px); min-height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 24px; border: 2px solid var(--accent); background: var(--accent-soft); color: var(--text); font: 700 1.3rem var(--font-ui); cursor: pointer; }
.glance-pad b { font-family: var(--font-display); font-weight: 600; font-size: 3.8rem; line-height: 1; }
.ex-bar { display: flex; align-items: center; gap: 12px; }
.ex-bar .h1 { flex: 1; min-width: 0; }

/* ---------- Clavier à l'écran ---------- */
.kbd-dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.app:not(.focus) .kbd-dock { left: 96px; }
.kbd-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; color: var(--text-2); font-size: 0.85rem; }
.kbd-bar > span { flex: 1; min-width: 0; }
.kbd { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); height: 150px; touch-action: none; }
.k { cursor: pointer; border: 0; padding: 0; }
.k.w { position: relative; display: flex; align-items: flex-end; justify-content: center; margin: 0 1px; padding-bottom: 6px; border: 1px solid #b6ab93; border-top: 0; border-radius: 0 0 8px 8px; background: linear-gradient(#f7f2e6, #ece3cf); color: #57524a; }
.k.b { position: absolute; top: 0; z-index: 2; width: calc(100% / var(--n) * 0.6); height: 62%; border: 1px solid #000; border-radius: 0 0 6px 6px; background: linear-gradient(#2b2e34, #111316); }
.k.w.down { background: var(--accent-strong); }
.k.b.down { background: var(--accent); }
.k-lab { font-size: 0.72rem; font-weight: 700; }
body.has-kbd .main { padding-bottom: 240px; }
body.has-kbd .toast { bottom: calc(210px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 899px) {
  .app:not(.focus) .kbd-dock { left: 0; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
  .kbd { height: 130px; }
  body.has-kbd .main { padding-bottom: 300px; }
}

/* ---------- Boîtes de dialogue et notifications ---------- */
.modal-wrap {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(5, 7, 10, 0.62);
}
.modal { width: min(560px, 100%); max-height: calc(100dvh - 32px); overflow: auto; padding: 22px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.modal.wide { width: min(840px, 100%); }
.modal-title { margin: 0 0 12px; font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; }
.modal-body { display: flex; flex-direction: column; gap: 12px; }
.modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  z-index: 70;
  max-width: min(92vw, 560px);
  padding: 12px 18px;
  border-radius: 12px;
  background: var(--text);
  color: var(--bg);
  font-weight: 700;
  opacity: 0;
  transform: translate(-50%, 16px);
  transition: opacity 0.25s, transform 0.25s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 899px) { .app:not(.focus) ~ .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); } }

/* ---------- Mises en page étroites ---------- */
@media (max-width: 899px) {
  .home-grid, .report-grid { grid-template-columns: minmax(0, 1fr); }
  .paper-card { padding: 20px; }
}
@media (max-width: 700px) {
  .analyse { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  .checklist { grid-template-columns: minmax(0, 1fr); }
  .metrics.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .metric b { font-size: 1.4rem; }
  .beat { width: 132px; height: 132px; font-size: 3.6rem; }
  .ring { width: 170px; height: 170px; }
  .monitor li { grid-template-columns: 4.6rem 4rem minmax(0, 1fr); }
  .monitor li .mono:nth-of-type(2) { display: none; }
}

/* ---------- Animations ---------- */
@keyframes hit { from { transform: scale(1.07); background: var(--surface-3); } to { transform: scale(1); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(143, 178, 221, 0.55); } 50% { box-shadow: 0 0 0 12px rgba(143, 178, 221, 0); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

const Core = (() => {
  'use strict';

  /* ---------- Utilitaires numériques ---------- */
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const sum = (a) => a.reduce((s, x) => s + x, 0);
  const mean = (a) => (a.length ? sum(a) / a.length : null);

    if (!a.length) return null;

  function std(a) {

  const choice = (rng, arr) => arr[Math.floor(rng() * arr.length)];
  const round1 = (x) => (x == null ? null : Math.round(x * 10) / 10);

  /* ---------- Dates (calendrier local, midi pour éviter les pièges de l'heure d'été) ---------- */
  function isoDate(d = new Date()) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function parseISO(s) {

  }
  const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
  /** 0 = lundi … 6 = dimanche */
  const weekday = (iso) => (parseISO(iso).getDay() + 6) % 7;

  function programWeek(startISO, iso) {
    const d = daysBetween(startISO, iso);
    return d < 0 ? 0 : Math.floor(d / 7) + 1;
  }
  function phaseOfWeek(w) {
    if (w <= 0) return 0;
    if (w <= 4) return 1;
    if (w <= 8) return 2;
    return 3;
  }
  const PHASE_NAMES = ['Diagnostic de départ', 'Fondations', 'Motifs', 'Fluidité'];
  function weekRange(startISO, w) {
    const s = addDays(startISO, (Math.max(1, w) - 1) * 7);
    return { start: s, end: addDays(s, 5) };

  function prevScheduled(iso) {

  }
  function nextScheduled(iso) {

    if (weekday(d) === 6) d = addDays(d, 1);

  }
  /** Série de jours de séance consécutifs (le dimanche ne casse pas la série). */
  function streak(dates, todayISO) {

    let n = 0;
    while (set.has(d) && n < 2000) {
      n++;
      d = prevScheduled(d);
    }
    return n;
  }

  /* ---------- Notes, noms, portées ---------- */
  const STEP_NAMES = ['do', 'ré', 'mi', 'fa', 'sol', 'la', 'si'];
  const STEP_LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const STEP_SEMI = [0, 2, 4, 5, 7, 9, 11];
  const spelledToMidi = (n) => (n.oct + 1) * 12 + STEP_SEMI[n.step] + (n.alt || 0);
  const diatonic = (n) => n.oct * 7 + n.step;
  /** Index diatonique de la ligne du bas : mi4 (clé de sol), sol2 (clé de fa). */
  const CLEF_BASE = { treble: 30, bass: 18 };
  const staffPos = (clef, n) => diatonic(n) - CLEF_BASE[clef];
  function fromStaffPos(clef, p) {
    const d = p + CLEF_BASE[clef];
    return { step: ((d % 7) + 7) % 7, oct: Math.floor(d / 7), alt: 0 };
  }
  function midiToSpelled(midi, pref = 'sharp') {
    const pc = ((midi % 12) + 12) % 12;
    const oct = Math.floor(midi / 12) - 1;
    const nat = STEP_SEMI.indexOf(pc);
    if (nat >= 0) return { step: nat, oct, alt: 0 };
    if (pref === 'flat') return { step: STEP_SEMI.indexOf(pc + 1), oct, alt: -1 };
    return { step: STEP_SEMI.indexOf(pc - 1), oct, alt: 1 };
  }
  const ACC_SIGNS = { '-2': '𝄫', '-1': '♭', 0: '', 1: '♯', 2: '𝄪' };
  /** Nom français : « fa♯3 ». octaves = 'fr' (do central = do3) ou 'intl' (do central = do4). */
  function noteLabel(n, { octaves = 'fr', withOct = true } = {}) {
    const o = octaves === 'fr' ? n.oct - 1 : n.oct;
    return STEP_NAMES[n.step] + (ACC_SIGNS[n.alt || 0] || '') + (withOct ? String(o) : '');
  }
  const midiLabel = (midi, opts) => noteLabel(midiToSpelled(midi), opts);
  const noteKey = (clef, n) => `${clef}:${STEP_LETTERS[n.step]}${n.alt > 0 ? '#' : n.alt < 0 ? 'b' : ''}${n.oct}`;

  /** Plage de positions sur la portée : 0 = ligne du bas, 8 = ligne du haut. */
  function rangeForLedger(ledger) {
    const l = clamp(ledger | 0, 0, 4);
    return l === 0 ? [0, 8] : [-2 * l, 8 + 2 * l];
  }
  /** Toutes les notes candidates pour une clé et un nombre de lignes supplémentaires. */
  function noteCandidates({ clef, ledger = 0, accidentals = false }) {
    const [lo, hi] = rangeForLedger(ledger);
    const out = [];
    for (let p = lo; p <= hi; p++) {
      const nat = fromStaffPos(clef, p);
      const alts = accidentals ? [0, 1, -1] : [0];
      for (const alt of alts) {
        if (alt === 1 && (nat.step === 2 || nat.step === 6)) continue; // ni mi♯ ni si♯
        if (alt === -1 && (nat.step === 3 || nat.step === 0)) continue; // ni fa♭ ni do♭
        const n = { step: nat.step, oct: nat.oct, alt };
        out.push({ clef, p, ...n, midi: spelledToMidi(n), key: noteKey(clef, n) });
      }
    }
    return out;
  }

  /* ---------- Répétition espacée : statistiques et tirage pondéré ---------- */
  /** Moyenne mobile exponentielle du temps de réaction et du taux d'erreur, par note. */
  function updateStat(st, { rt, ok, ts }) {
    const s = st ? { ...st } : { n: 0, ema: null, err: 0, last: 0 };
    const a = 0.3;
    s.ema = s.ema == null ? rt : s.ema * (1 - a) + rt * a;
    s.err = s.n === 0 ? (ok ? 0 : 1) : s.err * (1 - a) + (ok ? 0 : 1) * a;
    s.n += 1;
    s.last = ts;
    return s;
  }
  function globalMeanRt(stats) {
    const v = Object.values(stats || {}).filter((s) => s && s.n > 0 && s.ema != null).map((s) => s.ema);
    return v.length ? mean(v) : 2000;
  }
  /**
   * Poids d'une note dans le tirage. Plus la note est lente (par rapport à ta moyenne)
   * ou souvent ratée, plus elle revient. Une note jamais vue ou pas revue depuis
   * longtemps remonte aussi.
   */
  function noteWeight(st, gMean, now) {
    if (!st || !st.n) return 2.5;
    const slow = st.ema / (gMean || 2000);
    const days = (now - (st.last || 0)) / 86400000;
    let w = 0.5 + 1.5 * clamp(slow - 0.7, 0, 2.5) + 3 * clamp(st.err, 0, 1) + 0.6 * clamp(days / 3, 0, 1);
    if (st.n < 3) w += 0.8;
    return clamp(w, 0.25, 8);
  }
  function weightedIndex(weights, rng) {
    const tot = sum(weights);
    if (!(tot > 0)) return Math.floor(rng() * weights.length);
    let r = rng() * tot;
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r < 0) return i;
    }
    return weights.length - 1;
  }
  /** Tire une note en évitant la clé et la hauteur de la note précédente. */
  function pickWeighted(cands, stats, rng, { now = Date.now(), avoidKey = null, avoidMidi = null } = {}) {
    let pool = cands.filter((c) => c.key !== avoidKey && c.midi !== avoidMidi);
    if (!pool.length) pool = cands;
    const g = globalMeanRt(stats);
    const weights = pool.map((c) => noteWeight(stats && stats[c.key], g, now));
    return pool[weightedIndex(weights, rng)];
  }

  /* ---------- MIDI ---------- */
  /**
   * Décode un message MIDI brut. Note On de vélocité 0 = Note Off.
   * Horloge (F8), active sensing (FE), SysEx (F0) et autres messages système : ignorés.
   */
  function parseMidi(data) {
    if (!data || data.length < 1) return { type: 'ignore', reason: 'empty' };
    const st = data[0];
    if (st >= 0xf0) {
      const reason = st === 0xf8 ? 'clock' : st === 0xfe ? 'active' : st === 0xf0 || st === 0xf7 ? 'sysex' : 'system';
      return { type: 'ignore', reason };
    }
    if (st < 0x80) return { type: 'ignore', reason: 'data' };
    const hi = st & 0xf0;
    const channel = st & 0x0f;
    if ((hi === 0x90 || hi === 0x80) && data.length >= 3) {
      const note = data[1] & 0x7f;
      const velocity = data[2] & 0x7f;
      if (hi === 0x90 && velocity > 0) return { type: 'noteon', note, velocity, channel };
      return { type: 'noteoff', note, velocity, channel };

  /**

  class ChordMatcher {

      this.windowMs = windowMs;
      this.want = new Set(target.map((m) => this.id(m)));

      return this.tol ? ((m % 12) + 12) % 12 : m;
    }
    reset() {
      this.got = new Set();
      this.lastT = -Infinity;
    }
    feed(midi, t) {
      const id = this.id(midi);
      if (!this.want.has(id)) {
        this.reset();
        return { status: 'wrong', midi };
      }
      if (t - this.lastT > this.windowMs) this.got = new Set();
      this.got.add(id);
      this.lastT = t;
      for (const w of this.want) if (!this.got.has(w)) return { status: 'progress', have: this.got.size, need: this.want.size };
      return { status: 'correct' };
    }

  /* ---------- Mesures, tempo, métronome ---------- */
  function meterInfo(meter) {
    const [num, den] = String(meter || '4/4').split('/').map(Number);
    if (!num || !den || ![1, 2, 4, 8, 16].includes(den)) return meterInfo('4/4');

  /**

      this.startTime = startTime;
      this.countInBars = countInBars;
      this.i = 0;
    }

    get t0() {
      return this.startTime + this.countInBars * this.mi.beats * this.beatSec;
    }
    event(i) {
      const perBar = this.mi.beats * this.sub;
      const bar = Math.floor(i / perBar) - this.countInBars;
      const inBar = i % perBar;
      const beat = Math.floor(inBar / this.sub);
      const sub = inBar % this.sub;
      const kind = sub !== 0 ? 'sub' : beat === 0 ? 'bar' : 'beat';
      return { i, time: this.startTime + i * this.unitSec, bar, beat, sub, kind, countIn: bar < 0 };

  /** Règle de tempo : 3 pièces sans arrêt et ≤ 2 fausses notes → +6 ; plus de 2 arrêts dans une pièce → −6. */

    if (done.some((p) => (p.stops || 0) > 2)) return { tempo: clamp(tempo - step, min, max), rule: 'down' };
    if (done.length >= 3 && done.every((p) => (p.stops || 0) === 0 && (p.wrong || 0) <= 2)) return { tempo: clamp(tempo + step, min, max), rule: 'up' };
    return { tempo, rule: 'same' };
  }

  /** Regroupe les attaques quasi simultanées (accords) : seuil 40 ms à partir de la première. */
  function clusterOnsets(times, gap = 40) {
    const s = [...times].filter((t) => Number.isFinite(t)).sort((a, b) => a - b);
    const out = [];

    return out;
  }
  /**
   * Arrêts : un silence (aucune attaque) de plus de N temps entre deux attaques.
   * Une marge d'un quart de temps évite de compter une blanche jouée un peu en retard.
   */
  function detectStops(times, beatMsValue, nBeats = 2) {
    const on = clusterOnsets(times);
    const limit = (nBeats + 0.25) * beatMsValue;
    const allowed = nBeats * beatMsValue;
    const gaps = [];
    for (let i = 1; i < on.length; i++) {
      const g = on[i] - on[i - 1];
      if (g > limit) gaps.push({ start: on[i - 1], end: on[i], ms: g, beats: g / beatMsValue });
    }
    const spanMs = on.length > 1 ? on[on.length - 1] - on[0] : 0;
    const lost = sum(gaps.map((g) => g.ms - allowed));
    return { count: gaps.length, gaps, spanMs, playMs: Math.max(0, spanMs - lost), onsets: on.length, limitMs: limit };
  }
  /**
   * Régularité : écart de chaque attaque à la grille du métronome (subdivision la plus proche).
   * L'app ne connaît pas la partition : la grille est la seule référence possible.
   */
  function regularity(times, { t0, beatMs: bms, subdiv = 2, latencyMs = 0, tolMs } = {}) {
    const unit = bms / subdiv;
    const on = clusterOnsets(times)
      .map((t) => t - latencyMs)
      .filter((t) => t >= t0 - unit / 2);
    const tol = tolMs != null ? tolMs : Math.max(40, 0.1 * bms);
    const devs = on.map((t) => {
      const ph = (t - t0) / unit;
      return (ph - Math.round(ph)) * unit;
    });
    const abs = devs.map(Math.abs);
    return {
      n: devs.length,
      meanAbs: abs.length ? Math.round(mean(abs)) : null,
      medianAbs: abs.length ? Math.round(median(abs)) : null,
      signedMean: devs.length ? Math.round(mean(devs)) : null,

  /**

   */
  function scoreTimed(expectedMs, playedMs, { quarterMs, latencyMs = 0 } = {}) {

    const used = new Array(played.length).fill(false);
    const items = expectedMs.map((e, i) => {
      const prev = i > 0 ? expectedMs[i - 1] : -Infinity;
      const next = i < expectedMs.length - 1 ? expectedMs[i + 1] : Infinity;
      const win = Math.min(Math.max(nearTol * 1.6, 0.45 * quarterMs), (e - prev) / 2, (next - e) / 2);
      let best = -1;
      let bestD = Infinity;
      for (let j = 0; j < played.length; j++) {
        if (used[j]) continue;
        const d = Math.abs(played[j] - e);
        if (d <= win && d < bestD) {
          best = j;
          bestD = d;
        }
      }
      if (best < 0) return { expected: e, played: null, dev: null, state: 'missed' };
      used[best] = true;
      const dev = played[best] - e;
      const state = Math.abs(dev) <= okTol ? 'ok' : Math.abs(dev) <= nearTol ? 'near' : 'off';
      return { expected: e, played: played[best], dev: Math.round(dev), state };
    });
    const extra = used.filter((u) => !u).length;
    const matched = items.filter((i) => i.played != null);
    const ok = items.filter((i) => i.state === 'ok').length;
    const near = items.filter((i) => i.state === 'near').length;
    const score = items.length ? clamp(Math.round((100 * (ok + 0.5 * near)) / items.length - 8 * extra), 0, 100) : 0;
    return {
      items,
      extra,
      okTol: Math.round(okTol),
      nearTol: Math.round(nearTol),
      meanAbsDev: matched.length ? Math.round(mean(matched.map((i) => Math.abs(i.dev)))) : null,
      onTimePct: items.length ? Math.round((100 * ok) / items.length) : 0,
      score,
    };
  }

  /* ---------- Tonalités ---------- */
  const KEY_FIFTHS = { C: 0, G: 1, D: 2, A: 3, E: 4, F: -1, Bb: -2, Eb: -3, Ab: -4 };
  const KEY_TONIC = {
    C: { step: 0 }, G: { step: 4 }, D: { step: 1 }, A: { step: 5 }, E: { step: 2 },
    F: { step: 3 }, Bb: { step: 6 }, Eb: { step: 2 }, Ab: { step: 5 },
  };
  const KEY_NAMES = {
    C: 'do majeur', G: 'sol majeur', D: 'ré majeur', A: 'la majeur', E: 'mi majeur',
    F: 'fa majeur', Bb: 'si♭ majeur', Eb: 'mi♭ majeur', Ab: 'la♭ majeur',
  };
  const SHARP_ORDER = [3, 0, 4, 1, 5, 2, 6]; // fa do sol ré la mi si
  const FLAT_ORDER = [6, 2, 5, 1, 4, 0, 3]; // si mi la ré sol do fa
  function keyAlt(fifths, step) {
    if (fifths > 0) return SHARP_ORDER.slice(0, fifths).includes(step) ? 1 : 0;
    if (fifths < 0) return FLAT_ORDER.slice(0, -fifths).includes(step) ? -1 : 0;
    return 0;
  }
  /** Degré d (0 = tonique, peut être négatif) à partir de l'octave de base → note orthographiée. */
  function degreeNote(key, d, baseOct) {
    const t = KEY_TONIC[key] || KEY_TONIC.C;
    const idx = t.step + d;
    const step = ((idx % 7) + 7) % 7;
    const oct = baseOct + Math.floor(idx / 7);
    const n = { step, oct, alt: keyAlt(KEY_FIFTHS[key] || 0, step) };

  /* ---------- Pièces générées ---------- */
  const PATTERNS = {
    '4/4': {
      1: [[1, 1, 1, 1], [2, 1, 1], [1, 1, 2], [2, 2], [1, 2, 1], [3, 1]],
      2: [[0.5, 0.5, 1, 1, 1], [1, 0.5, 0.5, 1, 1], [1.5, 0.5, 1, 1], [1, 1, 1.5, 0.5], [0.5, 0.5, 0.5, 0.5, 2], [1, 1, 0.5, 0.5, 1]],
      3: [[0.5, 1, 0.5, 1, 1], [1.5, 0.5, 1.5, 0.5], [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 1], [1, 0.5, 0.5, 0.5, 0.5, 1]],
    },
    '3/4': {
      1: [[1, 1, 1], [2, 1], [1, 2]],
      2: [[0.5, 0.5, 1, 1], [1, 0.5, 0.5, 1], [1.5, 0.5, 1], [1, 1, 0.5, 0.5]],
      3: [[0.5, 0.5, 0.5, 0.5, 1], [1, 1.5, 0.5], [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]],
    },
    '2/4': {
      1: [[1, 1], [2]],
      2: [[0.5, 0.5, 1], [1, 0.5, 0.5], [1.5, 0.5]],
      3: [[0.5, 0.5, 0.5, 0.5], [0.5, 1, 0.5]],
    },
    '6/8': {
      1: [[1.5, 1.5], [1, 0.5, 1.5]],
      2: [[1, 0.5, 1, 0.5], [1.5, 1, 0.5], [0.5, 0.5, 0.5, 1.5]],
      3: [[0.5, 0.5, 0.5, 0.5, 0.5, 0.5], [1.5, 0.5, 0.5, 0.5], [1, 0.5, 0.5, 0.5, 0.5]],
    },
  };
  /** Cellules à doubles croches : réservées aux exercices de rythme de la phase 3. */
  const RHYTHM_EXTRA = {
    '4/4': [[0.25, 0.25, 0.5, 1, 1, 1], [0.75, 0.25, 1, 2]],
    '3/4': [[0.25, 0.25, 0.5, 1, 1]],
    '2/4': [[0.25, 0.25, 0.25, 0.25, 1], [0.75, 0.25, 1]],
    '6/8': [[0.75, 0.25, 0.5, 1.5]],
  };
  function patternsFor(meter, level) {
    const t = PATTERNS[meter] || PATTERNS['4/4'];
    let out = [];

  /* ---------- Programme ---------- */
  function defaultProgram() {

    const D3 = { clefMode: 'both', ledger: 2, accidentals: false, variant: 'mix' };
    const D4 = { clefMode: 'both', ledger: 3, accidentals: true, variant: 'mix' };

    for (let n = 1; n <= 12; n++) {
      let collection = '';
      let pieces = '';
      if (n === 1 || n === 2) collection = 'Türk, 120 Handstücke, vol. 1';
      if (n === 3 || n === 4) collection = 'Bartók, Pour les enfants (recueil hongrois)';
      if (n === 1 || n === 3) pieces = '1-18';
      if (n === 2 || n === 4) pieces = '19-36';
      const drill = n <= 2 ? D1 : n <= 4 ? D2 : n <= 8 ? D3 : D4;
      weeks.push({ n, phase: phaseOfWeek(n), collection, pieces, meter: '', drill: { ...drill } });
    }

      weeks,
      diagnostics: { 0: { collection: t, pieces: '51, 52' }, 4: { collection: t, pieces: '53, 54' }, 8: { collection: t, pieces: '55, 56' }, 12: { collection: t, pieces: '57, 58' } },

  function parsePieceList(str) {

      const m = s.match(/^(?:n[°o]\s*)?(\d+)\s*(?:-|–|à)\s*(\d+)$/i);
      if (m) {

        let b = +m[2];

      if (done.has(W)) continue;

      a4: 440,

  /* ---------- Carte de chaleur : une ronde par position, colorée ---------- */
