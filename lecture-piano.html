            if (this.running && this.onTick) this.onTick({ ...e, perf: this.toPerf(e.time) });
          }, Math.max(0, delay));
          this.timeouts.add(id);
        }
      }
    }
    setVolume(v) {
      this.volume = v;
    }
    stop() {
      this.running = false;
      if (this.timer) clearInterval(this.timer);
      this.timer = null;
      for (const id of this.timeouts) clearTimeout(id);
      this.timeouts.clear();
    }
  }

  return {
    context,
    unlock,
    perfAt,
    click,
    tone,
    chime,
    Metronome,
    get available() {
      return !!(window.AudioContext || window.webkitAudioContext);
    },
    get running() {
      return !!ctx && ctx.state === 'running';
    },
  };
})();


/* ===== input.js ===== */
/* ==========================================================================
   INPUT — une seule chaîne d'entrée pour toute l'app.
   Sources : MIDI (prioritaire) → micro (YIN) → clavier à l'écran → simulateur.
   Le simulateur et le clavier à l'écran fabriquent de vrais messages MIDI
   qui passent par le même décodeur que le Clavinova.
   Événements émis : { type: 'noteon'|'noteoff'|'cc'|'onset', midi, velocity, t, source }
   ========================================================================== */
const Input = (() => {
  'use strict';
  const subs = new Set();
  const statusSubs = new Set();
  const held = new Map();
  const counters = { received: 0, notes: 0, ignored: { clock: 0, active: 0, sysex: 0, system: 0, other: 0, data: 0, empty: 0 } };
  const log = [];
  let lastMidiAt = 0;

  function on(fn) {
    subs.add(fn);
    return () => subs.delete(fn);
  }
  function onStatus(fn) {
    statusSubs.add(fn);
    return () => statusSubs.delete(fn);
  }
  function notify() {
    for (const fn of [...statusSubs]) {
      try {
        fn();
      } catch (e) {
        console.error(e);
      }
    }
  }
  function emit(ev) {
    if (ev.type === 'noteon') {
      held.set(ev.midi, ev.source);
      counters.notes++;
      log.unshift({ ...ev, at: Date.now() });
      if (log.length > 14) log.pop();
    } else if (ev.type === 'noteoff') held.delete(ev.midi);
    for (const fn of [...subs]) {
      try {
        fn(ev);
      } catch (e) {
        console.error(e);
      }
    }
  }

  /* ---------- MIDI ---------- */
  const midi = { status: 'idle', access: null, ports: [], error: null, selected: 'all', poll: null, sig: '' };
  const midiSupported = () => typeof navigator !== 'undefined' && typeof navigator.requestMIDIAccess === 'function';

  function withTimeout(p, ms) {
    return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('Pas de réponse du navigateur')), ms))]);
  }
  async function enableMidi() {
    if (!midiSupported()) {
      midi.status = 'unsupported';
      notify();
      return false;
    }
    if (midi.access) {
      refreshPorts();
      return true;
    }
    midi.status = 'requesting';
    notify();
    try {
      const access = await withTimeout(navigator.requestMIDIAccess({ sysex: false }), 10000);
      midi.access = access;
      midi.status = 'ready';
      midi.error = null;
      const onState = () => refreshPorts();
      try {
        access.onstatechange = onState;
      } catch (e) {}
      try {
        if (access.addEventListener) access.addEventListener('statechange', onState);
      } catch (e) {}
      refreshPorts();
      // Filet de sécurité : certaines implémentations n'émettent jamais statechange.
      clearInterval(midi.poll);
      midi.poll = setInterval(refreshPorts, 2500);
      notify();
      return true;
    } catch (e) {
      midi.status = 'denied';
      midi.error = (e && (e.message || e.name)) || String(e);
      notify();
      return false;
    }
  }
  /** Liste les entrées, que l'API expose une Map, une fonction (ancienne spécification) ou un tableau. */
  function listInputs(access) {
    const out = [];
    try {
      let ins = access.inputs;
      if (typeof ins === 'function') ins = ins.call(access);
      if (!ins) return out;
      if (typeof ins.forEach === 'function') ins.forEach((p) => p && out.push(p));
      else if (typeof ins.values === 'function') for (const p of ins.values()) out.push(p);
      else if (Array.isArray(ins)) out.push(...ins);
    } catch (e) {}
    const seen = new Set();
    return out.filter((p) => {
      const id = p.id || p.name;
      if (seen.has(id)) return false;
      seen.add(id);
      return true;
    });
  }
  const attached = new WeakSet();
  function attach(port) {
    if (attached.has(port)) return;
    attached.add(port);
    const handler = (e) => onMidiMessage(e, port);
    let viaProp = false;
    try {
      port.onmidimessage = handler;
      viaProp = port.onmidimessage === handler;
    } catch (e) {}
    if (!viaProp && typeof port.addEventListener === 'function') port.addEventListener('midimessage', handler);
    try {
      const p = port.open && port.open();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  function refreshPorts() {
    if (!midi.access) return;
    const ins = listInputs(midi.access);
    ins.forEach(attach);
    midi.ports = ins.map((p) => ({ id: p.id || p.name, name: p.name || 'Entrée MIDI', manufacturer: p.manufacturer || '', state: p.state || 'connected', connection: p.connection || '' }));
    const sig = midi.ports.map((p) => `${p.id}|${p.state}|${p.connection}`).join(',');
    if (sig !== midi.sig) {
      midi.sig = sig;
      notify();
    }
  }
  function onMidiMessage(e, port) {
    const portId = port ? port.id || port.name : 'sim';
    if (midi.selected !== 'all' && !(port && port.__sim) && portId !== midi.selected) return;
    const data = e && (e.data || (e.detail && e.detail.data));
    const msg = Core.parseMidi(data);
    counters.received++;
    if (msg.type === 'ignore') {
      counters.ignored[msg.reason] = (counters.ignored[msg.reason] || 0) + 1;
      return;
    }
    const now = performance.now();
    let t = now;
    const ts = e && typeof e.timeStamp === 'number' ? e.timeStamp : e && typeof e.receivedTime === 'number' ? e.receivedTime : null;
    if (ts != null && ts > 0 && Math.abs(ts - now) < 300) t = ts;
    const source = port && port.__sim ? port.__sim : 'midi';
    if (source === 'midi') lastMidiAt = now;
    if (msg.type === 'noteon') emit({ type: 'noteon', midi: msg.note, velocity: msg.velocity, t, source });
    else if (msg.type === 'noteoff') emit({ type: 'noteoff', midi: msg.note, velocity: msg.velocity, t, source });
    else emit({ type: 'cc', controller: msg.controller, value: msg.value, t, source });
  }
  /** Simulateur et clavier à l'écran : de vrais octets MIDI, décodés comme ceux du piano. */
  const SIM_PORT = { __sim: 'sim', id: 'sim', name: 'Simulateur' };
  const TOUCH_PORT = { __sim: 'touch', id: 'touch', name: 'Clavier à l’écran' };
  function sendBytes(bytes, kind = 'sim') {
    onMidiMessage({ data: Uint8Array.from(bytes), timeStamp: performance.now() }, kind === 'touch' ? TOUCH_PORT : SIM_PORT);
  }
  function setPort(id) {
    midi.selected = id || 'all';
  }
  const hasMidiPort = () => midi.ports.some((p) => p.state !== 'disconnected');

  /* ---------- Micro ---------- */
  const mic = { status: 'off', stream: null, analyser: null, src: null, timer: null, buf: null, level: 0, pitch: null, gate: 0.02, a4: 440, tracker: null, onset: null, error: null };
  async function startMic({ gate = 0.02, a4 = 440 } = {}) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      mic.status = 'unsupported';
      notify();
      return false;
    }
    const c = Sound.context();
    if (!c) {
      mic.status = 'unsupported';
      notify();
      return false;
    }
    await Sound.unlock();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      stopMic(true);
      mic.stream = stream;
      mic.src = c.createMediaStreamSource(stream);
      mic.analyser = c.createAnalyser();
      mic.analyser.fftSize = 4096;
      mic.src.connect(mic.analyser);
      mic.buf = new Float32Array(mic.analyser.fftSize);
      mic.byteBuf = new Uint8Array(mic.analyser.fftSize);
      mic.gate = gate;
      mic.a4 = a4;
      mic.tracker = new Core.PitchTracker({ gate, stable: 3, a4 });
      mic.onset = new Core.OnsetDetector({ gate });
      mic.status = 'on';
      mic.error = null;
      mic.timer = setInterval(micFrame, 25);
      notify();
      return true;
    } catch (e) {
      mic.status = 'denied';
      mic.error = (e && (e.message || e.name)) || String(e);
      notify();
      return false;
    }
  }
  function micFrame() {
    const a = mic.analyser;
    if (!a) return;
    const buf = mic.buf;
    if (a.getFloatTimeDomainData) a.getFloatTimeDomainData(buf);
    else {
      a.getByteTimeDomainData(mic.byteBuf);
      for (let i = 0; i < buf.length; i++) buf[i] = (mic.byteBuf[i] - 128) / 128;
    }
    const tail = buf.subarray(buf.length - 1024);
    const rms = Core.rmsOf(tail);
    mic.level = rms;
    const t = performance.now();
    let freq = null;
    if (rms >= mic.gate) {
      const r = Core.yin(buf, Sound.context().sampleRate);
      if (r && r.clarity > 0.8) freq = r.freq;
    }
    mic.pitch = freq;
    const o = mic.onset.push(t, rms);
    if (o != null) emit({ type: 'onset', t: o - 20, source: 'mic' });
    const ev = mic.tracker.push({ t, rms, freq });
    if (ev) emit({ type: 'noteon', midi: ev.midi, velocity: 64, t: ev.t, source: 'mic', cents: ev.cents });
  }
  function stopMic(silent) {
    if (mic.timer) clearInterval(mic.timer);
    mic.timer = null;
    try {
      if (mic.src) mic.src.disconnect();
    } catch (e) {}
    if (mic.stream) mic.stream.getTracks().forEach((tr) => tr.stop());
    mic.stream = null;
    mic.analyser = null;
    mic.src = null;
    if (!silent) {
      mic.status = 'off';
      notify();
    }
  }
  function setMicGate(g) {
    mic.gate = g;
    if (mic.tracker) mic.tracker.gate = g;
    if (mic.onset) mic.onset.gate = g;
  }
  /** Calibration : 2 s de silence pour mesurer le bruit de fond, puis seuil = 3 × bruit. */
  function measureNoise(ms = 2000) {
    return new Promise((res) => {
      const vals = [];
      const id = setInterval(() => vals.push(mic.level), 50);
      setTimeout(() => {
        clearInterval(id);
        const m = vals.length ? Core.median(vals) : 0.005;
        res(Math.max(0.006, Math.min(0.15, m * 3)));
      }, ms);
    });
  }

  /* ---------- Clavier de l'ordinateur (simulateur) ---------- */
  const KEYMAP = { KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7, KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13, KeyL: 14, KeyP: 15, Semicolon: 16, Quote: 17 };
  const kb = { enabled: false, octave: 4, down: new Map() };
  function onKey(e) {
    if (!kb.enabled || e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target || {};
    const tag = t.tagName || '';
    const typing = tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable || (tag === 'INPUT' && !['checkbox', 'radio', 'range', 'button', 'submit'].includes(t.type));
    if (typing) return;
    if (e.type === 'keydown' && (e.code === 'KeyZ' || e.code === 'KeyX')) {
      kb.octave = Math.max(1, Math.min(7, kb.octave + (e.code === 'KeyZ' ? -1 : 1)));
      notify();
      return;
    }
    if (!(e.code in KEYMAP)) return;
    e.preventDefault();
    if (e.type === 'keydown') {
      if (e.repeat || kb.down.has(e.code)) return;
      const m = (kb.octave + 1) * 12 + KEYMAP[e.code];
      kb.down.set(e.code, m);
      sendBytes([0x90, m, 96], 'sim');
    } else {
      const m = kb.down.get(e.code);
      if (m == null) return;
      kb.down.delete(e.code);
      sendBytes([0x80, m, 0], 'sim');
    }
  }
  if (typeof document !== 'undefined') {
    document.addEventListener('keydown', onKey);
    document.addEventListener('keyup', onKey);
  }
  function setKeyboardSim(on) {
    kb.enabled = !!on;
    notify();
  }

  /** Source active : choix manuel, ou automatique MIDI → micro → clavier à l'écran. */
  function activeSource(pref) {
    if (pref === 'midi' || pref === 'mic' || pref === 'touch') return pref;
    if (hasMidiPort()) return 'midi';
    if (mic.status === 'on') return 'mic';
    return 'touch';
  }

  return {
    on,
    onStatus,
    notify,
    emit,
    midi,
    mic,
    kb,
    counters,
    log,
    held,
    midiSupported,
    enableMidi,
    refreshPorts,
    setPort,
    hasMidiPort,
    sendBytes,
    startMic,
    stopMic,
    setMicGate,
    measureNoise,
    setKeyboardSim,
    activeSource,
    get lastMidiAt() {
      return lastMidiAt;
    },
  };
})();


/* ===== store.js ===== */
/* ==========================================================================
   STORE — IndexedDB avec repli en mémoire. Chaque appel est protégé :
   si le stockage échoue, l'app continue et signale qu'il faut exporter.
   ========================================================================== */
const Store = (() => {
  'use strict';
  const NAME = 'pupitre-lecture';
  let db = null;
  let mode = 'memory';
  let lastError = null;
  const mem = new Map();
  let memAttempts = [];

  function req(r) {
    return new Promise((res, rej) => {
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  function txDone(tx) {
    return new Promise((res, rej) => {
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('Transaction annulée'));
    });
  }
  async function open() {
    try {
      if (typeof indexedDB === 'undefined' || !indexedDB) throw new Error('IndexedDB absent');
      db = await new Promise((res, rej) => {
        const r = indexedDB.open(NAME, 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
          if (!d.objectStoreNames.contains('attempts')) d.createObjectStore('attempts', { autoIncrement: true });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error || new Error('Ouverture impossible'));
        r.onblocked = () => rej(new Error('Base bloquée par un autre onglet'));
        setTimeout(() => rej(new Error('Délai dépassé')), 5000);
      });
      mode = 'idb';
      try {
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      } catch (e) {}
    } catch (e) {
      db = null;
      mode = 'memory';
      lastError = (e && e.message) || String(e);
    }
    return mode;
  }
  async function get(key) {
    if (mode !== 'idb') return mem.get(key);
    try {
      return await req(db.transaction('kv').objectStore('kv').get(key));
    } catch (e) {
      lastError = (e && e.message) || String(e);
      return mem.get(key);
    }
  }
  async function set(key, value) {
    mem.set(key, value);
    if (mode !== 'idb') return false;
    try {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(JSON.parse(JSON.stringify(value === undefined ? null : value)), key);
      await txDone(tx);
      return true;
    } catch (e) {
      lastError = (e && e.message) || String(e);
      return false;
    }
  }
  async function addAttempts(list) {
    if (!list || !list.length) return true;
    if (mode !== 'idb') {
      memAttempts = memAttempts.concat(list);
      return false;
    }
    try {
      const tx = db.transaction('attempts', 'readwrite');
      const st = tx.objectStore('attempts');
      for (const a of list) st.add(a);
      await txDone(tx);
      return true;
    } catch (e) {
      lastError = (e && e.message) || String(e);
      memAttempts = memAttempts.concat(list);
      return false;
    }
  }
  async function allAttempts() {
    if (mode !== 'idb') return memAttempts.slice();
    try {
      const all = await req(db.transaction('attempts').objectStore('attempts').getAll());
      return all.concat(memAttempts);
    } catch (e) {
      return memAttempts.slice();
    }
  }
  async function replaceAttempts(list) {
    memAttempts = [];
    if (mode !== 'idb') {
      memAttempts = list.slice();
      return;
    }
    try {
      const tx = db.transaction('attempts', 'readwrite');
      const st = tx.objectStore('attempts');
      st.clear();
      for (const a of list) st.add(a);
      await txDone(tx);
    } catch (e) {
      memAttempts = list.slice();
    }
  }
  async function clearAll() {
    mem.clear();
    memAttempts = [];
    if (mode !== 'idb') return;
    try {
      const tx = db.transaction(['kv', 'attempts'], 'readwrite');
      tx.objectStore('kv').clear();
      tx.objectStore('attempts').clear();
      await txDone(tx);
    } catch (e) {
      lastError = (e && e.message) || String(e);
    }
  }
  return {
    open,
    get,
    set,
    addAttempts,
    allAttempts,
    replaceAttempts,
    clearAll,
    get mode() {
      return mode;
    },
    get lastError() {
      return lastError;
    },
  };
})();


/* ===== app.js ===== */
/* ==========================================================================
   APP — écrans, séance guidée, exercices, diagnostic, progrès, programme,
   connexion MIDI, réglages. Dépend de Core, Notation, Sound, Input, Store.
   ========================================================================== */
const App = (() => {
  'use strict';
  const C = Core;
  const N = Notation;

  /* =====================================================================
     1. ÉTAT ET PERSISTANCE
     ===================================================================== */
  const S = {
    settings: C.defaultSettings(),
    program: C.defaultProgram(),
    sessions: [],
    diagnostics: [],
    stats: {},
    done: [],
    meta: { createdAt: Date.now(), lastExportAt: 0, onboarded: false },
    draft: null,
  };
  const KEYS = ['settings', 'program', 'sessions', 'diagnostics', 'stats', 'done', 'meta', 'draft'];
  let view = 'home';
  let params = {};
  /** État interne des exercices en cours, exposé pour les tests de bout en bout. */
  const DEBUG = {};
  let active = null;
  let storageWarned = false;

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  /**
   * Chaque composant reçoit un élément neuf : quand son conteneur est réutilisé,
   * l'ancien élément (et ses écouteurs) disparaît avec lui.
   */
  function freshHost(root, cls = '') {
    const h = document.createElement('div');
    if (cls) h.className = cls;
    root.replaceChildren(h);
    return h;
  }
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const today = () => C.isoDate(new Date());
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const wait = (ms) => new Promise((r) => setTimeout(r, Math.max(0, ms)));

  const persistTimers = {};
  function persist(key, delay = 250) {
    clearTimeout(persistTimers[key]);
    persistTimers[key] = setTimeout(async () => {
      const ok = await Store.set(key, S[key]);
      if (!ok && Store.mode === 'idb' && !storageWarned) {
        storageWarned = true;
        toast('Enregistrement impossible dans ce navigateur. Exporte tes données depuis Réglages.', 5000);
      }
    }, delay);
  }
  function persistAll() {
    KEYS.forEach((k) => persist(k, 0));
  }
  function mergeLoaded(k, v) {
    if (k === 'settings') {
      const d = C.defaultSettings();
      return { ...d, ...v, blocks: { ...d.blocks, ...(v.blocks || {}) } };
    }
    if (k === 'program') {
      const d = C.defaultProgram();
      const weeks = Array.isArray(v.weeks) && v.weeks.length === 12 ? v.weeks : d.weeks;
      return {
        ...d,
        ...v,
        weeks: weeks.map((w, i) => ({ ...d.weeks[i], ...w, n: i + 1, drill: { ...d.weeks[i].drill, ...(w.drill || {}) } })),
        diagnostics: { ...d.diagnostics, ...(v.diagnostics || {}) },
      };
    }
    if (k === 'meta') return { ...S.meta, ...v };
    if (['sessions', 'diagnostics', 'done'].includes(k)) return Array.isArray(v) ? v : [];
    return v;
  }
  async function load() {
    await Store.open();
    for (const k of KEYS) {
      const v = await Store.get(k);
      if (v != null) S[k] = mergeLoaded(k, v);
    }
  }
  let attemptBuf = [];
  let attemptTimer = null;
  function recordAttempt(a) {
    attemptBuf.push(a);
    if (a.kind === 'note') {
      S.stats[a.key] = C.updateStat(S.stats[a.key], { rt: a.rt, ok: a.errors === 0, ts: a.ts });
      persist('stats', 1500);
    }
    clearTimeout(attemptTimer);
    attemptTimer = setTimeout(flushAttempts, 2000);
  }
  function flushAttempts() {
    const l = attemptBuf;
    attemptBuf = [];
    Store.addAttempts(l);
  }

  /* ---------- Dérivés du programme ---------- */
  const weekNow = () => C.programWeek(S.program.startDate, today());
  const effWeek = (w = weekNow()) => C.clamp(w || 1, 1, 12);
  const phaseNow = () => C.phaseOfWeek(effWeek());
  const doneSet = () => new Set(S.done);
  const todayPieces = () => C.piecesForDay(S.program, effWeek(), doneSet(), 3);
  const sessionsOn = (date) => S.sessions.filter((s) => s.date === date);
  /** Rythme ou motifs : on alterne d'un jour de séance à l'autre. */
  const thirdKindFor = (date) => (Math.abs(C.daysBetween(S.program.startDate, date)) % 2 === 0 ? 'rhythm' : 'motifs');
  function previousNotes() {
    const t = today();
    const prev = [...S.sessions].filter((s) => s.date < t && s.notes).sort((a, b) => (a.date < b.date ? 1 : -1))[0];
    return prev ? prev.notes : null;
  }

  /* ---------- Formats ---------- */
  const nl = (n) => C.noteLabel(n, { octaves: S.settings.octaves });
  const nlm = (m) => C.midiLabel(m, { octaves: S.settings.octaves });
  const fmtSec = (ms) => (ms == null ? '—' : (ms / 1000).toFixed(1).replace('.', ',') + ' s');
  const fmtDur = (ms) => {
    if (ms == null) return '—';

  /* ---------- Clavier à l'écran (entrée tactile et simulateur MIDI) ---------- */
  const Kbd = {
    lo: 48,
    hi: 72,
    visible: false,
    pinned: false,
    el: null,
    wanted() {
      return Input.activeSource(S.settings.input) === 'touch' || S.settings.simulator || this.pinned;
    },
    /** Affiche le clavier si l'entrée tactile ou le simulateur est actif, sur la plage demandée. */
    auto(lo, hi) {
      this.lo = lo;
      this.hi = hi;
      if (this.wanted()) this.show();
      else this.hide();
    },
    show() {
      this.visible = true;
      this.render();
      this.el.hidden = false;
      document.body.classList.add('has-kbd');
    },
    hide() {
      this.visible = false;
      if (this.el) this.el.hidden = true;
      document.body.classList.remove('has-kbd');
    },
    toggle() {
      this.pinned = !this.visible;
      if (this.visible) this.hide();
      else this.show();
    },
    render() {
      const isBlack = (m) => [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);
      let lo = this.lo;
      let hi = this.hi;
      while (isBlack(lo)) lo--;
      while (isBlack(hi)) hi++;
      const whites = [];
      for (let m = lo; m <= hi; m++) if (!isBlack(m)) whites.push(m);
      const n = whites.length;
      let keys = '';
      whites.forEach((m) => {
        const label = m % 12 === 0 ? `<span class="k-lab">${nlm(m)}</span>` : '';
        keys += `<button type="button" class="k w${Input.held.has(m) ? ' down' : ''}" data-m="${m}" aria-label="${nlm(m)}">${label}</button>`;
      });
      for (let m = lo; m <= hi; m++) {
        if (!isBlack(m)) continue;
        const idx = whites.filter((w) => w < m).length;
        keys += `<button type="button" class="k b${Input.held.has(m) ? ' down' : ''}" data-m="${m}" aria-label="${nlm(m)}" style="left:calc(${idx} * 100% / ${n} - (100% / ${n}) * 0.3)"></button>`;
      }
      const src = S.settings.simulator ? 'Simulateur MIDI' : 'Clavier à l’écran';
      this.el.innerHTML = `<div class="kbd-bar"><span>${src}${S.settings.simulator ? ' · touches A W S E D F… de l’ordinateur, Z/X pour changer d’octave' : ''}</span><button type="button" class="btn ghost xs" data-kact="down" aria-label="Octave plus grave">${icon('minus', 18)}</button><button type="button" class="btn ghost xs" data-kact="up" aria-label="Octave plus aiguë">${icon('plus', 18)}</button><button type="button" class="btn ghost xs" data-kact="hide">Masquer</button></div><div class="kbd" style="--n:${n}">${keys}</div>`;
    },
    init() {
      this.el = $('#kbd-dock');
      const press = new Map();
      const kind = () => (S.settings.simulator ? 'sim' : 'touch');
      this.el.addEventListener('pointerdown', (e) => {
        const a = e.target.closest('[data-kact]');
        if (a) {
          const k = a.dataset.kact;
          if (k === 'hide') {
            this.pinned = false;
            this.hide();
          } else {
            const d = k === 'up' ? 12 : -12;
            if (this.lo + d >= 21 && this.hi + d <= 108) {
              this.lo += d;
              this.hi += d;
              this.render();
            }
          }
          return;
        }
        const key = e.target.closest('.k');
        if (!key) return;
        e.preventDefault();
        Sound.unlock();
        const m = +key.dataset.m;
        try {
          key.setPointerCapture(e.pointerId);
        } catch (err) {}
        press.set(e.pointerId, m);
        Input.sendBytes([0x90, m, 90], kind());
        if (S.settings.touchSound) Sound.tone(m);
      });
      const up = (e) => {
        const m = press.get(e.pointerId);
        if (m == null) return;
        press.delete(e.pointerId);
        Input.sendBytes([0x80, m, 0], kind());
      };
      this.el.addEventListener('pointerup', up);
      this.el.addEventListener('pointercancel', up);
      Input.on((ev) => {
        if (!this.visible || (ev.type !== 'noteon' && ev.type !== 'noteoff')) return;
        const k = this.el.querySelector(`.k[data-m="${ev.midi}"]`);
        if (k) k.classList.toggle('down', ev.type === 'noteon');
      });
    },
  };
  /** Plage du clavier à l'écran adaptée à une clé (au moins deux octaves). */
  function rangeFor(clef, ledger = 2) {

    const lo = Math.min(...c.map((x) => x.midi));
    const hi = Math.max(...c.map((x) => x.midi));
    return [Math.floor(lo / 12) * 12, Math.max(Math.ceil(hi / 12) * 12, Math.floor(lo / 12) * 12 + 24)];
  }

      } catch (e) {
        if (e && e.code === 'declined') {
          toast('Enregistrement annulé');
          return false;

      }

      try {
        const blob = new Blob([text], { type: mime });

        const a = document.createElement('a');
