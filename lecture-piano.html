  /* ---------- 4.8 Compte rendu ---------- */
  function ReportForm(root, { draft, onSaved }) {
    root = freshHost(root);
    const n = draft.notes || {};
    const r = draft.reading || { pieces: [] };
    const pcs = (r.pieces || []).filter((p) => p.status === 'done');
    const glances = pcs.reduce((a, p) => a + (p.glances || 0), 0);
    const regs = pcs.map((p) => p.regMs).filter((x) => x != null);
    const motif = draft.motifs && draft.motifs.first != null ? draft.motifs.first : 0;
    const cell = (k, lab) => {
      const s = n[k] || {};
      return `<tr><th scope="row">${lab}</th><td class="num">${s.count || 0}</td><td class="num">${fmtSec(s.meanRt)}</td><td class="num">${s.errors || 0}</td></tr>`;
    };
    const feelings = [[1, 'Pénible'], [2, 'Difficile'], [3, 'Correct'], [4, 'Bien'], [5, 'Fluide']];
    root.innerHTML = `<form class="report" id="rp-form" novalidate>
      <div class="report-grid">
        <section><h3 class="h3">${cap(frDate(draft.date))}</h3><p class="muted">Semaine ${draft.week} · phase ${draft.phase} (${C.PHASE_NAMES[draft.phase] || ''})</p>
          <div class="table-wrap"><table class="tbl"><thead><tr><th>Notes</th><th class="num">Jouées</th><th class="num">Temps moyen</th><th class="num">Erreurs</th></tr></thead><tbody>${cell('treble', 'Clé de sol')}${cell('bass', 'Clé de fa')}${n.chord && n.chord.count ? cell('chord', 'Accords') : ''}</tbody></table></div>
          ${n.slowest && n.slowest.length ? `<p class="muted">Plus lentes ce soir : ${n.slowest.map((x) => { const nn = C.parseNoteKey(x.key); return nn ? `${nl(nn)} en clé de ${nn.clef === 'treble' ? 'sol' : 'fa'} (${fmtSec(x.rt)})` : ''; }).filter(Boolean).join(', ')}.</p>` : ''}
          <dl class="facts">
            <div><dt>Déchiffrage</dt><dd>${pcs.length ? `${pcs.length} pièce${pcs.length > 1 ? 's' : ''} à ${tempoHTML(r.tempoQ, '4/4', 7)} · ${pcs.reduce((a, p) => a + p.stops, 0)} arrêt(s) · ${pcs.reduce((a, p) => a + p.wrong, 0)} fausse(s) note(s)` : 'non fait'}</dd></div>
            <div><dt>Régularité</dt><dd>${regs.length ? `écart moyen ${Math.round(C.mean(regs))} ms` : '—'}</dd></div>
            <div><dt>Rythme</dt><dd>${draft.rhythm && draft.rhythm.best != null ? `meilleur score ${draft.rhythm.best} / 100` : '—'}</dd></div>
            <div><dt>Tempo de demain</dt><dd>${r.nextTempoQ ? tempoHTML(r.nextTempoQ, '4/4', 7) : '—'}</dd></div>
          </dl></section>
        <section class="report-form">
          <div class="field"><span class="lab">Coups d’œil au clavier</span>${stepperHTML('rp-gl', glances, { min: 0, max: 99, label: 'les coups d’œil', big: true })}</div>
          <div class="field"><span class="lab">Motifs (première série)</span>${stepperHTML('rp-mo', motif, { min: 0, max: 5, label: 'les motifs', unit: ' / 5', big: true })}</div>
          <div class="field"><span class="lab">Ressenti</span>${chipsHTML('feel', feelings.map(([v, l]) => [v, `<b>${v}</b> ${l}`]), draft.feeling || '')}</div>
          <label class="field"><span class="lab">Note libre</span><textarea class="input" id="rp-note" rows="3" placeholder="Ce qui a coincé, ce qui a progressé…">${esc(draft.noteText || '')}</textarea></label>
        </section>
      </div>
      <div class="actions"><button class="btn primary big" type="submit">${icon('check', 22)}<span>Enregistrer la séance</span></button></div></form>`;
    const form = $('#rp-form', root);
    let feeling = draft.feeling || null;
    wireChips(form, (k, v) => (feeling = +v));
    wireSteppers(form, () => {});
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const session = {
        id: draft.id,
        date: draft.date,
        week: draft.week,
        phase: draft.phase,
        startedAt: draft.startedAt,
        endedAt: Date.now(),
        notes: draft.notes || null,
        reading: draft.reading ? { tempoQ: r.tempoQ, nextTempoQ: r.nextTempoQ != null ? r.nextTempoQ : r.tempoQ, rule: r.rule || 'same', pieces: pcs.map((p) => ({ id: p.id, label: p.label, short: p.short, num: p.num, meter: p.meter, stops: p.stops, stopsAuto: p.stopsAuto, wrong: p.wrong, regMs: p.regMs, inGridPct: p.inGridPct, durationMs: p.durationMs, playMs: p.playMs, glances: p.glances })) } : null,
        rhythm: draft.rhythm || null,
        motifs: draft.motifs ? { ...draft.motifs, first: stepVal(form, 'rp-mo') } : stepVal(form, 'rp-mo') ? { first: stepVal(form, 'rp-mo'), rounds: [] } : null,
        generated: draft.generated || [],
        glances: stepVal(form, 'rp-gl'),
        feeling,
        note: $('#rp-note', form).value.trim(),
        blocksMs: draft.elapsed,
      };
      S.sessions = S.sessions.filter((s) => s.id !== session.id).concat(session).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.endedAt - b.endedAt));
      for (const p of pcs) if (p.id && !String(p.id).startsWith('libre:') && !S.done.includes(p.id)) S.done.push(p.id);
      if (session.reading && session.reading.pieces.length) S.settings.tempoQ = session.reading.nextTempoQ;
      S.draft = null;
      ['sessions', 'done', 'settings', 'draft'].forEach((k) => persist(k, 0));
      onSaved(session);
    });
    return {};
  }
  function tomorrowPlan(afterDate = today()) {
    const d = C.nextScheduled(afterDate);
    const w = C.programWeek(S.program.startDate, d);
    const ew = C.clamp(w || 1, 1, 12);
    return { date: d, week: w, pieces: C.piecesForDay(S.program, ew, doneSet(), 3), tempoQ: S.settings.tempoQ, drill: C.weekOf(S.program, ew).drill, third: thirdKindFor(d) };
  }
  function showTomorrow(afterDate) {
    const t = tomorrowPlan(afterDate);
    modal({
      title: 'Préparer la prochaine séance',
      body: `<p class="eyebrow">${cap(frDate(t.date))} · 20 h 30 · semaine ${Math.max(1, t.week)}</p>
        <ol class="program-list">
          <li><span class="pl-t">Notes</span><span class="pl-d">${drillSummary(t.drill)}</span></li>
          <li><span class="pl-t">Déchiffrage</span><span class="pl-d">${t.pieces.length ? t.pieces.map((p) => esc(p.label)).join('<br>') : 'aucune pièce prévue : complète le programme'}<br>${tempoHTML(t.tempoQ, '4/4', 7)}</span></li>
          <li><span class="pl-t">${t.third === 'rhythm' ? 'Rythme' : 'Motifs'}</span><span class="pl-d">${t.third === 'rhythm' ? 'une cellule sur une touche, au métronome' : 'intervalles et accords en moins de 2 s'}</span></li>
          <li><span class="pl-t">Compte rendu</span><span class="pl-d">5 minutes</span></li></ol>
        <p class="muted">Pose les partitions sur le pupitre dès ce soir.</p>`,
      actions: [{ label: 'Fermer', kind: 'primary' }],
    });
  }
  function exportSessionMD(s) {
    const md = C.sessionToMarkdown(s, { dateLabel: frDate(s.date, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }), octaves: S.settings.octaves });
    exportDialog('Compte rendu en Markdown', `piano-${s.date}.md`, md, 'text/markdown');
  }

  /* =====================================================================
     5 bis. RÉPERTOIRE : pièces réelles à apprendre au clavier
     ===================================================================== */
  const R = Repertoire;
  const LEVELS = { 1: 'Débuter', 2: 'Progresser', 3: 'Perfectionner' };
  const HANDS = { rh: 'Main droite', lh: 'Main gauche', both: 'Deux mains' };
  const MODES = { wait: 'Pas à pas', tempo: 'Au tempo', listen: 'Écouter' };
  let libCache = null;
  const decoded = new Map();
  function itemOf(c, src) {
    const m = String(c.m || '4/4').replace(/[Cc]$/, '');
    return { id: c.id, title: c.t || 'Sans titre', composer: c.c || '', work: c.w || '', lvl: c.lvl || 2, tq: c.tq || 72, note: c.note || '', ed: c.ed || '', url: c.url || '', meter: m, fifths: c.k || 0, nBars: (c.b || []).length, src, c };
  }
  function library() {
    if (!libCache) libCache = LIBRARY.map((c) => itemOf(c, 'lib'));
    return libCache.concat((S.repertoire.custom || []).map((c) => itemOf(c, 'mine')));
  }
  function pieceOf(it) {
    if (!decoded.has(it.id)) decoded.set(it.id, R.decode(it.c));
    return decoded.get(it.id);
  }
  const blankProg = () => ({ status: 'new', bars: {}, runs: [], totalMs: 0, lastAt: 0 });
  const progOf = (id) => S.repertoire.pieces[id] || blankProg();
  function progW(id) {
    if (!S.repertoire.pieces[id]) S.repertoire.pieces[id] = blankProg();
    return S.repertoire.pieces[id];
  }
  /** Mesures sûres : deux passages sans faute (pas à pas, deux mains, ou au tempo). */
  function barLevel(pr, bi) {
    const b = pr.bars[bi];
    if (!b) return 0;
    const both = b.both || 0;
    if (both >= 2 || (b.tq || 0) > 0) return 2;
    if (both >= 1 || (b.rh || 0) >= 1 || (b.lh || 0) >= 1) return 1;
    return 0;
  }
  function mastery(it) {
    const pr = progOf(it.id);
    let sure = 0;
    for (let i = 0; i < it.nBars; i++) if (barLevel(pr, i) === 2) sure++;
    return { sure, pct: it.nBars ? Math.round((100 * sure) / it.nBars) : 0 };
  }
  function statusOf(it) {
    const pr = progOf(it.id);
    if (pr.status === 'done') return ['done', 'Acquise'];
    if (pr.runs && pr.runs.length) return ['learning', 'En cours'];
    return ['new', 'Nouvelle'];
  }
  const keyLabel = (f) => (!f ? 'sans armure' : `${Math.abs(f)} ${f > 0 ? 'dièse' : 'bémol'}${Math.abs(f) > 1 ? 's' : ''}`);

  /* ---------- Liste ---------- */
  function screenRep(main) {
    const filt = S.repertoire.filter || 'all';
    let query = '';
    const lastId = S.repertoire.last;
    const last = lastId ? library().find((x) => x.id === lastId) : null;
    const lp = last ? progOf(last.id) : null;
    main.innerHTML = `<div class="page rep">
      <header class="page-head"><p class="eyebrow">Pièces réelles</p><h1 class="display">Répertoire</h1>
        <p class="sub">Des pièces du domaine public à apprendre au clavier, mesure par mesure, et tes propres partitions MusicXML.</p></header>
      ${last ? `<div class="banner accent rep-resume"><p><span class="lab">Reprendre</span><b>${esc(last.title)}</b> · ${esc(last.composer)}<br><span class="muted">${MODES[lp.mode || 'wait']} · ${HANDS[lp.hands || 'both']} · mesures ${(lp.from || 0) + barOffset(last)} à ${(lp.to != null ? lp.to : Math.min(7, last.nBars - 1)) + barOffset(last)}</span></p><div class="banner-act"><button type="button" class="btn primary" data-open="${esc(last.id)}">${icon('play', 20)}<span>Continuer</span></button></div></div>` : ''}
      <div class="rep-tools">${chipsHTML('filter', [['all', 'Toutes'], ['1', 'Niveau 1'], ['2', 'Niveau 2'], ['3', 'Niveau 3'], ['learning', 'En cours'], ['mine', 'Mes partitions']], filt)}
        <div class="rep-tools-r"><input type="search" class="input rep-search" id="rep-q" placeholder="Titre, compositeur…" aria-label="Chercher une pièce" autocomplete="off">
        <button type="button" class="btn secondary" data-act="import">${icon('plus', 20)}<span>Importer une partition</span></button></div></div>
      <div class="rep-grid" id="rep-grid"></div>
      <p class="muted rep-src">Partitions de la bibliothèque : éditions du Mutopia Project (domaine public ou CC BY-SA), converties note pour note et vérifiées contre le MIDI de leur source. Doigtés de l’édition d’origine.</p>
    </div>`;
    const grid = $('#rep-grid', main);
    let cur = filt;
    function draw() {
      const q = query.trim().toLowerCase();
      const items = library().filter((it) => {
        if (cur === 'mine' && it.src !== 'mine') return false;
        if (['1', '2', '3'].includes(cur) && String(it.lvl) !== cur) return false;
        if (cur === 'learning' && statusOf(it)[0] !== 'learning') return false;
        if (q && !`${it.title} ${it.composer} ${it.work}`.toLowerCase().includes(q)) return false;
        return true;
      });
      if (!items.length) {
        grid.innerHTML = `<p class="muted rep-empty">${cur === 'mine' ? 'Aucune partition importée pour l’instant. Le bouton « Importer une partition » accepte les fichiers MusicXML.' : cur === 'learning' ? 'Aucune pièce en cours : ouvre une pièce et joue un premier passage.' : 'Aucune pièce ne correspond.'}</p>`;
        return;
      }
      grid.innerHTML = items
        .map((it) => {
          const [sk, sl] = statusOf(it);
          const m = mastery(it);
          return `<button type="button" class="rep-card" data-open="${esc(it.id)}">
            <span class="rc-top"><span class="rc-lvl l${it.lvl}">${it.src === 'mine' ? 'Importée' : `Niveau ${it.lvl}`}</span><span class="pill ${sk === 'done' ? 'ok' : sk === 'learning' ? 'accent' : ''}">${sl}</span></span>
            <span class="rc-t">${esc(it.title)}</span>
            <span class="rc-c">${esc(it.composer)}${it.work ? ` · <span class="muted">${esc(it.work)}</span>` : ''}</span>
            <span class="rc-m">${esc(it.meter)} · ${it.nBars} mesures · ${keyLabel(it.fifths)}</span>
            <span class="rc-bar" aria-label="${m.sure} mesures sûres sur ${it.nBars}"><span style="width:${m.pct}%"></span></span>
          </button>`;
        })
        .join('');
    }
    draw();
    wireChips(main, (k, v) => {
      cur = v;
      S.repertoire.filter = v;
      persist('repertoire');
      draw();
    });
    $('#rep-q', main).addEventListener('input', (e) => {
      query = e.target.value;
      draw();
    });
    main.addEventListener('click', (e) => {
      const o = e.target.closest('[data-open]');
      if (o) return go('piece', { id: o.dataset.open });
      const a = e.target.closest('[data-act]');
      if (a && a.dataset.act === 'import') importScoreDialog();
    });
  }
  const barOffset = (it) => (pieceOf(it).bars[0].n === 0 ? 0 : 1);

  /* ---------- Import MusicXML ---------- */
  function importScoreDialog() {
    const id = 'ix-' + uid();
    let parsed = null;
    let level = 2;
    const m = modal({
      title: 'Importer une partition',
      wide: true,
      body: `<p class="muted">Un fichier MusicXML (.musicxml, .xml ou .mxl) d’une pièce pour piano, à une ou deux portées. Pour le domaine public : MuseScore (filtre « domaine public »), IMSLP, OpenScore ; depuis MuseScore Studio, « Fichier › Exporter › MusicXML ».</p>
        <input type="file" class="input" id="${id}-file" aria-label="Fichier MusicXML">
        <div id="${id}-sum" class="ix-sum"></div><p class="feedback left" id="${id}-fb"></p>`,
      actions: [
        { label: 'Annuler', kind: 'ghost' },
        {
          label: 'Ajouter au répertoire',
          kind: 'primary',
          act: (el) => {
            const fbEl = $(`#${id}-fb`, el);
            if (!parsed) {
              fbEl.textContent = 'Choisis d’abord un fichier.';
              fbEl.className = 'feedback left bad';
              return false;
            }
            const title = $(`#${id}-t`, el).value.trim() || parsed.title || 'Sans titre';
            const composer = $(`#${id}-c`, el).value.trim() || parsed.composer || '';
            const pid = 'imp-' + uid();
            const enc = R.encode(parsed, { id: pid, t: title, c: composer, w: '', lvl: level, tq: parsed.tempo || 72, ed: `Importée le ${frDate(today(), { day: 'numeric', month: 'long', year: 'numeric' })}`, warn: parsed.warnings.slice(0, 4) });
            S.repertoire.custom = (S.repertoire.custom || []).concat(enc);
            persist('repertoire', 0);
            toast('Partition ajoutée au répertoire');
            setTimeout(() => go('piece', { id: pid }), 50);
          },
        },
      ],
    });
    $(`#${id}-file`, m.el).addEventListener('change', async (e) => {
      const f = e.target.files[0];
      const sum = $(`#${id}-sum`, m.el);
      const fbEl = $(`#${id}-fb`, m.el);
      parsed = null;
      sum.innerHTML = '';
      fbEl.textContent = '';
      if (!f) return;
      try {
        const text = await R.readFile(f);
        parsed = R.parseMusicXML(text);
        if (!parsed.bars.length || !R.expected(parsed).length) throw new Error('Aucune note lisible dans ce fichier.');
      } catch (err) {
        parsed = null;
        fbEl.textContent = (err && err.message) || 'Fichier illisible.';
        fbEl.className = 'feedback left bad';
        return;
      }
      const notes = R.expected(parsed).length;
      sum.innerHTML = `<div class="form-grid">
          <label class="field"><span class="lab">Titre</span><input class="input" id="${id}-t" value="${esc(parsed.title || f.name.replace(/\.[^.]+$/, ''))}"></label>
          <label class="field"><span class="lab">Compositeur</span><input class="input" id="${id}-c" value="${esc(parsed.composer)}"></label></div>
        <div class="field"><span class="lab">Niveau</span>${chipsHTML('lvl', [[1, 'Niveau 1'], [2, 'Niveau 2'], [3, 'Niveau 3']], level)}</div>
        <p class="muted">${parsed.bars.length} mesures · ${parsed.staves.length === 2 ? 'deux portées' : 'une portée'} · ${parsed.meter} · ${keyLabel(parsed.fifths)} · ${notes} notes à jouer</p>
        ${parsed.warnings.length ? `<ul class="ix-warn">${parsed.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}`;
      wireChips(sum, (k, v) => (level = +v));
    });
  }

  /* ---------- Lecteur : pas à pas, au tempo, écoute ---------- */
  function screenPiece(main, p) {
    const it = library().find((x) => x.id === p.id);
    if (!it) {
      toast('Pièce introuvable');
      return go('rep');
    }
    const piece = pieceOf(it);
    const nB = piece.bars.length;
    const off = piece.bars[0] && piece.bars[0].n === 0 ? 0 : 1;
    const pr0 = progOf(it.id);
    const two = piece.staves.length > 1;
    const st = {
      mode: pr0.mode || 'wait',
      hands: two ? pr0.hands || 'both' : 'both',
      from: C.clamp(pr0.from != null ? pr0.from : 0, 0, nB - 1),
      to: C.clamp(pr0.to != null ? pr0.to : Math.min(nB - 1, 7), 0, nB - 1),
      tempoQ: pr0.tempoQ || Math.max(30, Math.round((it.tq * 0.6) / 2) * 2),
      loop: !!pr0.loop,
      phase: 'idle',
      layout: null,
      heads: new Map(),
      anchor: null,
      steps: [],
      idx: 0,
      timers: [],
      raf: 0,
      metro: null,
      result: null,
    };
    if (st.to < st.from) st.to = st.from;
    DEBUG.rep = st;
    S.repertoire.last = it.id;
    persist('repertoire');
    // index des notes : identifiant → note, événement, mesure (liaisons, durées)
    const noteIdx = new Map();
    piece.bars.forEach((b, bi) =>
      b.staves.forEach((evs, si) =>
        evs.forEach((e) => {
          e.notes.forEach((n) => noteIdx.set(n.id, { n, e, bi, si }));
          if (e.graces) e.graces.forEach((g) => g.notes.forEach((n) => (n.grace = true)));
        }),
      ),
    );
    const tieChain = (id) => {
      const out = [];
      let x = noteIdx.get(id);
      let guard = 0;
      while (x && x.n.tieTo && guard++ < 64) {
        out.push(x.n.tieTo);
        x = noteIdx.get(x.n.tieTo);
      }
      return out;
    };
    const soundDur = (id) => {
      const x = noteIdx.get(id);
      if (!x) return 1;
      return x.e.d + tieChain(id).reduce((a, t) => a + ((noteIdx.get(t) || {}).e || { d: 0 }).d, 0);
    };

    main.innerHTML = `<div class="page ex-page rp">
      <div class="ex-bar"><button type="button" class="btn ghost" data-act="back">${icon('back', 20)}<span>Répertoire</span></button>
        <div class="rp-head"><h1 class="h1">${esc(it.title)}</h1><p class="muted">${esc(it.composer)}${it.work ? ' · ' + esc(it.work) : ''}</p></div>
        <button type="button" class="icon-btn" data-act="info" aria-label="À propos de cette pièce">${icon('book')}</button>
        <button type="button" class="icon-btn" data-act="kbd" aria-label="Afficher le clavier à l’écran">${icon('keys')}</button></div>
      <div class="rp-opts">
        <div class="field"><span class="lab">Mode</span>${chipsHTML('mode', Object.entries(MODES), st.mode)}</div>
        ${two ? `<div class="field"><span class="lab">Mains</span>${chipsHTML('hands', Object.entries(HANDS), st.hands)}</div>` : ''}
        <div class="field"><span class="lab">Mesures</span><div class="rp-range">${stepperHTML('rp-from', st.from + off, { min: off, max: nB - 1 + off, label: 'la première mesure' })}<span class="muted">à</span>${stepperHTML('rp-to', st.to + off, { min: off, max: nB - 1 + off, label: 'la dernière mesure' })}<button type="button" class="btn ghost sm" data-act="all">Toute la pièce</button></div></div>
        <div class="field" id="rp-tempo-f"><span class="lab">Tempo (noire)</span>${stepperHTML('rp-tempo', st.tempoQ, { min: 20, max: 220, step: 2, label: 'le tempo' })}</div>
        <label class="switch"><input type="checkbox" id="rp-loop" ${st.loop ? 'checked' : ''}><span class="sw-track"></span><span>En boucle</span></label>
      </div>
      <div class="rp-map" id="rp-map" aria-label="Mesures de la pièce"></div>
      <div class="paper score-paper rp-paper" id="rp-paper"></div>
      <div class="rp-dock"><div class="rp-dock-in"><p class="feedback left" id="rp-fb" aria-live="polite"></p><div class="rp-metrics" id="rp-metrics"></div><div class="actions" id="rp-actions"></div></div></div>
    </div>`;
    const paper = $('#rp-paper', main);
    const fb = (msg, k = '') => {
      const el = $('#rp-fb', main);
      el.innerHTML = msg;
      el.className = 'feedback left ' + k;
    };
    const handsOK = (si) => !two || st.hands === 'both' || (st.hands === 'rh' ? si === 0 : si === 1);
    const exp = () => R.expected(piece, { hands: st.hands, from: st.from, to: st.to });

    /* --- dessin --- */
    function draw() {
      const w = Math.max(320, Math.min((paper.clientWidth || 900) - 20, 1500));
      st.layout = N.pieceScore({
        staves: piece.staves,
        bars: piece.bars,
        fifths: piece.fifths,
        meter: piece.meter,
        sym: piece.sym,
        S: sizes().piece + 1,
        width: w,
        ariaLabel: esc(it.title),
        dimBar: (bi) => bi < st.from || bi > st.to,
        dimStaff: (si) => !handsOK(si),
      });
      paper.innerHTML = st.layout.svg;
      st.heads = new Map();
      $$('g.nh[data-id]', paper).forEach((g) => {
        const k = g.dataset.id;
        if (!st.heads.has(k)) st.heads.set(k, []);
        st.heads.get(k).push(g);
      });
      st.rects = new Map($$('.bar-hl', paper).map((r) => [+r.dataset.bar, r]));
      showSel();
    }
    function showSel() {
      st.rects.forEach((r, bi) => r.classList.toggle('sel', bi >= st.from && bi <= st.to));
      drawMap();
    }
    function drawMap() {
      const pr = progOf(it.id);
      $('#rp-map', main).innerHTML = piece.bars
        .map((b, bi) => `<button type="button" class="mb m${barLevel(pr, bi)}${bi >= st.from && bi <= st.to ? ' sel' : ''}" data-bar="${bi}" aria-label="Mesure ${bi + off}">${(bi + off) % 4 === 1 || bi === 0 || nB <= 24 ? bi + off : ''}</button>`)
        .join('');
    }
    const setCls = (ids, cls, on = true) => {
      for (const id of ids) {
        const els = st.heads.get(id);
        if (els) els.forEach((g) => g.classList.toggle(cls, on));
      }
    };
    const clearMarks = () => st.heads.forEach((els) => els.forEach((g) => g.classList.remove('n-cur', 'n-done', 'n-ok', 'n-near', 'n-off', 'n-miss', 'n-bad')));
    let curBar = -1;
    function highlight(bi, scroll = true) {
      if (bi === curBar) return;
      if (curBar >= 0 && st.rects.get(curBar)) st.rects.get(curBar).classList.remove('on');
      curBar = bi;
      const r = st.rects.get(bi);
      if (!r) return;
      r.classList.add('on');
      if (scroll) scrollToBar(bi);
    }
    let lastSys = -1;
    function scrollToBar(bi, force = false) {
      const box = st.layout && st.layout.bars[bi];
      if (!box) return;
      if (!force && box.system === lastSys) return;
      lastSys = box.system;
      const r = st.rects.get(bi);
      if (!r) return;
      const rr = r.getBoundingClientRect();
      const dock = $('.rp-dock', main);
      const bottomLimit = window.innerHeight - (dock ? dock.getBoundingClientRect().height : 120) - (Kbd.visible ? 210 : 0);
      if (force || rr.top < 70 || rr.bottom > bottomLimit) {
        const target = window.scrollY + rr.top - Math.max(70, (bottomLimit - rr.height) * 0.35);
        window.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
      }
    }
    const handsLabel = () => (two ? HANDS[st.hands].toLowerCase() : '');
    function idleText() {
      const n = exp().length;
      const range = `mesures ${st.from + off} à ${st.to + off}`;
      if (st.mode === 'wait') return `Pas à pas, ${range}${two ? ', ' + handsLabel() : ''} : la partition attend chaque bonne note (${n} à jouer). Touche une mesure pour choisir le passage.`;
      if (st.mode === 'tempo') return `Au tempo, ${range} : une mesure de décompte, puis joue sans t’arrêter. Chaque note est notée en couleur.`;
      return `Écoute du passage, ${range}${Input.activeSource(S.settings.input) === 'midi' && S.settings.midiOut ? ', joué par le piano' : ''}.`;
    }
    function actions() {
      const a = $('#rp-actions', main);
      const busy = st.phase === 'wait' || st.phase === 'play' || st.phase === 'listen';
      if (busy) {
        a.innerHTML = `${st.phase === 'wait' ? `<button type="button" class="btn secondary" data-act="hint">${icon('eye', 20)}<span>Indice</span></button>` : ''}<button type="button" class="btn secondary big" data-act="stop">${icon('pause', 22)}<span>Arrêter</span></button>`;
      } else {
        const lab = st.mode === 'wait' ? 'Commencer' : st.mode === 'tempo' ? 'Lancer le décompte' : 'Écouter le passage';
        a.innerHTML = `<button type="button" class="btn primary big" data-act="go">${icon(st.mode === 'listen' ? 'play' : st.mode === 'tempo' ? 'metronome' : 'play', 22)}<span>${st.result ? (st.mode === 'listen' ? 'Réécouter' : 'Recommencer') : lab}</span></button>${st.result && st.to < nB - 1 ? `<button type="button" class="btn secondary" data-act="next">${icon('arrow', 20)}<span>Passage suivant</span></button>` : ''}${st.mode !== 'listen' ? `<button type="button" class="btn ghost" data-act="listen">${icon('play', 18)}<span>Écouter</span></button>` : ''}`;
      }
      $('#rp-tempo-f', main).hidden = st.mode === 'wait';
      $$('.rp-opts .chip, .rp-opts .st-btn, .rp-opts input, .rp-opts [data-act]', main).forEach((b) => (b.disabled = busy));
    }
    function metrics(html) {
      $('#rp-metrics', main).innerHTML = html || '';
    }
    function saveOpts() {
      const pr = progW(it.id);
      Object.assign(pr, { mode: st.mode, hands: st.hands, from: st.from, to: st.to, tempoQ: st.tempoQ, loop: st.loop });
      persist('repertoire');
    }
    function rangeFor() {
      const ex = exp();
      if (!ex.length) return [48, 72];
      const lo = Math.min(...ex.map((e) => e.midi));
      const hi = Math.max(...ex.map((e) => e.midi));
      let a = Math.floor(lo / 12) * 12;
      let b = Math.ceil((hi + 1) / 12) * 12;
      if (b - a < 24) b = a + 24;
      return [Math.max(21, a), Math.min(108, b)];
    }
    function stopAll() {
      st.timers.forEach((t) => clearTimeout(t));
      st.timers = [];
      cancelAnimationFrame(st.raf);
      if (st.metro) st.metro.stop();
      st.metro = null;
      if (st.listenStop) st.listenStop();
      st.listenStop = null;
      if (curBar >= 0 && st.rects.get(curBar)) st.rects.get(curBar).classList.remove('on');
      curBar = -1;
      lastSys = -1;
    }

    /* --- pas à pas --- */
    function startWait() {
      stopAll();
      st.result = null;
      const ex = exp();
      st.steps = R.steps(ex);
      if (!st.steps.length) {
        fb('Aucune note à jouer dans ce passage pour cette main.', 'bad');
        return;
      }
      // notes d'ornement tolérées à chaque étape
      st.steps.forEach((s) => {
        s.grace = new Set();
        s.notes.forEach((n) => {
          const x = noteIdx.get(n.id);
          if (x && x.e.graces) x.e.graces.forEach((g) => g.notes.forEach((m) => s.grace.add(m.midi)));
        });
        s.ids = s.notes.flatMap((n) => n.ids || [n.id]);
      });
      clearMarks();
      st.idx = 0;
      st.errors = 0;
      st.barErr = {};
      st.pressed = new Set();
      st.t0 = performance.now();
      st.lastAdvance = 0;
      st.phase = 'wait';
      Kbd.auto(...rangeFor());
      Wake.on();
      markStep(true);
      fb('Joue les notes en bleu. La partition avance quand toutes les notes de l’accord sont jouées.', 'info');
      metrics(waitMetrics());
      actions();
    }
    function waitMetrics() {
      return `<span><b>${Math.min(st.idx, st.steps.length)}</b> / ${st.steps.length} étapes</span><span><b>${st.errors}</b> erreur${st.errors > 1 ? 's' : ''}</span>`;
    }
    function markStep(force) {
      const s = st.steps[st.idx];
      if (!s) return;
      setCls(s.ids, 'n-cur', true);
      highlight(s.bar, true);
      if (force) scrollToBar(s.bar, true);
    }
    const namesOf = (midis) => [...midis].sort((a, b) => a - b).map((m) => nlm(m)).join(' + ');
    function onWaitNote(ev) {
      if (ev.type !== 'noteon') return;
      const s = st.steps[st.idx];
      if (!s) return;
      const need = new Set(s.notes.map((n) => n.midi));
      if (need.has(ev.midi)) {
        st.pressed.add(ev.midi);
        const done = s.notes.filter((n) => st.pressed.has(n.midi));
        setCls(done.flatMap((n) => n.ids || [n.id]), 'n-done', true);
        if (s.notes.every((n) => st.pressed.has(n.midi))) advance();
        return;
      }
      if (s.grace.has(ev.midi)) return;
      const prev = st.steps[st.idx - 1];
      if (prev && prev.notes.some((n) => n.midi === ev.midi) && performance.now() - st.lastAdvance < 260) return;
      st.errors++;
      st.barErr[s.bar] = (st.barErr[s.bar] || 0) + 1;
      paper.classList.remove('flash');
      void paper.offsetWidth;
      paper.classList.add('flash');
      fb(`Joué : <b>${nlm(ev.midi)}</b> · attendu : <b>${namesOf(need)}</b>`, 'bad');
      metrics(waitMetrics());
    }
    function advance() {
      const s = st.steps[st.idx];
      setCls(s.ids, 'n-cur', false);
      setCls(s.ids, 'n-done', true);
      setCls(s.ids.flatMap(tieChain), 'n-done', true);
      st.idx++;
      st.pressed = new Set();
      st.lastAdvance = performance.now();
      if (st.idx >= st.steps.length) return finishWait();
      if ($('#rp-fb', main).classList.contains('bad')) fb('');
      markStep(false);
      metrics(waitMetrics());
    }
    function finishWait() {
      st.phase = 'idle';
      Wake.off();
      const ms = Math.round(performance.now() - st.t0);
      const barsIn = [...new Set(st.steps.map((s) => s.bar))];
      const clean = barsIn.filter((b) => !st.barErr[b]);
      const pr = progW(it.id);
      const hk = two ? st.hands : 'both';
      barsIn.forEach((b) => {
        const rec = (pr.bars[b] = pr.bars[b] || {});
        rec[hk] = st.barErr[b] ? Math.max(0, (rec[hk] || 0) - 1) : Math.min(9, (rec[hk] || 0) + 1);
      });
      pr.runs = (pr.runs || []).concat({ at: Date.now(), date: today(), mode: 'wait', hands: hk, from: st.from, to: st.to, ms, errors: st.errors, steps: st.steps.length }).slice(-60);
      pr.totalMs = (pr.totalMs || 0) + ms;
      pr.lastAt = Date.now();
      if (pr.status === 'new') pr.status = 'learning';
      persist('repertoire');
      st.result = { ms, errors: st.errors, clean: clean.length, total: barsIn.length };
      highlight(-1, false);
      metrics(`<span><b>${fmtDur(ms)}</b> pour ${st.steps.length} étapes</span><span><b>${st.errors}</b> erreur${st.errors > 1 ? 's' : ''}</span><span><b>${clean.length}</b> / ${barsIn.length} mesures sans faute</span>`);
      const sure = barsIn.filter((b) => barLevel(progOf(it.id), b) === 2).length;
      fb(st.errors === 0 ? (sure === barsIn.length ? 'Sans faute, et toutes ces mesures sont sûres. Passe au tempo ou au passage suivant.' : 'Sans faute. Encore un passage propre pour rendre ces mesures sûres.') : st.errors <= 3 ? 'Presque. Rejoue le passage en visant zéro erreur.' : 'Reprends plus lentement, main par main si besoin.', st.errors === 0 ? 'ok' : 'info');
      drawMap();
      actions();
      if (st.loop) st.timers.push(setTimeout(() => st.phase === 'idle' && startWait(), 1600));
    }
    function hint() {
      const s = st.steps[st.idx];
      if (!s) return;
      const midis = s.notes.map((n) => n.midi);
      fb(`À jouer : <b>${namesOf(midis)}</b>`, 'info');
      Sound.unlock().then(() => midis.forEach((m) => playNote(m, performance.now() + 20, 0.8)));
    }

    /* --- au tempo --- */
    async function startTempo() {
      stopAll();
      st.result = null;
      await Sound.unlock();
      const ex = exp();
      if (!ex.length) return fb('Aucune note à jouer dans ce passage pour cette main.', 'bad');
      clearMarks();
      const cx = R.contextAt(piece, st.from);
      const meterQ = R.meterQOf(cx.meter);
      const first = piece.bars[st.from];
      const lead = first.q < meterQ - 1e-6 ? meterQ - first.q : 0;
      st.exp = ex;
      st.startQ = first.at;
      st.endQ = piece.bars[st.to].at + piece.bars[st.to].q;
      st.played = [];
      st.metro = new Sound.Metronome();
      const m = st.metro.start({ tempoQ: st.tempoQ, meter: cx.meter, countInBars: 1, volume: S.settings.metroVolume, subdivide: S.settings.metroSubdivide });
      if (!m) return toast('Son indisponible : le métronome ne peut pas démarrer');
      st.qMs = 60000 / st.tempoQ;
      st.t0 = m.t0Perf + lead * st.qMs;
      st.phase = 'play';
      Kbd.auto(...rangeFor());
      Wake.on();
      fb('Décompte d’une mesure, puis joue sans t’arrêter.', 'info');
      metrics('');
      actions();
      scrollToBar(st.from, true);
      const endAt = st.t0 + (st.endQ - st.startQ) * st.qMs;
      const loop = () => {
        const now = performance.now();
        const q = st.startQ + (now - st.t0) / st.qMs;
        if (now >= st.t0 - 30) {
          let bi = st.from;
          while (bi < st.to && piece.bars[bi + 1].at <= q + 1e-6) bi++;
          highlight(bi, true);
        }
        if (now > endAt + st.qMs * 0.6) return finishTempo();
        st.raf = requestAnimationFrame(loop);
      };
      st.raf = requestAnimationFrame(loop);
    }
    function finishTempo() {
      stopAll();
      st.phase = 'idle';
      Wake.off();
      const r = R.evaluate(st.exp, st.played, { t0: st.t0, quarterMs: st.qMs, latencyMs: S.settings.latencyMs, startQ: st.startQ, endQ: st.endQ });
      st.result = r;
      r.notes.forEach((n) => setCls(n.ids || [n.id], 'n-' + (n.state === 'missed' ? 'miss' : n.state), true));
      const pr = progW(it.id);
      const byBar = {};
      r.notes.forEach((n) => (byBar[n.bar] = byBar[n.bar] || []).push(n));
      Object.entries(byBar).forEach(([b, ns]) => {
        const good = ns.every((n) => n.state === 'ok' || n.state === 'near');
        const rec = (pr.bars[b] = pr.bars[b] || {});
        if (good && (!two || st.hands === 'both')) rec.tq = Math.max(rec.tq || 0, st.tempoQ);
      });
      const ms = Math.round((st.endQ - st.startQ) * st.qMs);
      pr.runs = (pr.runs || []).concat({ at: Date.now(), date: today(), mode: 'tempo', hands: two ? st.hands : 'both', from: st.from, to: st.to, ms, tempoQ: st.tempoQ, pitchPct: r.pitchPct, rhythmPct: r.rhythmPct, missed: r.missed, extra: r.extra }).slice(-60);
      pr.totalMs = (pr.totalMs || 0) + ms;
      pr.lastAt = Date.now();
      if (pr.status === 'new') pr.status = 'learning';
      persist('repertoire');
      metrics(`<span><b>${r.pitchPct} %</b> de notes justes</span><span><b>${r.rhythmPct} %</b> bien placées${r.meanAbsDev != null ? ` · écart ${r.meanAbsDev} ms` : ''}</span><span><b>${r.missed}</b> manquée${r.missed > 1 ? 's' : ''} · <b>${r.extra}</b> en trop</span>`);
      const good = r.pitchPct >= 95 && r.rhythmPct >= 85;
      fb(good ? `Très propre. Monte le tempo de quelques crans (objectif : ${it.tq}).` : r.pitchPct < 80 ? 'Trop de notes manquées : repasse en pas à pas, puis reviens au tempo.' : 'Bien. Rejoue en visant les notes en couleur, ou baisse un peu le tempo.', good ? 'ok' : 'info');
      $('#rp-fb', main).insertAdjacentHTML('beforeend', ' <span class="legend inline"><span class="lg ok"></span>à l’heure <span class="lg near"></span>un peu décalée <span class="lg off"></span>décalée <span class="lg miss"></span>manquée</span>');
      drawMap();
      actions();
      if (st.loop) st.timers.push(setTimeout(() => st.phase === 'idle' && startTempo(), 2200));
    }

    /* --- écoute --- */
    function playNote(midi, at, durSec) {
      if (S.settings.midiOut && Input.activeSource(S.settings.input) === 'midi' && Input.sendOut([0x90, midi, 72], at)) {
        Input.sendOut([0x80, midi, 0], at + durSec * 1000);
        return 'midi';
      }
      Sound.toneAt(midi, at, durSec);
      return 'synth';
    }
    async function startListen() {
      stopAll();
      await Sound.unlock();
      clearMarks();
      st.result = null;
      const ex = exp();
      if (!ex.length) return fb('Rien à écouter pour cette main dans ce passage.', 'bad');
      st.phase = 'listen';
      const qMs = 60000 / st.tempoQ;
      const startQ = piece.bars[st.from].at;
      const endQ = piece.bars[st.to].at + piece.bars[st.to].q;
      const t0 = performance.now() + 350;
      let i = 0;
      const sounding = new Set();
      const tick = () => {
        const now = performance.now();
        while (i < ex.length && t0 + (ex[i].q - startQ) * qMs < now + 250) {
          const n = ex[i];
          const at = t0 + (n.q - startQ) * qMs;
          const dur = Math.max(0.12, (soundDur(n.id) * qMs) / 1000 - 0.03);
          playNote(n.midi, at, dur);
          sounding.add(n.midi);
          const ids = n.ids || [n.id];
          st.timers.push(setTimeout(() => {
            if (st.phase !== 'listen') return;
            setCls(ids, 'n-cur', true);
            highlight(n.bar, true);
          }, Math.max(0, at - now)));
          st.timers.push(setTimeout(() => setCls(ids, 'n-cur', false), Math.max(0, at - now + Math.max(120, dur * 1000))));
          i++;
        }
        if (now > t0 + (endQ - startQ) * qMs + 300) {
          st.phase = 'idle';
          stopAll();
          st.result = { listened: true };
          fb('Fin du passage. Lance « Pas à pas » pour le jouer.', '');
          actions();
          return;
        }
        st.timers.push(setTimeout(tick, 60));
      };
      st.listenStop = () => {
        if (Input.activeSource(S.settings.input) === 'midi') {
          sounding.forEach((m) => Input.sendOut([0x80, m, 0]));
          Input.sendOut([0xb0, 123, 0]);
        }
        clearMarks();
      };
      fb(idleText(), 'info');
      metrics('');
      actions();
      scrollToBar(st.from, true);
      tick();
    }

    /* --- entrées et commandes --- */
    const offIn = Input.on((ev) => {
      if (st.phase === 'wait') onWaitNote(ev);
      else if (st.phase === 'play' && ev.type === 'noteon') st.played.push({ midi: ev.midi, t: ev.t });
    });
    function setRange(a, b) {
      st.from = C.clamp(Math.min(a, b), 0, nB - 1);
      st.to = C.clamp(Math.max(a, b), 0, nB - 1);
      $('#rp-from', main).textContent = st.from + off;
      $('#rp-to', main).textContent = st.to + off;
      saveOpts();
      st.result = null;
      draw();
      fb(idleText());
      metrics('');
      actions();
    }
    function tapBar(bi) {
      if (st.phase !== 'idle') return;
      if (st.anchor == null) {
        st.anchor = bi;
        setRange(bi, bi);
        toast(`Mesure ${bi + off} : touche une autre mesure pour étendre le passage`, 2200);
      } else {
        const a = st.anchor;
        st.anchor = null;
        setRange(a, bi);
      }
    }
    paper.addEventListener('click', (e) => {
      if (!st.layout || st.phase !== 'idle') return;
      const svg = paper.querySelector('svg');
      if (!svg) return;
      const r = svg.getBoundingClientRect();
      const x = ((e.clientX - r.left) * st.layout.width) / r.width;
      const y = ((e.clientY - r.top) * st.layout.height) / r.height;
      const bi = st.layout.bars.findIndex((b) => b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
      if (bi >= 0) tapBar(bi);
    });
    $('#rp-map', main).addEventListener('click', (e) => {
      const b = e.target.closest('[data-bar]');
      if (b) tapBar(+b.dataset.bar);
    });
    wireChips($('.rp-opts', main), (k, v) => {
      if (k === 'mode') st.mode = v;
      if (k === 'hands') {
        st.hands = v;
        draw();
      }
      st.result = null;
      clearMarks();
      saveOpts();
      fb(idleText());
      metrics('');
      actions();
    });
    wireSteppers($('.rp-opts', main), (id, v) => {
      if (id === 'rp-tempo') {
        st.tempoQ = v;
        saveOpts();
        return;
      }
      const bi = v - off;
      if (id === 'rp-from') setRange(bi, Math.max(bi, st.to));
      if (id === 'rp-to') setRange(Math.min(st.from, bi), bi);
    });
    $('#rp-loop', main).addEventListener('change', (e) => {
      st.loop = e.target.checked;
      saveOpts();
    });
    main.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act]');
      if (!a || a.disabled) return;
      const act = a.dataset.act;
      if (act === 'back') go('rep');
      else if (act === 'kbd') {
        Kbd.lo = rangeFor()[0];
        Kbd.hi = rangeFor()[1];
        Kbd.toggle();
      } else if (act === 'info') pieceInfo(it, () => go('piece', { id: it.id }));
      else if (act === 'all') setRange(0, nB - 1);
      else if (act === 'go') {
        if (st.mode === 'wait') startWait();
        else if (st.mode === 'tempo') startTempo();
        else startListen();
      } else if (act === 'listen') startListen();
      else if (act === 'hint') hint();
      else if (act === 'stop') {
        const wasTempo = st.phase === 'play';
        stopAll();
        st.phase = 'idle';
        Wake.off();
        if (wasTempo) clearMarks();
        fb('Arrêté. ' + idleText());
        actions();
      } else if (act === 'next') {
        const len = st.to - st.from + 1;
        setRange(st.to + 1, Math.min(nB - 1, st.to + len));
        scrollToBar(st.from, true);
      }
    });
    draw();
    fb(idleText());
    actions();
    if (st.from > 0) requestAnimationFrame(() => scrollToBar(st.from, false));
    let lastW = paper.clientWidth;
    const onResize = () => {
      const w = paper.clientWidth;
      if (st.phase !== 'idle' || Math.abs(w - lastW) < 40) return;
      lastW = w;
      draw();
    };
    window.addEventListener('resize', onResize);
    active = {
      destroy() {
        stopAll();
        Wake.off();
        offIn();
        window.removeEventListener('resize', onResize);
      },
    };
  }

  function pieceInfo(it, onChange) {

        <p class="muted">Liaisons d’expression, nuances et indications de jeu ne sont pas affichées : garde l’édition imprimée à côté pour l’interprétation.</p>`,

            delete S.repertoire.pieces[it.id];
            persist('repertoire', 0);
            onChange && onChange();
          } },
        { label: done ? 'Remettre en cours' : 'Marquer comme acquise', kind: 'secondary', act: () => {
            const p2 = progW(it.id);
            p2.status = done ? (p2.runs && p2.runs.length ? 'learning' : 'new') : 'done';

  }

  function midiTile() {

      child = null;
      Kbd.hide();
      body.innerHTML = '';
      const onChange = () => persist('draft', 400);
      if (d.block === 0) {
        child = NoteDrill(body, {
          mode: 'session',
          drill: d.drill,
          durationMs: blockMin(0) * 60000,
          clockMs: () => d.elapsed[0],
          onDrill: (dr) => {
            d.drill = dr;
            onChange();
          },
          onUpdate: (s) => {
            d.notes = { treble: s.treble, bass: s.bass, chord: s.chord, slowest: s.slowest };
            onChange();
          },
        });
      } else if (d.block === 1) child = ReadingBlock(body, { draft: d, onChange });
      else if (d.block === 2) {
        const other = d.thirdKind === 'rhythm' ? 'motifs' : 'rythme';
        body.innerHTML = `<div class="row end slim"><button type="button" class="btn ghost sm" data-act="swap">Faire plutôt ${other === 'motifs' ? 'les motifs' : 'le rythme'}</button></div><div id="ss-third"></div>`;
        const host = $('#ss-third', body);
        child =
          d.thirdKind === 'rhythm'
            ? RhythmTrainer(host, { level: d.phase || 1, tempoQ: (d.reading && d.reading.tempoQ) || S.settings.tempoQ, onUpdate: (r) => { d.rhythm = r; onChange(); } })
            : MotifTrainer(host, { phase: d.phase || 1, onUpdate: (m) => { d.motifs = m; onChange(); } });
      } else {
        child = ReportForm(body, {
          draft: d,
          onSaved: (s) => {
            clearInterval(tick);
            Wake.off();
            body.innerHTML = `<div class="saved"><p class="eyebrow">Séance enregistrée</p><h2 class="display-sm">${cap(frDate(s.date))}</h2>
              <p class="lead">${s.reading && s.reading.pieces.length ? `Prochaine séance à ${tempoHTML(s.reading.nextTempoQ, '4/4', 8)}.` : ''} Série : ${C.streak(S.sessions.map((x) => x.date), today())} soir(s).</p>
              <div class="actions"><button type="button" class="btn primary big" data-act="tomorrow">${icon('calendar', 22)}<span>Préparer demain</span></button><button type="button" class="btn secondary" data-act="md">${icon('save', 20)}<span>Exporter en Markdown</span></button><button type="button" class="btn ghost" data-act="home">Retour à l’accueil</button></div></div>`;
            $('.sbar', main).classList.add('quiet');
            savedSession = s;
          },
        });
      }
      steps();
    }
    let savedSession = null;
    function setBlock(i) {
      if (i === d.block) return;
      d.block = C.clamp(i, 0, 3);
      persist('draft');
      mount();
    }
    const tick = setInterval(() => {
      const now = performance.now();
      if (!paused && S.draft) d.elapsed[d.block] += now - last;
      last = now;
      const remain = blockMin(d.block) * 60000 - d.elapsed[d.block];
      const tEl = $('#ss-timer', main);
      if (tEl) {
        tEl.textContent = remain >= 0 ? clock(remain) : '+' + clock(-remain);
        tEl.classList.toggle('over', remain < 0);
      }
      if (remain <= 0 && !chimed.has(d.block) && d.block < 3) {
        chimed.add(d.block);
        Sound.chime();
        toast('Temps écoulé : passe au bloc suivant quand tu es prêt.');
      }
      const bar = main.querySelector('.step.cur .step-bar');
      if (bar) bar.style.width = Math.min(100, (100 * d.elapsed[d.block]) / (blockMin(d.block) * 60000)) + '%';
      if (Math.floor(now / 5000) !== Math.floor((now - 250) / 5000)) persist('draft', 0);
    }, 250);
    main.addEventListener('click', async (e) => {
      const stp = e.target.closest('[data-step]');
      if (stp) return setBlock(+stp.dataset.step);
      const a = e.target.closest('[data-act]');
      if (!a) return;
      const act = a.dataset.act;
      if (act === 'next') setBlock(d.block + 1);
      else if (act === 'pause') {
        paused = !paused;
        $('#ss-pause', main).innerHTML = paused ? icon('play') : icon('pause');
        $('#ss-pause', main).setAttribute('aria-label', paused ? 'Reprendre' : 'Pause');
        $('#ss-timer', main).classList.toggle('paused', paused);
        if (child && child.pause) paused ? child.pause() : child.resume();
      } else if (act === 'kbd') Kbd.toggle();
      else if (act === 'swap') {
        d.thirdKind = d.thirdKind === 'rhythm' ? 'motifs' : 'rhythm';
        persist('draft');
        mount();
      } else if (act === 'quit') {
        if (savedSession) return go('home');
        const ok = await confirmBox('Quitter la séance ?', 'Ta progression est gardée : tu pourras la reprendre depuis l’accueil.', 'Quitter');
        if (ok) go('home');
      } else if (act === 'tomorrow') showTomorrow(savedSession ? savedSession.date : today());
      else if (act === 'md' && savedSession) exportSessionMD(savedSession);
      else if (act === 'home') go('home');
    });
    Wake.on();
    mount();
    active = {
      destroy() {
        clearInterval(tick);
        if (child && child.destroy) child.destroy();
        if (S.draft) persist('draft', 0);
      },
      get child() {
        return child;
      },
    };
  }

  /* ---------- 5.3 Exercices libres ---------- */
  function screenFree(main, p) {
    const ex = p.ex;
    if (!ex) {
      main.innerHTML = `<div class="page"><header class="page-head"><p class="eyebrow">Hors séance</p><h1 class="display">Exercices libres</h1><p class="sub">Chaque note jouée nourrit la répétition espacée, même hors séance.</p></header><div class="free-grid big">${freeTiles().join('')}</div></div>`;
      main.addEventListener('click', (e) => {
        const a = e.target.closest('[data-act^="free:"]');
        if (a) go('free', { ex: a.dataset.act.slice(5) });
      });
      return;
    }
    const meta = FREE.find((f) => f[0] === ex) || FREE[0];
    main.innerHTML = `<div class="page ex-page"><div class="ex-bar"><button type="button" class="btn ghost" data-act="back">${icon('back', 20)}<span>Exercices</span></button><h1 class="h1">${meta[1]}</h1><button type="button" class="icon-btn" data-act="kbd" aria-label="Afficher le clavier à l’écran">${icon('keys')}</button></div><div id="ex-host"></div></div>`;
    const host = $('#ex-host', main);
    let child = null;
    if (ex === 'notes') child = NoteDrill(host, { mode: 'free', drill: { ...effDrill(), variant: 'notes' } });
    else if (ex === 'chords') child = NoteDrill(host, { mode: 'free', drill: { ...effDrill(), variant: 'accords' } });
    else if (ex === 'rhythm') child = RhythmTrainer(host, {});
    else if (ex === 'motifs') child = MotifTrainer(host, {});
    else if (ex === 'generated') child = GeneratedReader(host, {});
    else if (ex === 'piece') {
      const run = () => {
        if (child && child.destroy) child.destroy();
        host.innerHTML = '<div id="pc-host"></div>';
        child = PieceRunner($('#pc-host', host), {
          piece: { label: 'Pièce libre', meter: '' },
          mode: 'free',
          onFinish: (r) => {
            if (child && child.destroy) child.destroy();
            host.innerHTML = `<div class="saved"><p class="eyebrow">Pièce terminée</p><p class="lead">${r.stops} arrêt(s) · ${r.wrong} fausse(s) note(s)${r.regMs != null ? ` · régularité ${r.regMs} ms` : ''}</p><div class="actions"><button type="button" class="btn primary" data-act="again">${icon('refresh', 20)}<span>Une autre pièce</span></button></div></div>`;
          },
        });
      };

      host.addEventListener('click', (e) => e.target.closest('[data-act="again"]') && run());
    }
    if (ex !== 'piece') Wake.on();
    main.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      if (a.dataset.act === 'back') go('free');
      if (a.dataset.act === 'kbd') Kbd.toggle();
    });
    active = { destroy: () => child && child.destroy && child.destroy() };
  }

  /* ---------- 5.4 Diagnostic ---------- */
  const DIAG_WEEKS = [0, 4, 8, 12];
  const DIAG_TESTS = [
    ['sol', 'Clé de sol', '20 notes, une ligne supplémentaire au plus. Temps total et erreurs.'],
    ['fa', 'Clé de fa', 'Même test en clé de fa.'],
    ['reading', 'Déchiffrage', 'Deux pièces, mains ensemble, noire = 60, première lecture, sans s’arrêter.'],
    ['topo', 'Topographie', 'Rejoue la main droite de la 2e pièce sans regarder tes mains. Compte tes coups d’œil.'],
    ['rhythm', 'Rythme', 'Joue le rythme de la 1re pièce sur une touche, noire = 60. Les arrêts sont comptés.'],
    ['motifs', 'Motifs', 'Cinq intervalles ou accords : combien en moins de 2 secondes ?'],
  ];
  function diagRows(list) {
    const cols = DIAG_WEEKS.map((w) => list.filter((d) => d.diagWeek === w).slice(-1)[0] || null);
    const v = (d, f) => (d ? f(d.tests) : '—');
    const rows = [
      ['Clé de sol', (t) => (t.sol ? `${fmtSec(t.sol.totalMs)} · ${t.sol.errors} err.` : '—')],
      ['Clé de fa', (t) => (t.fa ? `${fmtSec(t.fa.totalMs)} · ${t.fa.errors} err.` : '—')],
      ['Déchiffrage', (t) => (t.reading ? `${t.reading.reduce((a, p) => a + p.stops, 0)} arrêt(s) · ${t.reading.reduce((a, p) => a + p.wrong, 0)} f.n.` : '—')],
      ['Topographie', (t) => (t.topo ? `${t.topo.glances} coup(s) d’œil` : '—')],
      ['Rythme', (t) => (t.rhythm ? `${t.rhythm.stops} arrêt(s)` : '—')],
      ['Motifs', (t) => (t.motifs != null ? `${t.motifs} / 5` : '—')],
    ];
    return `<div class="table-wrap"><table class="tbl diag-tbl"><thead><tr><th>Test</th>${DIAG_WEEKS.map((w, i) => `<th>Sem. ${w}${cols[i] ? `<small>${frDate(cols[i].date, { day: 'numeric', month: 'short' })}</small>` : ''}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(([lab, f]) => `<tr><th scope="row">${lab}</th>${cols.map((d) => `<td>${v(d, f)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  function screenDiag(main) {
    const w = weekNow();
    const due = C.diagnosticDue(w, S.diagnostics, today(), S.program.startDate);
    const next = due != null ? due : DIAG_WEEKS.find((x) => !S.diagnostics.some((d) => d.diagWeek === x)) ?? 12;
    main.innerHTML = `<div class="page"><header class="page-head"><p class="eyebrow">Semaines 0, 4, 8 et 12</p><h1 class="display">Diagnostic</h1><p class="sub">Six tests guidés pour mesurer ta lecture, toujours dans les mêmes conditions.</p></header>
      <div class="diag-grid"><section class="card"><h2 class="h2">Prochain diagnostic</h2>
        <div class="field"><span class="lab">Semaine</span>${chipsHTML('dw', DIAG_WEEKS.map((x) => [x, 'Semaine ' + x]), next)}</div>
        <ol class="test-list">${DIAG_TESTS.map(([k, t, dsc]) => `<li><b>${t}</b><span>${dsc}</span></li>`).join('')}</ol>
        <div class="actions"><button type="button" class="btn primary big" data-act="run">${icon('gauge', 22)}<span>Commencer le diagnostic</span></button></div></section>
      <section class="card"><h2 class="h2">Résultats</h2>${S.diagnostics.length ? diagRows(S.diagnostics) : '<p class="muted">Aucun diagnostic enregistré. Le premier sert de point de départ : les suivants s’afficheront à côté pour comparaison.</p>' + diagRows([])}</section></div></div>`;
    let chosen = next;
    wireChips(main, (k, v) => (chosen = +v));
    main.addEventListener('click', (e) => {
      if (e.target.closest('[data-act="run"]')) go('diagrun', { week: chosen });
    });
  }
  function screenDiagRun(main, p) {
    const W = p.week != null ? p.week : 0;
    const cfg = S.program.diagnostics[W] || { collection: '', pieces: '' };
    const pcs = C.parsePieceList(cfg.pieces).slice(0, 2).map((num) => ({ label: C.pieceLabel(cfg.collection, num), short: /^\d+$/.test(num) ? 'n° ' + num : num, meter: '' }));
    while (pcs.length < 2) pcs.push({ label: `Pièce ${pcs.length + 1} du test`, short: `Pièce ${pcs.length + 1}`, meter: '' });
    const res = { diagWeek: W, date: today(), tests: {} };
    const skipped = new Set();
    let i = 0;
    let child = null;
    main.innerHTML = `<div class="session"><header class="sbar"><button type="button" class="icon-btn" data-act="quit" aria-label="Quitter le diagnostic">${icon('close')}</button>
      <ol class="steps diag" id="dg-steps"></ol><div class="sbar-right"><button type="button" class="icon-btn" data-act="kbd" aria-label="Clavier à l’écran">${icon('keys')}</button></div></header><div class="sbody" id="dg-body"></div></div>`;
    const body = $('#dg-body', main);
    function steps() {
      $('#dg-steps', main).innerHTML = DIAG_TESTS.map(([k, t], j) => {
        const sk = skipped.has(j);
        return `<li><span class="step ${j === i ? 'cur' : j < i ? (sk ? 'skipped' : 'done') : ''}"><span class="step-n">${j < i ? (sk ? icon('minus', 16) : icon('check', 16)) : j + 1}</span><span class="step-l">${t}</span></span></li>`;
      }).join('');
    }
    function intro(text, then) {
      body.innerHTML = `<div class="diag-intro"><p class="eyebrow">Test ${i + 1} sur 6 · diagnostic de la semaine ${W}</p><h2 class="display-sm">${DIAG_TESTS[i][1]}</h2><p class="lead">${text}</p><div class="actions"><button type="button" class="btn primary big" data-act="begin">${icon('play', 22)}<span>Commencer le test</span></button><button type="button" class="btn ghost" data-act="skiptest">Passer ce test</button></div></div>`;
      body.querySelector('[data-act="begin"]').addEventListener('click', then);
    }
    function nextTest() {
      if (child && child.destroy) child.destroy();
      child = null;
      i++;
      if (i >= DIAG_TESTS.length) return finish();
      run();
    }
    function run() {
      steps();
      const k = DIAG_TESTS[i][0];
      Kbd.hide();
      if (k === 'sol' || k === 'fa') {
        intro(`${DIAG_TESTS[i][2]} Joue chaque note dès qu’elle apparaît, sans regarder tes mains.`, () => {
          body.innerHTML = '<div id="dg-host"></div>';
          child = NoteDrill($('#dg-host', body), {
            mode: 'diag',
            count: 20,
            drill: { clefMode: k === 'sol' ? 'treble' : 'bass', ledger: 1, accidentals: false, variant: 'notes' },
            onDone: (r) => {
              res.tests[k] = { totalMs: r.totalMs, errors: r.errors, meanRt: k === 'sol' ? r.treble.meanRt : r.bass.meanRt };
              nextTest();
            },
          });
        });
      } else if (k === 'reading') {
        const done = [];
        const one = (j) => {
          if (child && child.destroy) child.destroy();
          body.innerHTML = '<div id="dg-host"></div>';
          child = PieceRunner($('#dg-host', body), {
            piece: pcs[j],
            index: j,
            total: 2,
            tempoQ: 60,
            fixedTempo: true,
            onFinish: (r) => {
              done.push({ label: pcs[j].short, stops: r.stops, wrong: r.wrong, regMs: r.regMs, meter: r.meter });
              if (j === 0) one(1);
              else {
                res.tests.reading = done;
                nextTest();
              }
            },
          });
        };
        intro(`${DIAG_TESTS[i][2]}<br><b>${esc(pcs[0].label)}</b> puis <b>${esc(pcs[1].label)}</b>.`, () => one(0));
      } else if (k === 'topo') {
        intro(DIAG_TESTS[i][2], () => {
          let g = 0;
          body.innerHTML = `<div class="topo"><p class="lead">Main droite de <b>${esc(pcs[1].label)}</b>. Touche le bouton à chaque fois que tes yeux quittent la partition.</p>
            <button type="button" class="glance-pad" data-act="g">${icon('eye', 40)}<span>Coup d’œil</span><b id="tp-n">0</b></button>
            <div class="actions"><button type="button" class="btn ghost" data-act="g-">${icon('minus', 20)}<span>Retirer un</span></button><button type="button" class="btn primary big" data-act="tdone">${icon('check', 22)}<span>Terminé</span></button></div></div>`;
          body.onclick = (e) => {
            const a = e.target.closest('[data-act]');
            if (!a) return;
            if (a.dataset.act === 'g') g++;
            if (a.dataset.act === 'g-') g = Math.max(0, g - 1);
            const n = $('#tp-n', body);
            if (n) n.textContent = g;
            if (a.dataset.act === 'tdone') {
              body.onclick = null;
              res.tests.topo = { glances: g };
              nextTest();
            }
          };
        });
      } else if (k === 'rhythm') {
        intro(`${DIAG_TESTS[i][2]} Pièce : <b>${esc(pcs[0].label)}</b>. Mains sur une seule touche, ou tape sur tes cuisses et compte toi-même les arrêts.`, () => {
          body.innerHTML = '<div id="dg-host"></div>';
          child = PieceRunner($('#dg-host', body), {
            piece: { ...pcs[0] },
            mode: 'rhythm',
            tempoQ: 60,
            fixedTempo: true,
            lastMeter: (res.tests.reading && res.tests.reading[0] && res.tests.reading[0].meter) || '',
            onFinish: (r) => {
              res.tests.rhythm = { stops: r.stops, regMs: r.regMs };
              nextTest();
            },
          });
        });
      } else if (k === 'motifs') {
        intro(DIAG_TESTS[i][2], () => {
          body.innerHTML = '<div id="dg-host"></div>';
          child = MotifTrainer($('#dg-host', body), {
            maxRounds: 1,
            phase: 1,
            onDone: (score) => {
              res.tests.motifs = score;
              nextTest();
            },
          });
          body.querySelector('[data-act="start"]').click();
        });
      }
      const sk = body.querySelector('[data-act="skiptest"]');
      if (sk)
        sk.addEventListener('click', () => {
          skipped.add(i);
          nextTest();
        });
    }
    function finish() {
      Kbd.hide();
      S.diagnostics = S.diagnostics.filter((d) => !(d.diagWeek === W && d.date === res.date)).concat(res);
      persist('diagnostics', 0);
      steps();
      let suggestion = '';
      if (W === 0 && res.tests.reading) {
        const stops = res.tests.reading.reduce((a, x) => a + x.stops, 0);
        const wrong = Math.max(...res.tests.reading.map((x) => x.wrong));
        const tq = stops === 0 && wrong <= 2 ? 72 : stops > 4 ? 50 : 60;
        suggestion = `<div class="verdict"><p class="eyebrow">Calibrage du tempo</p><p class="verdict-main">${tempoHTML(tq, '4/4', 10)}</p><p class="muted">${tq === 72 ? 'Aucun arrêt et presque aucune fausse note : commence la phase 1 à noire = 72.' : tq === 50 ? 'Plus de 4 arrêts : commence plus lentement, à noire = 50.' : 'Départ standard : noire = 60.'}</p><button type="button" class="btn primary" data-act="apply" data-t="${tq}">Appliquer ce tempo</button></div>`;
      }
      body.innerHTML = `<div class="saved"><p class="eyebrow">Diagnostic enregistré</p><h2 class="display-sm">Semaine ${W}</h2>${diagRows(S.diagnostics)}${suggestion}<div class="actions"><button type="button" class="btn secondary" data-act="home">Retour à l’accueil</button></div></div>`;
    }
    main.addEventListener('click', async (e) => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      if (a.dataset.act === 'quit') {
        if (i >= DIAG_TESTS.length) return go('diag');
        if (await confirmBox('Quitter le diagnostic ?', 'Les tests déjà faits ne seront pas enregistrés.', 'Quitter')) go('diag');
      } else if (a.dataset.act === 'kbd') Kbd.toggle();
      else if (a.dataset.act === 'apply') {
        S.settings.tempoQ = +a.dataset.t;
        persist('settings');
        toast(`Tempo du jour : noire = ${a.dataset.t}`);
      } else if (a.dataset.act === 'home') go('home');
    });
    Wake.on();
    run();
    active = { destroy: () => child && child.destroy && child.destroy() };
  }

  /* ---------- 5.5 Progrès ---------- */
  function niceMax(v) {
    if (!(v > 0)) return 1;
    const p = 10 ** Math.floor(Math.log10(v));
    for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
    return 10 * p;
  }
  /** Graphique SVG : lignes (ou barres) sur une échelle commune, dernier point mis en valeur. */
  function chart({ title, unit = '', series, bars = false, step = false, yMin = 0, yMaxFixed = null, integer = false, fmt = (v) => String(v), example = false, height = 210 }) {
    const W = 560;
    const H = height;
    const L = 46;
    const R = 16;
    const T = 16;
    const B = 30;
    const xs = [...new Set(series.flatMap((s) => s.points.map((p) => p.x)))].sort();
    const vals = series.flatMap((s) => s.points.map((p) => p.y)).filter((v) => v != null);
    if (!xs.length || !vals.length) return `<figure class="chart"><figcaption>${title}</figcaption><p class="muted chart-empty">Pas encore de données.</p></figure>`;
    const lo = yMin;
    let yMax = yMaxFixed != null ? yMaxFixed : niceMax(Math.max(...vals) * 1.05);
    if (integer) yMax = lo + 4 * Math.max(1, Math.ceil((Math.max(...vals, lo + 1) - lo) / 4));
    const X = (x) => L + (xs.length === 1 ? (W - L - R) / 2 : ((W - L - R) * xs.indexOf(x)) / (xs.length - 1));
    const Y = (v) => T + (H - T - B) * (1 - (v - lo) / (yMax - lo || 1));
    let g = '';
    for (let k = 0; k <= 4; k++) {
      const v = lo + ((yMax - lo) * k) / 4;
      g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
    }
    const lab = (x) => frDate(x, { day: 'numeric', month: 'short' });
    const showIdx = xs.length <= 6 ? xs.map((_, i) => i) : [0, Math.floor((xs.length - 1) / 2), xs.length - 1];
    showIdx.forEach((i) => (g += `<text class="tick" x="${X(xs[i])}" y="${H - 8}" text-anchor="middle">${lab(xs[i])}</text>`));
    let marks = '';
    const bw = Math.max(6, Math.min(26, ((W - L - R) / Math.max(xs.length, 1)) * 0.55));
    series.forEach((s, si) => {
      const pts = s.points.filter((p) => p.y != null);
      if (!pts.length) return;
      if (bars) {
        pts.forEach((p) => (marks += `<rect class="bar s${si}" x="${X(p.x) - bw / 2}" y="${Y(p.y)}" width="${bw}" height="${Math.max(0, Y(lo) - Y(p.y))}" rx="3"/>`));
      } else {
        let d = '';
        pts.forEach((p, i) => {
          if (i === 0) d += `M${X(p.x)} ${Y(p.y)}`;
          else if (step) d += `H${X(p.x)}V${Y(p.y)}`;
          else d += `L${X(p.x)} ${Y(p.y)}`;
        });
        marks += `<path class="area s${si}" d="${d}L${X(pts[pts.length - 1].x)} ${Y(lo)}L${X(pts[0].x)} ${Y(lo)}Z"/><path class="line s${si}" d="${d}"/>`;
        const e = pts[pts.length - 1];
        marks += `<circle class="end s${si}" cx="${X(e.x)}" cy="${Y(e.y)}" r="4.5"/><text class="endlab s${si}" x="${Math.min(X(e.x), W - R - 4)}" y="${Y(e.y) - 10}" text-anchor="end">${fmt(e.y)}${unit}</text>`;
      }
    });
    const legend = series.length > 1 ? `<div class="legend-row">${series.map((s, si) => `<span class="lg-item"><span class="sw s${si}"></span>${s.name}</span>`).join('')}</div>` : '';
    return `<figure class="chart${example ? ' example' : ''}"><figcaption>${title}${example ? '<span class="pill">Exemple</span>' : ''}</figcaption>${legend}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${g}${marks}</svg></figure>`;
  }
  function exampleSessions() {
    const out = [];
    let tq = 60;
    for (let i = 0; i < 10; i++) {
      const date = C.addDays('2026-09-01', i + Math.floor(i / 6));
      const sol = 2600 - i * 120 + (i % 3) * 60;
      const fa = 3400 - i * 150 + (i % 2) * 90;
      const stops = Math.max(0, 5 - Math.floor(i / 2));
      out.push({ date, notes: { treble: { meanRt: sol }, bass: { meanRt: fa } }, reading: { tempoQ: tq, pieces: [{ stops }] }, rhythm: { best: 55 + i * 4 } });
      if (stops === 0) tq += 6;
    }
    return out;
  }
  function heatColor(st, g) {
    if (!st || !st.n) return null;
    const slow = C.clamp((st.ema / g - 0.75) / 1.25, 0, 1);
    const v = C.clamp(0.6 * slow + 0.6 * st.err, 0, 1);
    const stops = [[28, 116, 72], [190, 132, 20], [176, 40, 31]];
    const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
    const c = v < 0.5 ? mix(stops[0], stops[1], v * 2) : mix(stops[1], stops[2], (v - 0.5) * 2);
    return `rgb(${c.join(',')})`;
  }
  function screenProgress(main) {
    const real = S.sessions.length > 0;
    const data = real ? S.sessions : exampleSessions();
    const by = (f) => data.map((s) => ({ x: s.date, y: f(s) }));
    const notesChart = chart({ title: 'Temps moyen par note', unit: ' s', series: [{ name: 'Clé de sol', points: by((s) => (s.notes && s.notes.treble && s.notes.treble.meanRt != null ? Math.round(s.notes.treble.meanRt / 100) / 10 : null)) }, { name: 'Clé de fa', points: by((s) => (s.notes && s.notes.bass && s.notes.bass.meanRt != null ? Math.round(s.notes.bass.meanRt / 100) / 10 : null)) }], fmt: (v) => String(Math.round(v * 10) / 10).replace('.', ','), example: !real });
    const tempoChart = chart({ title: 'Tempo de déchiffrage (noire)', series: [{ name: 'Tempo', points: by((s) => (s.reading ? s.reading.tempoQ : null)) }], step: true, yMin: 30, fmt: (v) => String(Math.round(v)), example: !real });
    const stopsChart = chart({ title: 'Arrêts par séance', series: [{ name: 'Arrêts', points: by((s) => (s.reading && s.reading.pieces && s.reading.pieces.length ? s.reading.pieces.reduce((a, p) => a + (p.stops || 0), 0) : null)) }], bars: true, integer: true, fmt: (v) => String(Math.round(v)), example: !real });
    const rhythmChart = chart({ title: 'Précision rythmique (score / 100)', series: [{ name: 'Rythme', points: by((s) => (s.rhythm && s.rhythm.best != null ? s.rhythm.best : null)) }], yMaxFixed: 100, fmt: (v) => String(Math.round(v)), example: !real });
    const g = C.globalMeanRt(S.stats);
    const heat = (clef) => {
      const cells = [];
      for (let p = -6; p <= 14; p++) {
        const n = C.fromStaffPos(clef, p);
        const key = C.noteKey(clef, n);
        const col = heatColor(S.stats[key], g);
        cells.push({ ...n, key, color: col || 'rgba(59,56,48,.28)', mark: S.stats[key] && S.stats[key].err > 0.25 });
      }
      return N.heatStaff({ clef, cells, S: 13 });
    };
    const slow = C.slowestNotes(S.stats, 8);
    const statsCount = Object.keys(S.stats).length;
    main.innerHTML = `<div class="page progress"><header class="page-head"><p class="eyebrow">${real ? `${S.sessions.length} séance${S.sessions.length > 1 ? 's' : ''} · série de ${C.streak(S.sessions.map((s) => s.date), today())}` : 'Aucune séance encore : les graphiques montrent un exemple'}</p><h1 class="display">Progrès</h1></header>
      <div class="charts">${notesChart}${tempoChart}${stopsChart}${rhythmChart}</div>
      <section class="card heat-card"><div class="card-head"><h2 class="h2">Carte des notes difficiles</h2><p class="legend"><span class="lg ok"></span>rapide <span class="lg near"></span>hésitante <span class="lg bad"></span>lente ou souvent ratée <span class="lg none"></span>jamais vue</p></div>
        <div class="heat-wrap paper">${heat('treble')}${heat('bass')}</div>
        <p class="muted" id="hm-detail">${statsCount ? 'Touche une note pour voir son détail. Un point rouge marque les notes ratées plus d’une fois sur quatre.' : 'La carte se remplit au fil des exercices de notes.'}</p>
        ${slow.length ? `<h3 class="h3">Notes les plus lentes</h3><ol class="slow-list">${slow.map((x) => { const n = C.parseNoteKey(x.key); return `<li><b>${n ? nl(n) : x.key}</b><span>${n ? (n.clef === 'treble' ? 'clé de sol' : 'clé de fa') : ''}</span><span class="num">${fmtSec(x.ema)}</span><span class="num muted">${Math.round(x.err * 100)} % d’erreurs</span></li>`; }).join('')}</ol>` : ''}
      </section>
      <section class="card"><div class="card-head"><h2 class="h2">Journal</h2><button type="button" class="btn secondary sm" data-act="csv">${icon('save', 18)}<span>Exporter le journal (CSV)</span></button></div>
        ${real ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Date</th><th class="num">Sol</th><th class="num">Fa</th><th class="num">Tempo</th><th class="num">Arrêts</th><th class="num">Ressenti</th><th></th></tr></thead><tbody>${[...S.sessions].reverse().map((s) => `<tr><td>${frDate(s.date, { weekday: 'short', day: 'numeric', month: 'short' })}</td><td class="num">${fmtSec(s.notes && s.notes.treble && s.notes.treble.meanRt)}</td><td class="num">${fmtSec(s.notes && s.notes.bass && s.notes.bass.meanRt)}</td><td class="num">${s.reading ? s.reading.tempoQ : '—'}</td><td class="num">${s.reading && s.reading.pieces ? s.reading.pieces.reduce((a, p) => a + (p.stops || 0), 0) : '—'}</td><td class="num">${s.feeling || '—'}</td><td><button type="button" class="btn ghost xs" data-md="${s.id}">Markdown</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Ton journal apparaîtra ici après la première séance enregistrée.</p>'}
      </section></div>`;
    main.addEventListener('click', (e) => {
      const hm = e.target.closest('.hm');
      if (hm) {
        const st = S.stats[hm.dataset.key];
        const n = C.parseNoteKey(hm.dataset.key);
        $('#hm-detail', main).textContent = n ? (st && st.n ? `${nl(n)} (${n.clef === 'treble' ? 'clé de sol' : 'clé de fa'}) : ${st.n} essai${st.n > 1 ? 's' : ''}, ${fmtSec(st.ema)} en moyenne récente, ${Math.round(st.err * 100)} % d’erreurs.` : `${nl(n)} : pas encore travaillée.`) : '';
        return;
      }
      const md = e.target.closest('[data-md]');
      if (md) {
        const s = S.sessions.find((x) => x.id === md.dataset.md);
        if (s) exportSessionMD(s);
      }
      if (e.target.closest('[data-act="csv"]')) exportDialog('Journal en CSV', `journal-piano-${today()}.csv`, C.sessionsToCSV(S.sessions), 'text/csv');
    });
  }

          save();
          render();
        }
      }
    });
