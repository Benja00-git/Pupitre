/* Pupitre : la laque d'ébène du piano autour d'une feuille de musique crème.
   La partition reste toujours encre sombre sur papier, comme sur le pupitre, même de nuit.
   Mise en page : rail de navigation à gauche en paysage, barre d'onglets en bas en portrait ;
   en séance, plein écran avec une barre d'étapes collante. */
:root {
  --bg: #0f1216;
  --surface: #161a20;
  --surface-2: #1d232b;
  --surface-3: #262d37;
  --line: #2d3540;
  --text: #ece6d8;
  --text-2: #a9b1bc;
  --text-3: #808a97;
  --accent: #8fb2dd;
  --accent-strong: #b8d0ec;
  --accent-soft: rgba(143, 178, 221, 0.14);
  --on-accent: #0c1726;
  --series-2: #d9a85c;
  --ok: #6cc596;
  --warn: #e8b85a;
  --bad: #f07d70;
  --on-ok: #0b1a12;
  --on-warn: #241600;
  --on-bad: #2a0703;
  --paper: #e7dfcc;
  --paper-2: #ddd3bc;
  --paper-edge: #c7bb9f;
  --ink: #1c1a16;
  --ink-2: #57524a;
  --staff-ink: #3d3a33;
  --ok-ink: #1c7448;
  --near-ink: #9a5f06;
  --off-ink: #b4561a;
  --bad-ink: #b0281f;
  --miss-ink: #8b8578;
  --cur-ink: #2c5c9a;
  --hl: rgba(44, 92, 154, 0.16);
  --shadow: 0 18px 44px -20px rgba(0, 0, 0, 0.6);
  --font-display: 'Bodoni Moda', 'Bodoni 72', Didot, 'Bodoni MT', Georgia, serif;
  --font-ui: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}
:root[data-ui='light'],
:root[data-ui='auto'][data-theme='light'] {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --surface-3: #e1e6ec;
  --line: #d3dae3;
  --text: #16202b;
  --text-2: #4f5b6a;
  --text-3: #6b7684;
  --accent: #2c5c9a;
  --accent-strong: #1f4677;
  --accent-soft: rgba(44, 92, 154, 0.1);
  --on-accent: #ffffff;
  --series-2: #a86e12;
  --ok: #1e8a55;
  --warn: #a8700f;
  --bad: #c2382e;
  --on-ok: #ffffff;
  --on-warn: #ffffff;
  --on-bad: #ffffff;
  --paper: #fbf7ec;
  --paper-2: #f2ebda;
  --paper-edge: #e0d5bc;
  --hl: rgba(44, 92, 154, 0.13);
  --shadow: 0 14px 34px -16px rgba(22, 32, 43, 0.28);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root[data-ui='auto']:not([data-theme='dark']) {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-2: #f3f5f8;
    --surface-3: #e1e6ec;
    --line: #d3dae3;
    --text: #16202b;
    --text-2: #4f5b6a;
    --text-3: #6b7684;
    --accent: #2c5c9a;
    --accent-strong: #1f4677;
    --accent-soft: rgba(44, 92, 154, 0.1);
    --on-accent: #ffffff;
    --series-2: #a86e12;
    --ok: #1e8a55;
    --warn: #a8700f;
    --bad: #c2382e;
    --on-ok: #ffffff;
    --on-warn: #ffffff;
    --on-bad: #ffffff;
    --paper: #fbf7ec;
    --paper-2: #f2ebda;
    --paper-edge: #e0d5bc;
    --hl: rgba(44, 92, 154, 0.13);
    --shadow: 0 14px 34px -16px rgba(22, 32, 43, 0.28);
    color-scheme: light;
  }
}

/* ---------- Base ---------- */
[hidden] { display: none !important; }
html { font-size: 106.25%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
p { margin: 0; }
b, strong { font-weight: 700; }

.app { display: grid; grid-template-columns: 96px minmax(0, 1fr); min-height: 100dvh; }
.main { min-width: 0; padding: 28px max(24px, env(safe-area-inset-right, 0px)) 48px 32px; outline: none; }
.screen { min-width: 0; }
.page { display: flex; flex-direction: column; gap: 24px; max-width: 1280px; }

/* ---------- Navigation ---------- */
.rail {
  position: sticky;
  top: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 16px 8px 12px max(8px, env(safe-area-inset-left, 0px));
  background: var(--surface);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  z-index: 30;
}
.brand { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 14px; color: var(--accent); }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; color: var(--text); letter-spacing: 0.01em; }
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 62px;
  padding: 8px 4px;
  border: 0;
  border-radius: 14px;
  background: none;
  color: var(--text-2);
  font: 600 0.74rem/1.1 var(--font-ui);
  cursor: pointer;
}
.nav-item:hover { color: var(--text); background: var(--surface-2); }
.nav-item.on { color: var(--accent-strong); background: var(--accent-soft); }
.nav-status { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 12px; font-size: 0.72rem; font-weight: 600; color: var(--text-2); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--text-3); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(108, 197, 150, 0.2); }
.dot.mid { background: var(--warn); }

.app.focus { grid-template-columns: minmax(0, 1fr); }
.app.focus .rail { display: none; }
.app.focus .main { padding-top: 0; padding-left: max(24px, env(safe-area-inset-left, 0px)); }

@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: fixed;
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    height: auto;
    flex-direction: row;
    justify-content: space-around;
    gap: 2px;
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
    border-right: 0;
    border-top: 1px solid var(--line);
    overflow: visible;
  }
  .brand, .nav-status { display: none; }
  .nav-item { flex: 1 1 0; min-width: 0; min-height: 56px; font-size: 0.68rem; }
  .main { padding: 22px max(16px, env(safe-area-inset-right, 0px)) calc(104px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .app.focus .main { padding-bottom: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (max-width: 560px) { .nav-item span { display: none; } }

/* ---------- Typographie ---------- */
.display {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(2rem, 4.2vw, 3rem);
  line-height: 1.04;
  letter-spacing: -0.012em;
  margin: 0;
  text-wrap: balance;
}
.display-sm { font-family: var(--font-display); font-weight: 600; font-size: 1.9rem; line-height: 1.1; margin: 0.15em 0 0.3em; text-wrap: balance; }
.eyebrow { font-size: 0.76rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 0 0 0.45rem; }
.h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.7rem; margin: 0; }
.h2 { font-size: 1.1rem; font-weight: 700; margin: 0 0 0.2rem; }
.h3 { font-size: 1rem; font-weight: 700; margin: 0.6rem 0 0.2rem; }
.lead { font-size: 1.14rem; max-width: 62ch; }
.muted { color: var(--text-2); }
.sub { color: var(--text-3); font-size: 0.85rem; }
.lab, dt { display: block; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-2); }
.mono { font-family: var(--font-mono); font-size: 0.9rem; }
.page-head { display: flex; flex-direction: column; gap: 2px; }
.page-head .sub { font-size: 1rem; margin-top: 6px; color: var(--text-2); }

/* ---------- Boutons et contrôles ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 52px;
  padding: 0 1.2rem;
  border: 1px solid transparent;
  border-radius: 13px;
  font: 700 1rem/1.15 var(--font-ui);
  cursor: pointer;
  text-align: center;
  transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.08s;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.secondary { background: var(--surface-2); color: var(--text); border-color: var(--line); }
.btn.secondary:hover { border-color: var(--accent); }
.btn.ghost { background: transparent; color: var(--text-2); }
.btn.ghost:hover { color: var(--text); background: var(--surface-2); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.big { min-height: 60px; padding: 0 1.5rem; font-size: 1.08rem; }
.btn.sm { min-height: 48px; padding: 0 0.95rem; font-size: 0.94rem; }
.btn.xs { min-height: 48px; padding: 0 0.75rem; font-size: 0.86rem; }
.btn.pulse { animation: pulse 1.3s ease-in-out infinite; }
.icon-btn {
  flex: none;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text);
  cursor: pointer;
}
.icon-btn:hover { border-color: var(--accent); }
.ic { flex: none; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.actions.wrap { gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.row.slim { margin: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 48px;
  padding: 0 1rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text);
  font: 600 0.95rem var(--font-ui);
  cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip b { font-family: var(--font-display); font-size: 1.1rem; margin-right: 2px; }

.stepper { display: inline-flex; align-items: stretch; align-self: flex-start; border: 1px solid var(--line); border-radius: 13px; overflow: hidden; background: var(--surface-2); }
.st-btn { width: 52px; min-height: 52px; border: 0; background: none; color: var(--text); cursor: pointer; display: grid; place-items: center; }
.st-btn:hover { background: var(--surface-3); }
.st-val { min-width: 4.4ch; display: flex; align-items: center; justify-content: center; gap: 2px; padding: 0 0.5rem; border-inline: 1px solid var(--line); font-weight: 700; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.st-val small { font-size: 0.8rem; font-weight: 600; color: var(--text-2); }
.stepper.big .st-btn { width: 60px; min-height: 60px; }
.stepper.big .st-val { font-size: 1.6rem; min-width: 3.4ch; }

.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.form { display: flex; flex-direction: column; gap: 18px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; }
.input {
  width: 100%;
  min-height: 52px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text);
}
textarea.input { min-height: 96px; resize: vertical; line-height: 1.45; }
select.input { padding-right: 10px; }
.code { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: 0.84rem/1.45 var(--font-mono); resize: vertical; margin-top: 10px; }
.range { width: 100%; min-height: 48px; accent-color: var(--accent); }
.switch { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw-track { position: relative; flex: none; width: 52px; height: 30px; border-radius: 999px; background: var(--surface-3); transition: background-color 0.2s; }
.sw-track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--text); transition: left 0.2s, background-color 0.2s; }
.switch input:checked + .sw-track { background: var(--accent); }
.switch input:checked + .sw-track::after { left: 25px; background: var(--on-accent); }
.switch input:focus-visible + .sw-track { outline: 3px solid var(--accent); outline-offset: 2px; }

.pill { display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.03em; white-space: nowrap; }
.pill.ok { background: rgba(108, 197, 150, 0.18); color: var(--ok); }
.pill.accent { background: var(--accent-soft); color: var(--accent-strong); }

/* ---------- Surfaces ---------- */
.card { display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 18px 20px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.card-head .h2 { margin: 0; }
.paper { background: var(--paper); color: var(--ink); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--paper-edge), var(--shadow); }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 14px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.banner > p { flex: 1 1 280px; }
.banner.warn { border-color: var(--warn); }
.banner.accent { border-color: var(--accent); background: var(--accent-soft); }
.banner.slim { padding: 10px 14px; }
.banner-act { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.empty { display: flex; flex-direction: column; gap: 12px; padding: 22px; border: 1px dashed var(--line); border-radius: 16px; }

/* ---------- Notation ---------- */
.nt { display: block; color: var(--ink); max-width: 100%; height: auto; }
.nt path { fill: currentColor; }
.nt .sl, .nt .ll, .nt .stem, .nt .bl { fill: none; stroke: currentColor; }
.nt .sl { stroke: var(--staff-ink); }
.nt .bar-hl { fill: var(--hl); opacity: 0; transition: opacity 0.12s; }
.nt .bar-hl.on { opacity: 1; }
.nt .n-ok, .nt .stem.n-ok { color: var(--ok-ink); }
.nt .n-near { color: var(--near-ink); }
.nt .n-off { color: var(--off-ink); }
.nt .n-bad { color: var(--bad-ink); }
.nt .n-miss { color: var(--miss-ink); opacity: 0.75; }
.nt .hm { cursor: pointer; }
.nt .vo { fill: none; stroke: currentColor; }
.nt text { fill: currentColor; font-family: var(--font-ui); font-weight: 600; }
.nt .bn { fill: var(--ink-2); font-weight: 400; }
.nt .fing, .nt .tup { color: var(--ink-2); }
.nt .grace { color: var(--ink); }
.nt .dim { fill: var(--paper); opacity: 0.6; pointer-events: none; }
.nt .n-cur { color: var(--cur-ink); }
.nt .n-done { color: var(--ok-ink); }
.nt .hm-mark { fill: var(--bad-ink); }
.tempo { display: inline-flex; align-items: center; gap: 0.2em; white-space: nowrap; vertical-align: middle; }
.tempo .tnote { display: block; }
.tempo-eq { font-variant-numeric: tabular-nums lining-nums; }
.stage { position: relative; display: grid; place-items: center; min-height: min(46vh, 440px); padding: 12px; overflow: hidden; }
.stage .nt { width: min(100%, 600px); }
.score-paper { padding: 14px 10px; overflow-x: auto; min-height: 120px; }
.score-paper .nt { width: 100%; }
.pause-veil { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(231, 223, 204, 0.88); color: var(--ink); font: 600 1.7rem var(--font-display); z-index: 2; }

/* ---------- Accueil ---------- */
.home-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.paper-card { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 26px 28px; box-shadow: inset 0 0 0 1px var(--paper-edge), var(--shadow); }
.tn-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.tn-title { font-family: var(--font-display); font-weight: 600; font-size: 2rem; margin: 0; }
.tn-sub { color: var(--ink-2); margin-top: 2px; }
.program-list { list-style: none; margin: 18px 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.program-list li { display: grid; grid-template-columns: 2.2rem auto minmax(1rem, 1fr) auto; grid-template-areas: 'n t dots m' '. d d d'; column-gap: 10px; align-items: baseline; }
.pl-n { grid-area: n; font-family: var(--font-display); font-size: 1.7rem; line-height: 1; color: var(--accent); }
.pl-t { grid-area: t; font-weight: 700; font-size: 1.08rem; }
.pl-dots { grid-area: dots; border-bottom: 2px dotted var(--line); transform: translateY(-5px); }
.pl-m { grid-area: m; font-weight: 700; font-variant-numeric: tabular-nums; }
.pl-d { grid-area: d; color: var(--text-2); font-size: 0.96rem; line-height: 1.5; }
.paper-card .pl-n { color: var(--cur-ink); }
.paper-card .pl-dots { border-color: var(--paper-edge); }
.paper-card .pl-d { color: var(--ink-2); }
.paper-card .btn.primary { background: var(--cur-ink); color: #fff; }
.paper-card .btn.primary:hover { background: #234c80; }
.paper-card .btn.secondary { background: transparent; color: var(--ink); border-color: var(--paper-edge); }
.paper-card .pill { background: rgba(28, 26, 22, 0.08); color: var(--ink-2); }
.paper-card .pill.ok { background: rgba(28, 116, 72, 0.14); color: var(--ok-ink); }
.paper-card .pill.accent { background: rgba(44, 92, 154, 0.14); color: var(--cur-ink); }
.side-tiles { display: grid; gap: 14px; }
.tile { display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); text-align: left; }
.tile .lab { display: flex; align-items: center; gap: 6px; }
.tile-big { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 600; font-size: 2.5rem; line-height: 1.1; }
.tile-big small { font-family: var(--font-ui); font-size: 1rem; font-weight: 600; color: var(--text-2); }
.tile-mid { font-size: 1.2rem; }
.tile-btn { cursor: pointer; }
.tile-btn:hover { border-color: var(--accent); }
.tile-btn.ok { border-color: rgba(108, 197, 150, 0.5); }
.tile-btn.ok .tile-mid { color: var(--ok); }
.free-strip { display: flex; flex-direction: column; gap: 12px; }
.free-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .free-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .free-grid { grid-template-columns: minmax(0, 1fr); } }
.free-tile {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-areas: 'i t' 'i d';
  column-gap: 14px;
  row-gap: 2px;
  align-items: center;
  min-height: 86px;
  padding: 16px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.free-tile:hover { border-color: var(--accent); }
.free-tile .ic { grid-area: i; color: var(--accent); }
.ft-t { grid-area: t; font-weight: 700; }
.ft-d { grid-area: d; color: var(--text-2); font-size: 0.88rem; line-height: 1.35; }
.free-grid.big .free-tile { min-height: 110px; }

/* ---------- Séance ---------- */
.session { display: flex; flex-direction: column; gap: 16px; }
.sbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.sbar.quiet .steps, .sbar.quiet .sbar-right { opacity: 0.45; pointer-events: none; }
.sbar-right { display: flex; align-items: center; gap: 10px; }
.steps { flex: 1; min-width: 0; display: flex; gap: 6px; margin: 0; padding: 0; list-style: none; overflow-x: auto; scrollbar-width: none; }
.steps li { flex: 1 1 0; min-width: 0; }
.step {
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 52px;
  padding: 0 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text-2);
  font: 600 0.95rem var(--font-ui);
  white-space: nowrap;
  overflow: hidden;
  cursor: pointer;
}
.steps.diag .step { cursor: default; }
.step.cur { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
.step-n { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font-size: 0.84rem; font-weight: 700; }
.step.done .step-n { background: var(--ok); color: var(--on-ok); }
.step.skipped { opacity: 0.6; }
.step.cur .step-n { background: var(--accent); color: var(--on-accent); }
.step-l { overflow: hidden; text-overflow: ellipsis; }
.step-m { margin-left: auto; color: var(--text-3); font-size: 0.8rem; }
.step-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
.timer { font-family: var(--font-display); font-weight: 600; font-size: 2.2rem; line-height: 1; min-width: 3.6ch; text-align: right; font-variant-numeric: tabular-nums lining-nums; }
.timer.over { color: var(--warn); }
.timer.paused { opacity: 0.45; }
@media (max-width: 1280px) { .step-m { display: none; } }
@media (max-width: 899px) {
  .sbar { flex-wrap: wrap; }
  .steps { order: 3; flex-basis: 100%; }
  .step-l { display: none; }
  .step.cur .step-l { display: inline; }
  .sbar-right { margin-left: auto; }
  .steps li:has(.step.cur) { flex-grow: 2.4; }
}
@media (max-width: 560px) {
  .hide-narrow { display: none; }
  #ss-next { width: 52px; padding: 0; }
  .sbar { gap: 8px; }
  .sbar-right { gap: 8px; }
  .timer { font-size: 1.8rem; }
}
.sbody { min-width: 0; }

/* Exercice de notes */
.drill { display: flex; flex-direction: column; gap: 14px; }
.drill-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.drill-set { color: var(--text-2); font-weight: 600; }
.feedback { min-height: 1.6em; margin: 4px 0; font-size: 1.22rem; font-weight: 700; text-align: center; text-wrap: balance; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }
.feedback.info { color: var(--accent); }
.feedback.left { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; text-align: left; font-size: 1.02rem; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.metrics.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metric { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.metric b { font-size: 1.75rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
.metric.good b, .metric.good .sub { color: var(--ok); }
.metric.alert { border-color: var(--bad); }
.metric.alert b { color: var(--bad); }
.done-card { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--ink); padding: 20px; }
.done-card .eyebrow { color: var(--cur-ink); }
.done-card .big-num small { color: var(--ink-2); }

/* Déchiffrage */
.reading { display: flex; flex-direction: column; gap: 14px; }
.never-strip { padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-display); font-style: italic; font-size: 1.3rem; text-align: center; }
.never-strip.slim { font-size: 1.1rem; padding: 6px 12px; }
.reading:has(.pr.play) > .never-strip { display: none; }
.piece-rail { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 10px; }
.piece-rail:empty { display: none; }
.pc { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.pc-n { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font-weight: 700; }
.pc-txt { display: flex; flex-direction: column; min-width: 0; }
.pc-l { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-r { color: var(--text-2); font-size: 0.85rem; }
.pc.cur { border-color: var(--accent); }
.pc.cur .pc-n { background: var(--accent); color: var(--on-accent); }
.pc.done .pc-n { background: var(--ok); color: var(--on-ok); }
.pr { display: flex; flex-direction: column; gap: 20px; }
.pr-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 20px; }
.pr-title { font-family: var(--font-display); font-weight: 600; font-size: 1.8rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.pr-tempo { display: flex; align-items: center; gap: 12px; font-size: 1.45rem; font-weight: 700; }
.analyse { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; }
.ring { position: relative; width: 210px; height: 210px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface-3); stroke-width: 8; }
.ring-fg { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.2s linear; }
.ring-txt { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-txt b { font-family: var(--font-display); font-weight: 600; font-size: 4.2rem; line-height: 1; font-variant-numeric: tabular-nums lining-nums; }
.ring-txt span { color: var(--text-2); }
.analyse-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.checklist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
.check { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font-weight: 600; text-align: left; cursor: pointer; }
.check .ic { opacity: 0.25; }
.check.on { color: var(--text); border-color: var(--ok); }
.check.on .ic { opacity: 1; color: var(--ok); }
.hint { color: var(--text-3); font-size: 0.92rem; }
.never { font-family: var(--font-display); font-style: italic; font-size: clamp(1.6rem, 3.4vw, 2.5rem); line-height: 1.15; text-align: center; text-wrap: balance; }
.beat-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.beat { width: 168px; height: 168px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-family: var(--font-display); font-weight: 600; font-size: 4.6rem; line-height: 1; font-variant-numeric: lining-nums; }
.beat.count { color: var(--accent); border-color: var(--accent); }
.beat.downbeat { border-color: var(--text); }
.beat.hit { animation: hit 0.22s ease-out; }
.beat.small { width: 76px; height: 76px; font-size: 2.1rem; }
.beat-sub { color: var(--text-2); font-weight: 600; }
.review-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 18px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px 22px; margin: 0; }
.facts div { display: flex; flex-direction: column; gap: 2px; }
.facts dd { margin: 0; font-size: 1.02rem; }
.summary { display: flex; flex-direction: column; gap: 16px; }
.verdict { display: flex; flex-direction: column; gap: 4px; padding: 18px 20px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
.verdict.up { border-color: var(--ok); }
.verdict.down { border-color: var(--warn); }
.verdict .btn { align-self: flex-start; margin-top: 8px; }
.verdict-main { display: flex; align-items: center; gap: 14px; font-family: var(--font-display); font-weight: 600; font-size: 2.5rem; line-height: 1.1; }
.delta { padding: 4px 12px; border-radius: 999px; background: var(--surface-3); font: 700 1rem var(--font-ui); }
.verdict.up .delta { background: var(--ok); color: var(--on-ok); }
.verdict.down .delta { background: var(--warn); color: var(--on-warn); }
.impro { display: flex; flex-direction: column; gap: 12px; }
.degrees { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
.degrees li { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.degrees b { font-family: var(--font-display); font-size: 1.4rem; margin-right: 6px; }
.big-clock { font-family: var(--font-display); font-weight: 600; font-size: 4.2rem; line-height: 1; font-variant-numeric: tabular-nums lining-nums; }
.big-num { font-family: var(--font-display); font-weight: 600; font-size: 2.7rem; line-height: 1; margin: 0; font-variant-numeric: lining-nums; }
.big-num small { font-family: var(--font-ui); font-size: 1rem; font-weight: 600; color: var(--text-2); }

/* Rythme, motifs, déchiffrage généré */
.rhythm, .motifs, .gen { display: flex; flex-direction: column; gap: 14px; }
.opts { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 22px; }
.opts .field { min-width: 0; }
.tap-pad { width: 100%; min-height: 128px; border-radius: 18px; border: 2px dashed var(--accent); background: var(--accent-soft); color: var(--text); font: 700 1.4rem var(--font-ui); cursor: pointer; touch-action: none; }
.tap-pad.hit { animation: hit 0.18s ease-out; }
.history:empty { display: none; }
.tries { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 0; padding: 0; list-style: none; }

/* ==========================================================================
   REPERTOIRE — pièces réelles : lecture MusicXML (.musicxml, .xml, .mxl),
   format compact pour la bibliothèque, notes attendues pour le jeu guidé.
   Logique pure (sauf DOMParser et DecompressionStream, fournis par le navigateur).
   Temps internes en noires ; format compact en ticks (480 par noire).
   ========================================================================== */
const Repertoire = (() => {
  'use strict';
  const TPQ = 480;
  const STEP_IDX = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
  const STEP_CH = 'CDEFGAB';
  const SEMI = [0, 2, 4, 5, 7, 9, 11];
  const midiOf = (step, oct, alt) => 12 * (oct + 1) + SEMI[step] + alt;
  const TYPE_Q = { maxima: 32, long: 16, breve: 8, whole: 4, half: 2, quarter: 1, eighth: 0.5, '16th': 0.25, '32nd': 0.125, '64th': 0.0625, '128th': 0.03125 };
  const EPS = 1e-6;
  const near = (a, b) => Math.abs(a - b) < 1e-4;
  const round6 = (x) => Math.round(x * 1e6) / 1e6;

  /* ---------- Petits outils DOM (compatibles xmldom pour les tests dans Node) ---------- */
  const els = (n) => (n ? [...(n.childNodes || [])].filter((c) => c.nodeType === 1) : []);
  const kids = (n, name) => els(n).filter((c) => c.nodeName === name);
  const kid = (n, name) => els(n).find((c) => c.nodeName === name) || null;
  const txt = (n, name) => {
    const k = name ? kid(n, name) : n;
    return k ? String(k.textContent || '').trim() : '';
  };
  const num = (n, name, def = null) => {
    const s = txt(n, name);
    if (s === '') return def;
    const v = parseFloat(s);
    return Number.isFinite(v) ? v : def;
  };
  const attr = (n, a) => (n && n.getAttribute ? n.getAttribute(a) : null);

  function clefCode(sign, line) {
    if (sign === 'F') return 'F';
    if (sign === 'G') return 'G';
    if (sign === 'C') return line >= 4 ? 'F' : 'G';
    return null;
  }

  /* ---------- .mxl : archive zip (méthode « stored » ou « deflate ») ---------- */
  async function inflateRaw(bytes) {
    if (typeof DecompressionStream === 'undefined') throw new Error('Ce navigateur ne sait pas ouvrir les fichiers .mxl : exporte en .musicxml non compressé.');
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  async function unzip(buf) {
    const u8 = new Uint8Array(buf);
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) {
        eocd = i;
        break;
      }
    }
    if (eocd < 0) throw new Error('Archive .mxl illisible');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const files = {};
    const dec = new TextDecoder();
    for (let k = 0; k < count; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true);
      const xlen = dv.getUint16(p + 30, true);
      const clen = dv.getUint16(p + 32, true);
      const off = dv.getUint32(p + 42, true);
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
      p += 46 + nlen + xlen + clen;
      const lnlen = dv.getUint16(off + 26, true);
      const lxlen = dv.getUint16(off + 28, true);
      const data = u8.subarray(off + 30 + lnlen + lxlen, off + 30 + lnlen + lxlen + csize);
      files[name] = { method, data };

    const read = async (f) => dec.decode(f.method === 0 ? f.data : await inflateRaw(f.data));

    if (files['META-INF/container.xml']) {
      const c = await read(files['META-INF/container.xml']);
      const m = c.match(/full-path\s*=\s*"([^"]+)"/);
      if (m && files[m[1]]) main = m[1];
    }
    if (!main) main = Object.keys(files).find((n) => !n.startsWith('META-INF') && /\.(xml|musicxml)$/i.test(n));

  /** Fichier choisi par l'utilisateur → texte MusicXML. */
  async function readFile(file) {
    const buf = await file.arrayBuffer();
    const u8 = new Uint8Array(buf);
    if (u8[0] === 0x50 && u8[1] === 0x4b) return unzip(buf);
    let text = new TextDecoder('utf-8').decode(u8);
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
    if (/^\s*<\?xml[^>]*encoding="UTF-16/i.test(text) || (u8[0] === 0xff && u8[1] === 0xfe)) text = new TextDecoder('utf-16le').decode(u8);

  /* ---------- MusicXML → pièce ---------- */
  /**
   * Retourne { title, composer, staves:[{clef}], fifths, meter, sym, tempo, bars:[…], warnings:[] }.
   * Mesure : { q (noires), meter?, sym?, fifths?, clefs:[clef au début], rs, re, vo, n, staves:[[événements]] }.
   * Événement : { t, d, dd, tup, v, rest, hidden, cl, notes:[{ step, oct, alt, midi, tie, tied, fing }] }.

    if (root.nodeName !== 'score-partwise') throw new Error('Ce fichier n’est pas une partition MusicXML.');

    const work = kid(root, 'work');
    let title = (work && txt(work, 'work-title')) || txt(root, 'movement-title') || '';
    let composer = '';
    const ident = kid(root, 'identification');
    if (ident) for (const c of kids(ident, 'creator')) if ((attr(c, 'type') || '') === 'composer') composer = txt(c);
    if (!title || !composer) {
      for (const cr of kids(root, 'credit')) {
        const type = txt(cr, 'credit-type');
        const words = kids(cr, 'credit-words').map((w) => txt(w)).join(' ').trim();
        if (!title && type === 'title') title = words;
        if (!composer && type === 'composer') composer = words;
      }
    }
    const partNames = {};
    const pl = kid(root, 'part-list');
    if (pl) for (const sp of kids(pl, 'score-part')) partNames[attr(sp, 'id')] = txt(sp, 'part-name');

    // Parties et nombre de portées de chacune
    const parts = kids(root, 'part').map((p) => {
      let staves = 1;
      for (const m of kids(p, 'measure')) {
        for (const a of kids(m, 'attributes')) {
          const s = num(a, 'staves');
          if (s) staves = s;
        }
        if (kids(m, 'attributes').length) break;
      }
      const pitched = p.getElementsByTagName('pitch').length;
      return { el: p, id: attr(p, 'id'), name: partNames[attr(p, 'id')] || '', staves, pitched };

    if (!parts.length) throw new Error('Aucune note dans ce fichier.');
    let chosen = [];
    const piano = parts.find((p) => p.staves >= 2);
    if (piano) {
      chosen = [{ part: piano, map: [0, 1] }];
      if (piano.staves > 2) warnings.push('Partie à plus de deux portées : seules les deux premières sont gardées.');
      if (parts.length > 1) warnings.push(`${parts.length - 1} autre(s) partie(s) ignorée(s) (on garde « ${piano.name || 'Piano'} »).`);
    } else if (parts.length >= 2) {
      chosen = [{ part: parts[0], map: [0] }, { part: parts[1], map: [1] }];
      if (parts.length > 2) warnings.push(`${parts.length - 2} partie(s) ignorée(s) : seules les deux premières sont gardées.`);
    } else chosen = [{ part: parts[0], map: [0] }];
    const nStaves = chosen.reduce((a, c) => a + c.map.length, 0);

    const measuresOf = chosen.map((c) => kids(c.part.el, 'measure'));
    const nBars = Math.max(...measuresOf.map((m) => m.length));
    const bars = [];
    const state = { fifths: 0, beats: 4, beatType: 4, sym: '', clef: new Array(nStaves).fill(null), tempo: null };

    for (let bi = 0; bi < nBars; bi++) {
      const bar = { staves: Array.from({ length: nStaves }, () => []), clefChanges: Array.from({ length: nStaves }, () => []), rs: false, re: false, vo: null, implicit: false, maxLen: 0, keyAt: null, timeAt: null };

        let maxPos = 0;
        let lastStart = 0;
        let lastEvent = null;
        for (const n of els(m)) {
          const nn = n.nodeName;
          if (nn === 'attributes') {
            const dv = num(n, 'divisions');

              if (bi === 0 || f !== state.fifths) bar.keyAt = f;
              state.fifths = f;
            }
            const time = kid(n, 'time');
            if (time && kid(time, 'beats') && pi === 0) {
              const beats = parseInt(txt(time, 'beats').split('+').reduce((a, x) => a + (parseInt(x, 10) || 0), 0), 10) || 4;
              const bt = num(time, 'beat-type', 4) | 0;

              if (bi === 0 || beats !== state.beats || bt !== state.beatType) bar.timeAt = { beats, bt, sym: sym === 'common' || sym === 'cut' ? sym : '' };

              state.beatType = bt;

          } else if (nn === 'backup') {
            pos -= num(n, 'duration', 0);
            if (pos < 0) pos = 0;
          } else if (nn === 'forward') {
            pos += num(n, 'duration', 0);
            maxPos = Math.max(maxPos, pos);
          } else if (nn === 'direction' || nn === 'sound') {

    const oct = baseOct + Math.floor(idx / 7);

  /* ---------- Pièces générées ---------- */
  const PATTERNS = {

      2: [[0.5, 0.5, 1, 1, 1], [1, 0.5, 0.5, 1, 1], [1.5, 0.5, 1, 1], [1, 1, 1.5, 0.5], [0.5, 0.5, 0.5, 0.5, 2], [1, 1, 0.5, 0.5, 1]],
      3: [[0.5, 1, 0.5, 1, 1], [1.5, 0.5, 1.5, 0.5], [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 1], [1, 0.5, 0.5, 0.5, 0.5, 1]],
    },
    '3/4': {
      1: [[1, 1, 1], [2, 1], [1, 2]],
      2: [[0.5, 0.5, 1, 1], [1, 0.5, 0.5, 1], [1.5, 0.5, 1], [1, 1, 0.5, 0.5]],
      3: [[0.5, 0.5, 0.5, 0.5, 1], [1, 1.5, 0.5], [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]],
    },
    '2/4': {
      1: [[1, 1], [2]],
      2: [[0.5, 0.5, 1], [1, 0.5, 0.5], [1.5, 0.5]],
      3: [[0.5, 0.5, 0.5, 0.5], [0.5, 1, 0.5]],
    },
    '6/8': {
      1: [[1.5, 1.5], [1, 0.5, 1.5]],
      2: [[1, 0.5, 1, 0.5], [1.5, 1, 0.5], [0.5, 0.5, 0.5, 1.5]],
      3: [[0.5, 0.5, 0.5, 0.5, 0.5, 0.5], [1.5, 0.5, 0.5, 0.5], [1, 0.5, 0.5, 0.5, 0.5]],
    },

  /** Cellules à doubles croches : réservées aux exercices de rythme de la phase 3. */
  const RHYTHM_EXTRA = {
    '4/4': [[0.25, 0.25, 0.5, 1, 1, 1], [0.75, 0.25, 1, 2]],
    '3/4': [[0.25, 0.25, 0.5, 1, 1]],
    '2/4': [[0.25, 0.25, 0.25, 0.25, 1], [0.75, 0.25, 1]],
    '6/8': [[0.75, 0.25, 0.5, 1.5]],

  function patternsFor(meter, level) {
    const t = PATTERNS[meter] || PATTERNS['4/4'];

    for (let l = 1; l <= clamp(level, 1, 3); l++) out = out.concat(t[l] || []);
    return out;
  }
  const LEVEL_KEYS = { 1: ['C', 'G', 'F'], 2: ['C', 'G', 'F', 'D', 'Bb'], 3: ['C', 'G', 'F', 'D', 'Bb', 'A', 'Eb'] };

    4: [['I', 'IV', 'V', 'I'], ['I', 'V', 'V', 'I'], ['I', 'I', 'V', 'I'], ['I', 'vi', 'V', 'I']],
    6: [['I', 'IV', 'I', 'V', 'V', 'I'], ['I', 'vi', 'IV', 'V', 'V', 'I']],
    8: [['I', 'IV', 'V', 'I', 'I', 'IV', 'V', 'I'], ['I', 'vi', 'IV', 'V', 'I', 'IV', 'V', 'I'], ['I', 'V', 'I', 'IV', 'I', 'IV', 'V', 'I']],

  function genMelody(rng, { key, meter, bars, level, prog }) {
    const mi = meterInfo(meter);
    const range = level === 1 ? [0, 4] : level === 2 ? [-1, 7] : [-3, 9];
    const maxLeap = level === 1 ? 2 : level === 2 ? 4 : 5;
    const inRange = (d) => d >= range[0] && d <= range[1];
    let prev = choice(rng, [0, 2, 4].filter(inRange));
    const events = [];
    for (let b = 0; b < bars; b++) {
      const root = CHORD_ROOT[prog[b]];
      const tones = [root, root + 2, root + 4].map(mod7);
      const last = b === bars - 1;
      const pat = last ? [mi.barQ] : choice(rng, patternsFor(meter, level));
      let t = 0;
      pat.forEach((d, k) => {

        const all = [];

        if (last) {
          deg = [0, 7, -7].filter(inRange).sort((a, c) => Math.abs(a - prev) - Math.abs(c - prev))[0];
        } else if (b === bars - 2 && k === pat.length - 1) {
          const lead = all.filter((x) => [4, 6, 1].includes(mod7(x)) && Math.abs(x - prev) <= maxLeap);
          deg = lead.length ? choice(rng, lead) : prev;
        } else if (isStrong(t, mi) || k === 0) {
          let c = all.filter((x) => tones.includes(mod7(x)) && Math.abs(x - prev) <= maxLeap && x !== prev);

          const w = c.map((x) => 1 / (1 + Math.abs(x - prev)));
          deg = c[weightedIndex(w, rng)];
        } else {
          const steps = level === 1 ? [-1, 1] : [-1, 1, -1, 1, -2, 2];
          const c = steps.map((s) => prev + s).filter(inRange);
          deg = c.length ? choice(rng, c) : prev;
        }
        events.push({ bar: b, t, d, deg });
        prev = deg;
        t += d;
      });
    }
    return events;
  }

  function lhVoicing(key, rootDeg) {
    let base = 3;
    let r = degreeNote(key, rootDeg, base);
    while (r.midi > 55) r = degreeNote(key, rootDeg, --base);
    while (r.midi < 41) r = degreeNote(key, rootDeg, ++base);
    return { root: r, third: degreeNote(key, rootDeg + 2, base), fifth: degreeNote(key, rootDeg + 4, base) };
  }

  function genBass(rng, { key, meter, bars, level, prog }) {
    const mi = meterInfo(meter);
    const style = level === 1 ? choice(rng, ['whole', 'halves']) : level === 2 ? choice(rng, ['dyads', 'broken']) : 'alberti';
    const ev = [];
    const push = (bar, t, d, notes) => ev.push({ bar, t, d, notes });
    for (let b = 0; b < bars; b++) {
      const v = lhVoicing(key, CHORD_ROOT[prog[b]]);
      const { root: R, third: T, fifth: F } = v;
      if (b === bars - 1) {
        push(b, 0, mi.barQ, level >= 2 ? [R, F] : [R]);
        continue;
      }
      if (style === 'whole') push(b, 0, mi.barQ, [R]);
      else if (style === 'halves') {
        if (mi.meter === '4/4') {
          push(b, 0, 2, [R]);
          push(b, 2, 2, [F]);
        } else push(b, 0, mi.barQ, [R]);
      } else if (style === 'dyads') {
        if (mi.meter === '4/4') {
          push(b, 0, 2, [R, F]);
          push(b, 2, 2, [R, F]);
        } else if (mi.meter === '3/4') {
          push(b, 0, 1, [R]);
          push(b, 1, 1, [T, F]);
          push(b, 2, 1, [T, F]);
        } else if (mi.meter === '2/4') {
          push(b, 0, 1, [R]);
          push(b, 1, 1, [T, F]);
        } else {
          push(b, 0, 1.5, [R]);
          push(b, 1.5, 1.5, [T, F]);
        }
      } else if (style === 'broken') {
        const seq = mi.meter === '4/4' ? [[R, 1], [F, 1], [T, 1], [F, 1]] : mi.meter === '3/4' ? [[R, 1], [F, 1], [T, 1]] : mi.meter === '2/4' ? [[R, 1], [F, 1]] : [[R, 1], [F, 0.5], [T, 1], [F, 0.5]];
        let t = 0;
        for (const [n, d] of seq) {
          push(b, t, d, [n]);
          t += d;
        }
      } else {
        const order = [R, F, T, F, T, F, R, F];
        const count = Math.round(mi.barQ / 0.5);
        const alberti = mi.meter === '4/4' ? [R, F, T, F, R, F, T, F] : order.slice(0, count);

  }

  /**

  function generatePiece({ level = 1, key = null, meter = null, bars = 4, seed = Date.now() } = {}) {
    const rng = rngFrom(seed);
    level = clamp(level | 0, 1, 3);
    key = key && KEY_FIFTHS[key] != null ? key : choice(rng, LEVEL_KEYS[level]);
    meter = meter && PATTERNS[meter] ? meter : choice(rng, LEVEL_METERS[level]);
    bars = [4, 6, 8].includes(bars) ? bars : 4;
    const prog = choice(rng, PROGS[bars]);

    const rh = mel.map((e) => ({ bar: e.bar, t: e.t, d: e.d, notes: [degreeNote(key, e.deg, 4)], deg: e.deg }));
    if (level === 3) {
      for (let i = 0; i + 1 < rh.length; i++) {
        const a = rh[i];

        if (a.bar !== b.bar || isStrong(a.t, meterInfo(meter)) || b.deg !== a.deg + 1) continue;
        const n = a.notes[0];
        if (b.notes[0].midi - n.midi === 2 && n.alt < 1 && rng() < 0.35) {

  /** Notes attendues (en noires depuis le début), triées. */
  function expectedFromPiece(piece) {

      list.forEach((e, ei) => {

        e.notes.forEach((n, ni) => out.push({ midi: n.midi, q: e.bar * mi.barQ + e.t, hand, ei, ni }));
      });

  }
  /** Justesse et placement de chaque note jouée, comparés à la pièce générée. */
  function evaluatePiece(piece, played, { t0, quarterMs, latencyMs = 0 }) {
    const mi = meterInfo(piece.meter);
    const exp = expectedFromPiece(piece).map((e) => ({ ...e, ms: t0 + e.q * quarterMs }));
    const okTol = Math.max(50, 0.08 * quarterMs);
    const nearTol = Math.max(110, 0.18 * quarterMs);
    const win = Math.max(180, 0.45 * quarterMs);
    const pl = played.map((p) => ({ midi: p.midi, t: p.t - latencyMs, used: false }));
    const notes = exp.map((e) => {
      let best = null;
      let bd = Infinity;
      for (const p of pl) {
        if (p.used || p.midi !== e.midi) continue;
        const d = Math.abs(p.t - e.ms);
        if (d <= win && d < bd) {
          best = p;
          bd = d;
        }
      }
      if (!best) return { ...e, state: 'missed', dev: null };
      best.used = true;
      const dev = Math.round(best.t - e.ms);
      return { ...e, dev, state: Math.abs(dev) <= okTol ? 'ok' : Math.abs(dev) <= nearTol ? 'near' : 'off' };

    const ok = notes.filter((n) => n.state === 'ok').length;

    return {
      notes,
      extra: extraNotes.length,
      missed: notes.length - matched.length,
      total: notes.length,
      pitchPct: notes.length ? Math.round((100 * matched.length) / notes.length) : 0,
      rhythmPct: matched.length ? Math.round((100 * (ok + 0.5 * near)) / matched.length) : 0,

  /** Cellule rythmique (1 à 2 mesures), avec silences à partir de la phase 2. */
  function genRhythmCell({ meter = '4/4', level = 1, bars = 2, seed = Date.now() } = {}) {
    const rng = rngFrom(seed);
    meter = PATTERNS[meter] ? meter : '4/4';
    let pats = patternsFor(meter, level);
    if (level >= 3) pats = pats.concat(RHYTHM_EXTRA[meter] || []);
    let events = [];
    for (let attempt = 0; attempt < 30; attempt++) {
      events = [];
      for (let b = 0; b < bars; b++) {
        const pat = choice(rng, pats);
        let t = 0;
        for (const d of pat) {

          t += d;
        }

  function rhythmExpected(cell) {

  /* ---------- Intervalles et accords ---------- */
  const INTERVAL_NAMES = { 2: 'seconde', 3: 'tierce', 4: 'quarte', 5: 'quinte', 6: 'sixte', 7: 'septième', 8: 'octave' };
  function intervalName(a, b) {
    const lo = diatonic(a) <= diatonic(b) ? a : b;
    const hi = lo === a ? b : a;
    const size = diatonic(hi) - diatonic(lo) + 1;
    const semi = spelledToMidi(hi) - spelledToMidi(lo);
    const base = { 2: 2, 3: 4, 4: 5, 5: 7, 6: 9, 7: 11, 8: 12 }[size];
    const perfect = [4, 5, 8].includes(size);
    let q = '';
    if (perfect) q = semi === base ? 'juste' : semi > base ? 'augmentée' : 'diminuée';
    else q = semi === base ? 'majeure' : semi === base - 1 ? 'mineure' : semi > base ? 'augmentée' : 'diminuée';
    if (size === 8 && semi === 12) return 'octave';
    return `${INTERVAL_NAMES[size] || size + 'te'} ${q}`;

  function triadName(notes, inv) {
    const s = [...notes].sort((x, y) => diatonic(x) - diatonic(y));
    const root = inv === 0 ? s[0] : inv === 1 ? s[2] : s[1];
    const third = inv === 0 ? s[1] : inv === 1 ? s[0] : s[2];
    const fifth = inv === 0 ? s[2] : inv === 1 ? s[1] : s[0];
    const m3 = (((spelledToMidi(third) - spelledToMidi(root)) % 12) + 12) % 12;
    const m5 = (((spelledToMidi(fifth) - spelledToMidi(root)) % 12) + 12) % 12;
    const qual = m3 === 4 && m5 === 7 ? 'majeur' : m3 === 3 && m5 === 7 ? 'mineur' : m3 === 3 && m5 === 6 ? 'diminué' : m3 === 4 && m5 === 8 ? 'augmenté' : '';

    return `${noteLabel(root, { withOct: false })} ${qual} · ${state}`;

  /** Motif à reconnaître d'un coup d'œil : intervalle harmonique ou accord de trois sons. */
  function genMotif(rng, { clef = 'treble', phase = 1, kind = 'mix' } = {}) {
    const [lo, hi] = rangeForLedger(1);
    const k = kind === 'mix' ? (rng() < 0.55 ? 'interval' : 'triad') : kind;
    if (k === 'interval') {
      const sizes = phase <= 1 ? [1, 2, 3, 4, 7] : [1, 2, 3, 4, 5, 6, 7];
      const s = choice(rng, sizes);
      const p0 = randInt(rng, lo, hi - s);
      const a = fromStaffPos(clef, p0);
      const b = fromStaffPos(clef, p0 + s);
      const notes = [a, b].map((n) => ({ ...n, midi: spelledToMidi(n) }));
      return { clef, kind: 'interval', notes, label: intervalName(a, b) };
    }
    const inv = phase <= 1 ? 0 : randInt(rng, 0, 2);
    const shape = [[0, 2, 4], [0, 2, 5], [0, 3, 5]][inv];
    const p0 = randInt(rng, lo, hi - shape[2]);
    const notes = shape.map((o) => fromStaffPos(clef, p0 + o)).map((n) => ({ ...n, midi: spelledToMidi(n) }));
    return { clef, kind: 'triad', inv, notes, label: 'Accord de ' + triadName(notes, inv) };

  /* ---------- Détection de hauteur (micro) ---------- */
  /** YIN (de Cheveigné & Kawahara, 2002) : différence cumulée normalisée + interpolation parabolique. */
  function yin(buf, sampleRate, { threshold = 0.15, minFreq = 50, maxFreq = 2100, maxWindow = 2048 } = {}) {
    const maxTau = Math.min(Math.floor(sampleRate / minFreq), Math.floor(buf.length / 2));
    const minTau = Math.max(2, Math.floor(sampleRate / maxFreq));
    const W = Math.min(buf.length - maxTau, maxWindow);
    if (W < 64 || maxTau <= minTau) return null;
    const d = new Float64Array(maxTau + 2);
    for (let tau = 1; tau <= maxTau + 1 && tau + W <= buf.length; tau++) {
      let s = 0;
      for (let i = 0; i < W; i++) {
        const x = buf[i] - buf[i + tau];
        s += x * x;
      }
      d[tau] = s;
    }
    const c = new Float64Array(maxTau + 2);
    c[0] = 1;
    let run = 0;
    for (let tau = 1; tau <= maxTau + 1; tau++) {
      run += d[tau];
      c[tau] = run > 0 ? (d[tau] * tau) / run : 1;
    }
    let tau = -1;
    for (let t = minTau; t <= maxTau; t++) {
      if (c[t] < threshold) {
        while (t + 1 <= maxTau && c[t + 1] < c[t]) t++;
        tau = t;
        break;
      }
    }
    if (tau < 0) return null;
    let better = tau;
    if (tau > 1 && tau <= maxTau) {
      const s0 = c[tau - 1];
      const s1 = c[tau];
      const s2 = c[tau + 1];
      const den = 2 * (2 * s1 - s2 - s0);
      if (den !== 0 && Math.abs((s2 - s0) / den) < 1) better = tau + (s2 - s0) / den;
    }
    return { freq: sampleRate / better, clarity: 1 - c[tau] };

  const freqToMidiFloat = (f, a4 = 440) => 69 + 12 * Math.log2(f / a4);

  }
  /**
   * Transforme un flux d'images (niveau + fréquence) en attaques de notes.
   * Une note est émise après `stable` images concordantes, puis le suivi est « désarmé »
   * jusqu'au silence suivant ou à une nouvelle attaque (hausse nette du niveau).
   */
  class PitchTracker {
    constructor({ gate = 0.02, stable = 3, a4 = 440, rise = 1.25 } = {}) {

      this.prev = 0;
    }
    push({ t, rms, freq }) {
      const prev = this.prev;
      this.prev = rms;
      if (rms < this.gate) {
        this.armed = true;
        this.cand = null;
        this.count = 0;
        return null;
      }
      // Nouvelle attaque : le niveau monte nettement d'une image à l'autre.
      // Un simple changement de hauteur sans attaque (résonance, harmoniques) ne réarme pas.
      if (prev > 0 && rms > prev * this.rise && rms > this.gate * 1.5) this.armed = true;
      if (!freq) return null;
      const mf = freqToMidiFloat(freq, this.a4);
      const note = Math.round(mf);
      if (Math.abs(mf - note) > 0.35) {
        this.count = 0;
        return null;
      }
      if (note === this.cand) this.count++;
      else {
        this.cand = note;
        this.count = 1;
      }
      if (this.count >= this.stable && this.armed) {
        this.armed = false;
        return { midi: note, t, cents: Math.round((mf - note) * 100) };
      }
      return null;
    }
  }
  /** Attaques à partir du seul niveau sonore (déchiffrage au micro). */
  class OnsetDetector {

      Object.assign(this, { gate, ratio, refractoryMs });
      this.prev = 0;
      this.last = -Infinity;
    }
    push(t, rms) {
      const prev = this.prev;
      this.prev = rms;
      if (rms > this.gate && rms > Math.max(prev, this.gate * 0.5) * this.ratio && t - this.last > this.refractoryMs) {
        this.last = t;
        return t;
      }
      return null;
    }
  }

  /* ---------- Programme ---------- */
  function defaultProgram() {
    const D1 = { clefMode: 'fa>sol', ledger: 0, accidentals: false, variant: 'notes' };
    const D2 = { clefMode: 'both', ledger: 2, accidentals: false, variant: 'notes' };
    const D3 = { clefMode: 'both', ledger: 2, accidentals: false, variant: 'mix' };
    const D4 = { clefMode: 'both', ledger: 3, accidentals: true, variant: 'mix' };
    const weeks = [];

        const name = ACC[n.alt] || 'accidentalNatural';
        const colW = 1.1 * S;
        const ax = x + L.minOff - 0.25 * S - gw(name) * S - L.accCol.get(n) * colW;
        s += glyph(name, ax, y, S);
      }
      for (let k = 0; k < di.dots; k++) {
        const dx = x + headW + Math.max(0, ...[...L.off.values()]) + (0.3 + 0.5 * k) * S;
        const dy = n.p % 2 === 0 ? yTop(n.p + 1) : y;
        s += glyph('augmentationDot', dx, dy, S);
      }
      out.svg += `<g class="nh ${cls}"${n.id ? ` data-id="${n.id}"` : ''}>${s}</g>`;
      out.heads.push({ id: n.id, x: hx + headW / 2, y });
    }
    if (dir !== 'none') {
      const stemW = K.stem * S;
      const yLow = yTop(pMin);
      const yHigh = yTop(pMax);
      const mid = yTop(4);
      let sx;
      let y1;
      let y2;
      if (dir === 'up') {
        sx = x + headW - stemW / 2;
        y1 = yLow - K.attach * S;
        y2 = tip != null ? tip : Math.min(yHigh - (K.stemLen + (di.flags >= 3 ? 0.75 : 0)) * S, lines === 5 ? mid : yHigh - K.stemLen * S);
      } else {
        sx = x + stemW / 2;
        y1 = yHigh + K.attach * S;
        y2 = tip != null ? tip : Math.max(yLow + (K.stemLen + (di.flags >= 3 ? 0.75 : 0)) * S, lines === 5 ? mid : yLow + K.stemLen * S);
      }
      out.svg += `<path class="stem ${ev.cls || ''}" stroke-width="${f(stemW)}" d="M${f(sx)} ${f(y1)}V${f(y2)}"/>`;
      if (di.flags && !noFlag) {
        const name = (di.flags >= 3 ? 'flag32nd' : di.flags === 2 ? 'flag16th' : 'flag8th') + (dir === 'up' ? 'Up' : 'Down');
        out.svg += glyph(name, sx - stemW / 2, y2, S, ev.cls);
      }
      out.stemX = sx;
      out.tipY = y2;
    }
    out.dir = dir;
    out.pMin = pMin;
    out.pMax = pMax;
    out.headW = headW;
    return out;
  }

  /* ---------- Carte de note (exercices) : rondes sur une portée ou un grand-portée ---------- */
  function card({ staff = 'treble', notes = [], S = 20, width = null, fifths = 0, ariaLabel = '' } = {}) {
    const staves = staff === 'grand' ? ['treble', 'bass'] : [staff];
    const marginTop = 5.2 * S;
    const gap = 7.5 * S;
    const tops = staves.map((_, i) => marginTop + i * (4 * S + gap));
    const H = tops[tops.length - 1] + 4 * S + 5.2 * S;
    const W = width || 14 * S;
    const x0 = staff === 'grand' ? 1.6 * S : 0.6 * S;
    const x1 = W - 0.6 * S;
    let svg = '';
    staves.forEach((cl, i) => {
      svg += staffLines(x0, x1, tops[i], S);
      svg += clefSVG(cl, x0 + 0.7 * S, tops[i], S);
      svg += keySigSVG(cl, fifths, x0 + 0.9 * S + clefWidth(cl, S), tops[i], S).svg;
    });
    if (staff === 'grand') {
      svg += vline(x0, tops[0], tops[1] + 4 * S, K.bar * S);
      svg += braceSVG(x0 - 0.25 * S, tops[0], tops[1] + 4 * S, S);
    }
    const headW = gw('noteheadWhole') * S;
    const cx = (x0 + 0.9 * S + clefWidth('treble', S) + x1) / 2 + 0.6 * S - headW / 2;
    staves.forEach((cl, i) => {
      const own = notes.filter((n) => (n.clef || staves[0]) === cl);
      if (!own.length) return;
      const ev = { d: 4, notes: own.map((n) => ({ ...n, showAcc: n.alt !== 0 && n.alt != null })) };
      svg += drawEvent(ev, { x: cx, top: tops[i], S, clef: cl }).svg;
    });
    return `<svg class="nt" viewBox="0 0 ${f(W)} ${f(H)}" width="${f(W)}" height="${f(H)}" role="img" aria-label="${ariaLabel}">${svg}</svg>`;
  }

  /* ---------- Carte de chaleur : une ronde par position, colorée ---------- */
  function heatStaff({ clef = 'treble', cells = [], S = 11, octaves = 'fr' } = {}) {
    const top = 4.6 * S;
    const step = 2.25 * S;
    const x0 = 0.4 * S;
    const startX = x0 + clefWidth(clef, S) + 1.6 * S;
    const W = startX + cells.length * step + 0.6 * S;
    const H = top + 4 * S + 4.8 * S;
    let svg = staffLines(x0, W - 0.3 * S, top, S) + clefSVG(clef, x0 + 0.4 * S, top, S);
    const headW = gw('noteheadWhole') * S;
    cells.forEach((c, i) => {
      const x = startX + i * step;
      const p = posOf(clef, c);
      svg += ledgerLines(x - K.ledgerExt * S, x + headW + K.ledgerExt * S, top, S, p, p);
      svg += `<g class="hm" data-key="${c.key}" style="color:${c.color}">${glyph('noteheadWhole', x, yOf(top, S, p), S)}</g>`;
      if (c.mark) svg += `<circle class="hm-mark" cx="${f(x + headW / 2)}" cy="${f(H - 1.2 * S)}" r="${f(0.32 * S)}"/>`;
    });
    return `<svg class="nt heat" viewBox="0 0 ${f(W)} ${f(H)}" width="${f(W)}" height="${f(H)}" role="img" aria-label="Notes difficiles en clé de ${clef === 'treble' ? 'sol' : 'fa'}">${svg}</svg>`;
  }

  /* ---------- Partition : pièce générée (grand-portée) ou cellule rythmique ---------- */
  /**
   * opts.staves : [{clef}] ; opts.bars : [{ staves: [[événements], …] }]
   * événement : { t, d, rest, notes:[{step,oct,alt,id,cls}], cls }
   */
  function score(opts) {
    const S = opts.S || 12;
    const width = opts.width || 900;
    const fifths = opts.fifths || 0;
    const meter = opts.meter || '4/4';
    const [num, den] = meter.split('/').map(Number);
    const compound = den === 8 && num % 3 === 0;
    const barQ = (num * 4) / den;
    const beatUnit = compound ? 1.5 : 1;
    const staves = opts.staves;
    const lines = staves.map((s) => (s.clef === 'perc' ? 1 : 5));
    const grand = staves.length > 1;

    // 1. Colonnes de chaque mesure et largeur naturelle
    const keyAlts = (step) => {
      const SH = [3, 0, 4, 1, 5, 2, 6];
      const FL = [6, 2, 5, 1, 4, 0, 3];
      if (fifths > 0) return SH.slice(0, fifths).includes(step) ? 1 : 0;
      if (fifths < 0) return FL.slice(0, -fifths).includes(step) ? -1 : 0;
      return 0;
    };
    const barData = opts.bars.map((bar) => {
      // altérations accidentelles : état par mesure
      bar.staves.forEach((evs) => {
        const state = {};
        [...evs].sort((a, b) => a.t - b.t).forEach((ev) => {
          if (ev.rest) return;
          ev.notes.forEach((n) => {
            const k = n.step + ':' + n.oct;
            const cur = k in state ? state[k] : keyAlts(n.step);
            n.showAcc = (n.alt || 0) !== cur;
            state[k] = n.alt || 0;
          });
        });
      });
      const times = [...new Set(bar.staves.flat().map((e) => Math.round(e.t * 1000) / 1000))].sort((a, b) => a - b);
      const cols = times.map((t, i) => {
        const evs = bar.staves.flat().filter((e) => Math.abs(e.t - t) < 1e-6);
        const next = i + 1 < times.length ? times[i + 1] : barQ;
        const dur = next - t;
        let left = 0;
        let right = 0;
        let head = 1.18;
        for (const e of evs) {
          const di = durInfo(e.d);
          if (!e.rest) {
            head = Math.max(head, gw(di.head));
            const accN = e.notes.filter((n) => n.showAcc).length;
            if (accN) left = Math.max(left, 0.35 + Math.min(accN, 2) * 1.1);
            if (di.dots) right = Math.max(right, 0.8);
            if (di.flags) right = Math.max(right, 0.9);
            const ps = e.notes.map((n) => n.step + n.oct * 7);
            for (let a = 0; a < ps.length; a++) for (let b = 0; b < ps.length; b++) if (ps[a] - ps[b] === 1) right = Math.max(right, 1.2);
          } else head = Math.max(head, 1.1);
        }
        const space = 1.0 + 2.6 * Math.sqrt(Math.max(dur, 0.125));
        return { t, left: left * S, right: right * S, head: head * S, space: space * S };
      });
      const off = [];
      let x = cols.length ? cols[0].left + 0.9 * S : 0;
      cols.forEach((c, i) => {
        off.push(x);
        const n = cols[i + 1];
        const minGap = c.head + c.right + (n ? n.left : 0) + 0.35 * S;
        x += Math.max(c.space, minGap);
      });
      return { cols, off, natural: x + 0.5 * S };
    });

    // 2. Répartition en systèmes
    const headerW = (first) => {
      let w = 0.6 * S + Math.max(...staves.map((s) => clefWidth(s.clef, S)));
      if (staves.some((s) => s.clef !== 'perc')) w += 0.6 * S;
      if (fifths) w += Math.abs(fifths) * (gw(fifths > 0 ? 'accidentalSharp' : 'accidentalFlat') + 0.12) * S + 0.6 * S;
      if (first && opts.timeSig !== false) w += 2.2 * S + (num >= 10 ? 1.6 * S : 0) + 0.4 * S;
      return w + 0.4 * S;
    };
    const left = grand ? 1.6 * S : 0.4 * S;
    const avail = width - left - 0.5 * S;
    // Systèmes équilibrés : le plus petit nombre de lignes où chaque ligne tient,
    // avec des mesures réparties le plus également possible (jamais une mesure isolée).
    let systems = null;
    const nat = barData.map((b) => b.natural);
    for (let k = 1; k <= nat.length && !systems; k++) {
      const base = Math.floor(nat.length / k);
      const extra = nat.length % k;
      const sys = [];
      let idx = 0;
      let ok = true;
      for (let i = 0; i < k; i++) {
        const size = base + (i < extra ? 1 : 0);
        if (opts.barsPerSystem && size > opts.barsPerSystem) ok = false;
        let w = headerW(i === 0);
        const ids = [];
        for (let j = 0; j < size; j++) {
          ids.push(idx);
          w += nat[idx++] * 0.85;
        }
        if (w > avail && size > 1) ok = false;
        sys.push(ids);
      }
      if (ok) systems = sys;
    }
    if (!systems) systems = nat.map((_, i) => [i]);

    // 3. Géométrie verticale
    const staffGap = 7.5 * S;
    const above = opts.above != null ? opts.above * S : 4.2 * S;
    const below = opts.below != null ? opts.below * S : 4.2 * S;
    const stavesH = staves.reduce((h, s, i) => h + 4 * S + (i ? staffGap : 0), 0);
    const sysH = above + stavesH + below;
    const sysGap = opts.systemGap != null ? opts.systemGap * S : 1.5 * S;

    let svg = '';
    const barBoxes = [];
    const heads = {};
    systems.forEach((sysBars, si) => {
      const y0 = si * (sysH + sysGap) + above;
      const tops = staves.map((s, i) => y0 + i * (4 * S + staffGap));
      const x0 = left;
      const x1 = width - 0.5 * S;
      const hw = headerW(si === 0);
      const natural = sysBars.reduce((a, i) => a + barData[i].natural, 0);
      const isLast = si === systems.length - 1;
      let factor = (x1 - x0 - hw) / natural;
      if (isLast && systems.length > 1 && factor > 1.35 && !opts.justifyLast) factor = 1;
      factor = Math.max(factor, 0.7);
      const sysTop = tops[0] - (lines[0] === 1 ? -2 * S : 0);
      const sysBot = tops[tops.length - 1] + (lines[lines.length - 1] === 1 ? 2 * S : 4 * S);
      // rectangles de surlignage (derrière tout le reste)
      let bx = x0 + hw;
      let hl = '';
      sysBars.forEach((bi) => {
        const w = barData[bi].natural * factor;
        hl += `<rect class="bar-hl" data-bar="${bi}" x="${f(bx)}" y="${f(sysTop - 2.2 * S)}" width="${f(w)}" height="${f(sysBot - sysTop + 4.4 * S)}" rx="${f(0.6 * S)}"/>`;
        barBoxes[bi] = { x: bx, w, y: sysTop - 2.2 * S, h: sysBot - sysTop + 4.4 * S, system: si };
        bx += w;
      });
      svg += hl;
      const sysRight = bx;
      staves.forEach((s, i) => {
        svg += staffLines(x0, sysRight, tops[i], S, lines[i]);
        let hx = x0 + 0.6 * S;
        svg += clefSVG(s.clef, hx, tops[i], S);
        hx += clefWidth(s.clef, S) + (s.clef !== 'perc' ? 0.6 * S : 0);
        const ks = keySigSVG(s.clef, fifths, hx, tops[i], S);
        svg += ks.svg;
        if (fifths) hx += ks.w + 0.6 * S;
        if (si === 0 && opts.timeSig !== false) svg += timeSigSVG(meter, hx + 0.1 * S, tops[i], S, lines[i]).svg;
      });
      if (grand) {
        svg += vline(x0, tops[0], tops[1] + 4 * S, K.bar * S);
        svg += braceSVG(x0 - 0.25 * S, tops[0], tops[1] + 4 * S, S);
      } else if (lines[0] === 5) svg += vline(x0, tops[0], tops[0] + 4 * S, K.bar * S);

      // mesures
      let mx = x0 + hw;
      sysBars.forEach((bi, k) => {
        const bd = barData[bi];
        const bar = opts.bars[bi];
        const w = bd.natural * factor;
        const xs = bd.off.map((o) => mx + o * factor);
        const colX = (t) => {
          const idx = bd.cols.findIndex((c) => Math.abs(c.t - t) < 1e-6);
          return idx >= 0 ? xs[idx] : mx;
        };
        bar.staves.forEach((evs, sti) => {
          const clef = staves[sti].clef;
          const top = tops[sti];
          const L = lines[sti];
          const sorted = [...evs].sort((a, b) => a.t - b.t);
          // groupes de ligature (même temps, crochets, pas de silence)
          const groups = [];
          let g = [];
          const flush = () => {
            if (g.length >= 2) groups.push(g);
            g = [];
          };
          for (const e of sorted) {
            const di = durInfo(e.d);
            const beat = Math.floor((e.t + 1e-6) / beatUnit);
            const endBeat = Math.floor((e.t + e.d - 1e-6) / beatUnit);
            if (!e.rest && di.flags && beat === endBeat) {
              if (g.length && Math.floor((g[0].t + 1e-6) / beatUnit) !== beat) flush();
              g.push(e);
            } else flush();
          }
          flush();
          const inGroup = new Set(groups.flat());
          for (const e of sorted) {
            if (inGroup.has(e)) continue;
            const wholeRest = e.rest && Math.abs(e.d - barQ) < 1e-6;
            const r = drawEvent(e, { x: colX(e.t), top, S, clef, lines: L, stemDir: L === 1 ? 'up' : null, centerRest: wholeRest ? mx + w / 2 : null });
            svg += r.svg;
            r.heads.forEach((h) => h.id && (heads[h.id] = h));
          }
          for (const grp of groups) {
            const info = grp.map((e) => {
              const ps = e.notes.map((n) => (clef === 'perc' ? 4 : posOf(clef, n)));
              return { e, pMin: Math.min(...ps), pMax: Math.max(...ps) };
            });
            let dir = 'up';
            if (L === 5) {
              const hi = Math.max(...info.map((i) => i.pMax));
              const lo = Math.min(...info.map((i) => i.pMin));
              dir = hi - 4 > 4 - lo ? 'down' : 4 - lo > hi - 4 ? 'up' : 'down';
            }
            const yp = (p) => (L === 1 ? top + 2 * S - ((p - 4) * S) / 2 : yOf(top, S, p));
            const stemW = K.stem * S;
            const pts = info.map((i) => {
              const di = durInfo(i.e.d);
              const hw2 = gw(di.head) * S;
              const x = colX(i.e.t);
              const sx = dir === 'up' ? x + hw2 - stemW / 2 : x + stemW / 2;
              const ideal = dir === 'up' ? yp(i.pMax) - K.stemLen * S : yp(i.pMin) + K.stemLen * S;
              return { ...i, sx, ideal, flags: di.flags };
            });
            const a = pts[0];
            const b = pts[pts.length - 1];
            let m = b.sx > a.sx ? (b.ideal - a.ideal) / (b.sx - a.sx) : 0;
            m = Math.max(-0.12, Math.min(0.12, m));
            const maxFlags = Math.max(...pts.map((p) => p.flags));
            const minLen = (maxFlags > 1 ? 3.25 : 3.0) * S;
            let c = a.ideal;
            const Y = (x) => c + m * (x - a.sx);
            let shift = 0;
            for (const p of pts) {
              if (dir === 'up') shift = Math.max(shift, Y(p.sx) - (yp(p.pMax) - minLen));
              else shift = Math.max(shift, yp(p.pMin) + minLen - Y(p.sx));
            }
            c += dir === 'up' ? -shift : shift;
            for (const p of pts) {
              const r = drawEvent(p.e, { x: colX(p.e.t), top, S, clef, lines: L, stemDir: dir, tip: Y(p.sx), noFlag: true });
              svg += r.svg;
              r.heads.forEach((h) => h.id && (heads[h.id] = h));
            }
            const bw = K.beam * S;
            const quad = (xa, xb, off) => {
              const ya = Y(xa) + off;
              const yb = Y(xb) + off;
              return dir === 'up'
                ? `M${f(xa)} ${f(ya)}L${f(xb)} ${f(yb)}L${f(xb)} ${f(yb + bw)}L${f(xa)} ${f(ya + bw)}Z`
                : `M${f(xa)} ${f(ya - bw)}L${f(xb)} ${f(yb - bw)}L${f(xb)} ${f(yb)}L${f(xa)} ${f(ya)}Z`;
            };
            let d = quad(a.sx - stemW / 2, b.sx + stemW / 2, 0);
            const o2 = (dir === 'up' ? 1 : -1) * (K.beam + K.beamGap) * S;
            pts.forEach((p, i) => {
              if (p.flags < 2) return;
              const n = pts[i + 1];
              const pr = pts[i - 1];
              if (n && n.flags >= 2) d += quad(p.sx - stemW / 2, n.sx + stemW / 2, o2);
              else if (!(pr && pr.flags >= 2)) {
                const hook = 1.1 * S;
                d += pr ? quad(p.sx - hook, p.sx + stemW / 2, o2) : quad(p.sx - stemW / 2, p.sx + hook, o2);
              }
            });
            svg += `<path class="beam" d="${d}"/>`;
          }
        });
        mx += w;
        const last = bi === opts.bars.length - 1;
        const yA = L1top(tops, lines);
        const yB = Lbottom(tops, lines, S);
        if (last && opts.final !== false) {
          svg += vline(mx - 0.75 * S, yA, yB, K.bar * S);
          svg += vline(mx - 0.25 * S, yA, yB, K.thick * S);
        } else svg += vline(mx, yA, yB, K.bar * S);
        void k;
      });
    });
    const height = systems.length * (sysH + sysGap) - sysGap;
    function L1top(t, ls) {
      return ls[0] === 1 ? t[0] + 1 * S : t[0];
    }
    function Lbottom(t, ls) {
      const i = t.length - 1;
      return ls[i] === 1 ? t[i] + 3 * S : t[i] + 4 * S;
    }
    return {
      svg: `<svg class="nt score" viewBox="0 0 ${f(width)} ${f(height)}" width="${f(width)}" height="${f(height)}" role="img" aria-label="${opts.ariaLabel || 'Partition'}">${svg}</svg>`,
      width,
      height,
      bars: barBoxes,
      heads,
      systems: systems.length,
    };
  }

  /* ---------- Partition d'une pièce réelle : voix, liaisons, ornements, reprises, doigtés ---------- */
  /**
   * opts : { staves:[{clef}], bars:[mesures de Repertoire], fifths, meter, sym, S, width,
   *          noteCls(id, staff) → classe, showFingering, ariaLabel }
   * Retour : { svg, width, height, bars:[{x,w,y,h,system}], heads:{id:{x,y,system}}, systems:[{y,h}] }
   */
  function pieceScore(opts) {
    const S = opts.S || 11;
    const width = Math.max(320, opts.width || 900);
    const staves = opts.staves;
    const nSt = staves.length;
    const grand = nSt > 1;
    const bars = opts.bars;
    const noteCls = opts.noteCls || (() => '');
    const showFing = opts.showFingering !== false;
    const SHK = [3, 0, 4, 1, 5, 2, 6];
    const FLK = [6, 2, 5, 1, 4, 0, 3];
    const keyAlt = (step, fifths) => (fifths > 0 ? (SHK.slice(0, fifths).includes(step) ? 1 : 0) : fifths < 0 ? (FLK.slice(0, -fifths).includes(step) ? -1 : 0) : 0);
    const GS = 0.62; // échelle des notes d'ornement
    const fmtM = (m) => String(m).split('/').map(Number);

    // 0. Contexte de chaque mesure : armure, mesure, clé au début, clé à la fin
    let fifths = opts.fifths || 0;
    let meter = opts.meter || '4/4';
    let sym = opts.sym || '';
    const ctx = bars.map((b, bi) => {
      const keyCh = bi > 0 && b.fifths != null && b.fifths !== fifths;
      if (b.fifths != null) fifths = b.fifths;
      const meterCh = bi > 0 && !!b.meter && b.meter !== meter;
      if (b.meter) {
        meter = b.meter;
        sym = b.sym || '';
      }
      return { fifths, meter, sym, keyCh, meterCh, prevFifths: null };
    });
    const clefEnd = [];
    bars.forEach((b, bi) => {
      clefEnd[bi] = staves.map((st, si) => {
        let c = (b.clefs && b.clefs[si]) || st.clef;
        for (const e of b.staves[si] || []) if (e.cl) c = e.cl;
        return c;
      });
    });
    const clefStart = (bi, si) => (bars[bi].clefs && bars[bi].clefs[si]) || staves[si].clef;

    // 1. Altérations, colonnes et largeur naturelle de chaque mesure
    const barData = bars.map((bar, bi) => {
      const c = ctx[bi];
      bar.staves.forEach((evs, si) => {
        const state = {};
        const all = [];
        evs.forEach((e) => {
          if (e.graces) e.graces.forEach((g) => g.notes.forEach((n) => all.push({ n, t: e.t - 1e-3 })));
          if (!e.rest) e.notes.forEach((n) => all.push({ n, t: e.t }));
        });
        all.sort((a, z) => a.t - z.t);
        for (const { n } of all) {
          const k = n.step + ':' + n.oct;
          const cur = k in state ? state[k] : keyAlt(n.step, c.fifths);
          n.showAcc = n.tied && !(k in state) ? false : (n.alt || 0) !== cur;
          state[k] = n.alt || 0;
        }
      });

        const r = drawEvent(ev, { x, top, S, clef: clefOf.get(e), stemDir: forced, centerRest: wholeRest ? o.mx + o.w / 2 : null, restShift });

        });
        let dir = forced;
        if (!dir) {

          const lo = Math.min(...info.map((i) => i.pMin));
          dir = hi - 4 > 4 - lo ? 'down' : 4 - lo > hi - 4 ? 'up' : 'down';

        const stemW = K.stem * S;

        for (const p of pts) {

          register(p.e, r);

        const bw = K.beam * S;
        const quad = (xa, xb, off) => {

          pts.forEach((p, i) => {
            if (p.flags < lvl) return;
            const n = pts[i + 1];
            const pr = pts[i - 1];

        }
      }
      flushTup();
      return out;
    }
    function toDraw(e) {
      return {
        d: e.d,
        dd: e.dd,
        rest: e.rest,
        cls: e.rest ? 'rest' : '',
        notes: (e.notes || []).map((n) => ({ step: n.step, oct: n.oct, alt: n.alt, showAcc: n.showAcc, id: n.id, cls: noteCls(n.id, n) })),

      let s = '';

      const hw = gw('noteheadBlack') * hs;

      for (const g of gl) {

  function tempoNote(beatQ, S = 9) {
