  /* ---------- 5.4 Diagnostic ---------- */
  const DIAG_WEEKS = [0, 4, 8, 12];
  const DIAG_TESTS = [
    ['sol', 'Clé de sol', '20 notes, une ligne supplémentaire au plus. Temps total et erreurs.'],
    ['fa', 'Clé de fa', 'Même test en clé de fa.'],
    ['reading', 'Déchiffrage', 'Deux pièces, mains ensemble, noire = 60, première lecture, sans s’arrêter.'],
    ['topo', 'Topographie', 'Rejoue la main droite de la 2e pièce sans regarder tes mains. Compte tes coups d’œil.'],
    ['rhythm', 'Rythme', 'Joue le rythme de la 1re pièce sur une touche, noire = 60. Les arrêts sont comptés.'],
    ['motifs', 'Motifs', 'Cinq intervalles ou accords : combien en moins de 2 secondes ?'],
  ];
  function diagRows(list) {
    const cols = DIAG_WEEKS.map((w) => list.filter((d) => d.diagWeek === w).slice(-1)[0] || null);
    const v = (d, f) => (d ? f(d.tests) : '—');
    const rows = [
      ['Clé de sol', (t) => (t.sol ? `${fmtSec(t.sol.totalMs)} · ${t.sol.errors} err.` : '—')],
      ['Clé de fa', (t) => (t.fa ? `${fmtSec(t.fa.totalMs)} · ${t.fa.errors} err.` : '—')],
      ['Déchiffrage', (t) => (t.reading ? `${t.reading.reduce((a, p) => a + p.stops, 0)} arrêt(s) · ${t.reading.reduce((a, p) => a + p.wrong, 0)} f.n.` : '—')],
      ['Topographie', (t) => (t.topo ? `${t.topo.glances} coup(s) d’œil` : '—')],
      ['Rythme', (t) => (t.rhythm ? `${t.rhythm.stops} arrêt(s)` : '—')],
      ['Motifs', (t) => (t.motifs != null ? `${t.motifs} / 5` : '—')],
    ];
    return `<div class="table-wrap"><table class="tbl diag-tbl"><thead><tr><th>Test</th>${DIAG_WEEKS.map((w, i) => `<th>Sem. ${w}${cols[i] ? `<small>${frDate(cols[i].date, { day: 'numeric', month: 'short' })}</small>` : ''}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(([lab, f]) => `<tr><th scope="row">${lab}</th>${cols.map((d) => `<td>${v(d, f)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  function screenDiag(main) {
    const w = weekNow();
    const due = C.diagnosticDue(w, S.diagnostics, today(), S.program.startDate);
    const next = due != null ? due : DIAG_WEEKS.find((x) => !S.diagnostics.some((d) => d.diagWeek === x)) ?? 12;
    main.innerHTML = `<div class="page"><header class="page-head"><p class="eyebrow">Semaines 0, 4, 8 et 12</p><h1 class="display">Diagnostic</h1><p class="sub">Six tests guidés pour mesurer ta lecture, toujours dans les mêmes conditions.</p></header>
      <div class="diag-grid"><section class="card"><h2 class="h2">Prochain diagnostic</h2>
        <div class="field"><span class="lab">Semaine</span>${chipsHTML('dw', DIAG_WEEKS.map((x) => [x, 'Semaine ' + x]), next)}</div>
        <ol class="test-list">${DIAG_TESTS.map(([k, t, dsc]) => `<li><b>${t}</b><span>${dsc}</span></li>`).join('')}</ol>
        <div class="actions"><button type="button" class="btn primary big" data-act="run">${icon('gauge', 22)}<span>Commencer le diagnostic</span></button></div></section>
      <section class="card"><h2 class="h2">Résultats</h2>${S.diagnostics.length ? diagRows(S.diagnostics) : '<p class="muted">Aucun diagnostic enregistré. Le premier sert de point de départ : les suivants s’afficheront à côté pour comparaison.</p>' + diagRows([])}</section></div></div>`;
    let chosen = next;
    wireChips(main, (k, v) => (chosen = +v));
    main.addEventListener('click', (e) => {
      if (e.target.closest('[data-act="run"]')) go('diagrun', { week: chosen });
    });
  }
  function screenDiagRun(main, p) {
    const W = p.week != null ? p.week : 0;
    const cfg = S.program.diagnostics[W] || { collection: '', pieces: '' };
    const pcs = C.parsePieceList(cfg.pieces).slice(0, 2).map((num) => ({ label: C.pieceLabel(cfg.collection, num), short: /^\d+$/.test(num) ? 'n° ' + num : num, meter: '' }));
    while (pcs.length < 2) pcs.push({ label: `Pièce ${pcs.length + 1} du test`, short: `Pièce ${pcs.length + 1}`, meter: '' });
    const res = { diagWeek: W, date: today(), tests: {} };
    const skipped = new Set();
    let i = 0;
    let child = null;
    main.innerHTML = `<div class="session"><header class="sbar"><button type="button" class="icon-btn" data-act="quit" aria-label="Quitter le diagnostic">${icon('close')}</button>
      <ol class="steps diag" id="dg-steps"></ol><div class="sbar-right"><button type="button" class="icon-btn" data-act="kbd" aria-label="Clavier à l’écran">${icon('keys')}</button></div></header><div class="sbody" id="dg-body"></div></div>`;
    const body = $('#dg-body', main);
    function steps() {
      $('#dg-steps', main).innerHTML = DIAG_TESTS.map(([k, t], j) => {
        const sk = skipped.has(j);
        return `<li><span class="step ${j === i ? 'cur' : j < i ? (sk ? 'skipped' : 'done') : ''}"><span class="step-n">${j < i ? (sk ? icon('minus', 16) : icon('check', 16)) : j + 1}</span><span class="step-l">${t}</span></span></li>`;
      }).join('');
    }
    function intro(text, then) {
      body.innerHTML = `<div class="diag-intro"><p class="eyebrow">Test ${i + 1} sur 6 · diagnostic de la semaine ${W}</p><h2 class="display-sm">${DIAG_TESTS[i][1]}</h2><p class="lead">${text}</p><div class="actions"><button type="button" class="btn primary big" data-act="begin">${icon('play', 22)}<span>Commencer le test</span></button><button type="button" class="btn ghost" data-act="skiptest">Passer ce test</button></div></div>`;
      body.querySelector('[data-act="begin"]').addEventListener('click', then);
    }
    function nextTest() {
      if (child && child.destroy) child.destroy();
      child = null;
      i++;
      if (i >= DIAG_TESTS.length) return finish();
      run();
    }
    function run() {
      steps();
      const k = DIAG_TESTS[i][0];
      Kbd.hide();
      if (k === 'sol' || k === 'fa') {
        intro(`${DIAG_TESTS[i][2]} Joue chaque note dès qu’elle apparaît, sans regarder tes mains.`, () => {
          body.innerHTML = '<div id="dg-host"></div>';
          child = NoteDrill($('#dg-host', body), {
            mode: 'diag',
            count: 20,
            drill: { clefMode: k === 'sol' ? 'treble' : 'bass', ledger: 1, accidentals: false, variant: 'notes' },
            onDone: (r) => {
              res.tests[k] = { totalMs: r.totalMs, errors: r.errors, meanRt: k === 'sol' ? r.treble.meanRt : r.bass.meanRt };
              nextTest();
            },
          });
        });
      } else if (k === 'reading') {
        const done = [];
        const one = (j) => {
          if (child && child.destroy) child.destroy();
          body.innerHTML = '<div id="dg-host"></div>';
          child = PieceRunner($('#dg-host', body), {
            piece: pcs[j],
            index: j,
            total: 2,
            tempoQ: 60,
            fixedTempo: true,
            onFinish: (r) => {
              done.push({ label: pcs[j].short, stops: r.stops, wrong: r.wrong, regMs: r.regMs, meter: r.meter });
              if (j === 0) one(1);
              else {
                res.tests.reading = done;
                nextTest();
              }
            },
          });
        };
        intro(`${DIAG_TESTS[i][2]}<br><b>${esc(pcs[0].label)}</b> puis <b>${esc(pcs[1].label)}</b>.`, () => one(0));
      } else if (k === 'topo') {
        intro(DIAG_TESTS[i][2], () => {
          let g = 0;
          body.innerHTML = `<div class="topo"><p class="lead">Main droite de <b>${esc(pcs[1].label)}</b>. Touche le bouton à chaque fois que tes yeux quittent la partition.</p>
            <button type="button" class="glance-pad" data-act="g">${icon('eye', 40)}<span>Coup d’œil</span><b id="tp-n">0</b></button>
            <div class="actions"><button type="button" class="btn ghost" data-act="g-">${icon('minus', 20)}<span>Retirer un</span></button><button type="button" class="btn primary big" data-act="tdone">${icon('check', 22)}<span>Terminé</span></button></div></div>`;
          body.onclick = (e) => {
            const a = e.target.closest('[data-act]');
            if (!a) return;
            if (a.dataset.act === 'g') g++;
            if (a.dataset.act === 'g-') g = Math.max(0, g - 1);
            const n = $('#tp-n', body);
            if (n) n.textContent = g;
            if (a.dataset.act === 'tdone') {
              body.onclick = null;
              res.tests.topo = { glances: g };
              nextTest();
            }
          };
        });
      } else if (k === 'rhythm') {
        intro(`${DIAG_TESTS[i][2]} Pièce : <b>${esc(pcs[0].label)}</b>. Mains sur une seule touche, ou tape sur tes cuisses et compte toi-même les arrêts.`, () => {
          body.innerHTML = '<div id="dg-host"></div>';
          child = PieceRunner($('#dg-host', body), {
            piece: { ...pcs[0] },
            mode: 'rhythm',
            tempoQ: 60,
            fixedTempo: true,
            lastMeter: (res.tests.reading && res.tests.reading[0] && res.tests.reading[0].meter) || '',
            onFinish: (r) => {
              res.tests.rhythm = { stops: r.stops, regMs: r.regMs };
              nextTest();
            },
          });
        });
      } else if (k === 'motifs') {
        intro(DIAG_TESTS[i][2], () => {
          body.innerHTML = '<div id="dg-host"></div>';
          child = MotifTrainer($('#dg-host', body), {
            maxRounds: 1,
            phase: 1,
            onDone: (score) => {
              res.tests.motifs = score;
              nextTest();
            },
          });
          body.querySelector('[data-act="start"]').click();
        });
      }
      const sk = body.querySelector('[data-act="skiptest"]');
      if (sk)
        sk.addEventListener('click', () => {
          skipped.add(i);
          nextTest();
        });
    }
    function finish() {
      Kbd.hide();
      S.diagnostics = S.diagnostics.filter((d) => !(d.diagWeek === W && d.date === res.date)).concat(res);
      persist('diagnostics', 0);
      steps();
      let suggestion = '';
      if (W === 0 && res.tests.reading) {
        const stops = res.tests.reading.reduce((a, x) => a + x.stops, 0);
        const wrong = Math.max(...res.tests.reading.map((x) => x.wrong));
        const tq = stops === 0 && wrong <= 2 ? 72 : stops > 4 ? 50 : 60;
        suggestion = `<div class="verdict"><p class="eyebrow">Calibrage du tempo</p><p class="verdict-main">${tempoHTML(tq, '4/4', 10)}</p><p class="muted">${tq === 72 ? 'Aucun arrêt et presque aucune fausse note : commence la phase 1 à noire = 72.' : tq === 50 ? 'Plus de 4 arrêts : commence plus lentement, à noire = 50.' : 'Départ standard : noire = 60.'}</p><button type="button" class="btn primary" data-act="apply" data-t="${tq}">Appliquer ce tempo</button></div>`;
      }
      body.innerHTML = `<div class="saved"><p class="eyebrow">Diagnostic enregistré</p><h2 class="display-sm">Semaine ${W}</h2>${diagRows(S.diagnostics)}${suggestion}<div class="actions"><button type="button" class="btn secondary" data-act="home">Retour à l’accueil</button></div></div>`;
    }
    main.addEventListener('click', async (e) => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      if (a.dataset.act === 'quit') {
        if (i >= DIAG_TESTS.length) return go('diag');
        if (await confirmBox('Quitter le diagnostic ?', 'Les tests déjà faits ne seront pas enregistrés.', 'Quitter')) go('diag');
      } else if (a.dataset.act === 'kbd') Kbd.toggle();
      else if (a.dataset.act === 'apply') {
        S.settings.tempoQ = +a.dataset.t;
        persist('settings');
        toast(`Tempo du jour : noire = ${a.dataset.t}`);
      } else if (a.dataset.act === 'home') go('home');
    });
    Wake.on();
    run();
    active = { destroy: () => child && child.destroy && child.destroy() };
  }

  /* ---------- 5.5 Progrès ---------- */
  function niceMax(v) {
    if (!(v > 0)) return 1;
    const p = 10 ** Math.floor(Math.log10(v));
    for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
    return 10 * p;
  }
  /** Graphique SVG : lignes (ou barres) sur une échelle commune, dernier point mis en valeur. */
  function chart({ title, unit = '', series, bars = false, step = false, yMin = 0, yMaxFixed = null, integer = false, fmt = (v) => String(v), example = false, height = 210 }) {
    const W = 560;
    const H = height;
    const L = 46;
    const R = 16;
    const T = 16;
    const B = 30;
    const xs = [...new Set(series.flatMap((s) => s.points.map((p) => p.x)))].sort();
    const vals = series.flatMap((s) => s.points.map((p) => p.y)).filter((v) => v != null);
    if (!xs.length || !vals.length) return `<figure class="chart"><figcaption>${title}</figcaption><p class="muted chart-empty">Pas encore de données.</p></figure>`;
    const lo = yMin;
    let yMax = yMaxFixed != null ? yMaxFixed : niceMax(Math.max(...vals) * 1.05);
    if (integer) yMax = lo + 4 * Math.max(1, Math.ceil((Math.max(...vals, lo + 1) - lo) / 4));
    const X = (x) => L + (xs.length === 1 ? (W - L - R) / 2 : ((W - L - R) * xs.indexOf(x)) / (xs.length - 1));
    const Y = (v) => T + (H - T - B) * (1 - (v - lo) / (yMax - lo || 1));
    let g = '';
    for (let k = 0; k <= 4; k++) {
      const v = lo + ((yMax - lo) * k) / 4;
      g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
    }
    const lab = (x) => frDate(x, { day: 'numeric', month: 'short' });
    const showIdx = xs.length <= 6 ? xs.map((_, i) => i) : [0, Math.floor((xs.length - 1) / 2), xs.length - 1];
    showIdx.forEach((i) => (g += `<text class="tick" x="${X(xs[i])}" y="${H - 8}" text-anchor="middle">${lab(xs[i])}</text>`));
    let marks = '';
    const bw = Math.max(6, Math.min(26, ((W - L - R) / Math.max(xs.length, 1)) * 0.55));
    series.forEach((s, si) => {
      const pts = s.points.filter((p) => p.y != null);
      if (!pts.length) return;
      if (bars) {
        pts.forEach((p) => (marks += `<rect class="bar s${si}" x="${X(p.x) - bw / 2}" y="${Y(p.y)}" width="${bw}" height="${Math.max(0, Y(lo) - Y(p.y))}" rx="3"/>`));
      } else {
        let d = '';
        pts.forEach((p, i) => {
          if (i === 0) d += `M${X(p.x)} ${Y(p.y)}`;
          else if (step) d += `H${X(p.x)}V${Y(p.y)}`;
          else d += `L${X(p.x)} ${Y(p.y)}`;
        });
        marks += `<path class="area s${si}" d="${d}L${X(pts[pts.length - 1].x)} ${Y(lo)}L${X(pts[0].x)} ${Y(lo)}Z"/><path class="line s${si}" d="${d}"/>`;
        const e = pts[pts.length - 1];
        marks += `<circle class="end s${si}" cx="${X(e.x)}" cy="${Y(e.y)}" r="4.5"/><text class="endlab s${si}" x="${Math.min(X(e.x), W - R - 4)}" y="${Y(e.y) - 10}" text-anchor="end">${fmt(e.y)}${unit}</text>`;
      }
    });
    const legend = series.length > 1 ? `<div class="legend-row">${series.map((s, si) => `<span class="lg-item"><span class="sw s${si}"></span>${s.name}</span>`).join('')}</div>` : '';
    return `<figure class="chart${example ? ' example' : ''}"><figcaption>${title}${example ? '<span class="pill">Exemple</span>' : ''}</figcaption>${legend}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${g}${marks}</svg></figure>`;
  }
  function exampleSessions() {
    const out = [];
    let tq = 60;
    for (let i = 0; i < 10; i++) {
      const date = C.addDays('2026-09-01', i + Math.floor(i / 6));
      const sol = 2600 - i * 120 + (i % 3) * 60;
      const fa = 3400 - i * 150 + (i % 2) * 90;
      const stops = Math.max(0, 5 - Math.floor(i / 2));
      out.push({ date, notes: { treble: { meanRt: sol }, bass: { meanRt: fa } }, reading: { tempoQ: tq, pieces: [{ stops }] }, rhythm: { best: 55 + i * 4 } });
      if (stops === 0) tq += 6;
    }
    return out;
  }
  function heatColor(st, g) {
    if (!st || !st.n) return null;
    const slow = C.clamp((st.ema / g - 0.75) / 1.25, 0, 1);
    const v = C.clamp(0.6 * slow + 0.6 * st.err, 0, 1);
    const stops = [[28, 116, 72], [190, 132, 20], [176, 40, 31]];
    const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
    const c = v < 0.5 ? mix(stops[0], stops[1], v * 2) : mix(stops[1], stops[2], (v - 0.5) * 2);
    return `rgb(${c.join(',')})`;
  }
  function screenProgress(main) {
    const real = S.sessions.length > 0;
    const data = real ? S.sessions : exampleSessions();
    const by = (f) => data.map((s) => ({ x: s.date, y: f(s) }));
    const notesChart = chart({ title: 'Temps moyen par note', unit: ' s', series: [{ name: 'Clé de sol', points: by((s) => (s.notes && s.notes.treble && s.notes.treble.meanRt != null ? Math.round(s.notes.treble.meanRt / 100) / 10 : null)) }, { name: 'Clé de fa', points: by((s) => (s.notes && s.notes.bass && s.notes.bass.meanRt != null ? Math.round(s.notes.bass.meanRt / 100) / 10 : null)) }], fmt: (v) => String(Math.round(v * 10) / 10).replace('.', ','), example: !real });
    const tempoChart = chart({ title: 'Tempo de déchiffrage (noire)', series: [{ name: 'Tempo', points: by((s) => (s.reading ? s.reading.tempoQ : null)) }], step: true, yMin: 30, fmt: (v) => String(Math.round(v)), example: !real });
    const stopsChart = chart({ title: 'Arrêts par séance', series: [{ name: 'Arrêts', points: by((s) => (s.reading && s.reading.pieces && s.reading.pieces.length ? s.reading.pieces.reduce((a, p) => a + (p.stops || 0), 0) : null)) }], bars: true, integer: true, fmt: (v) => String(Math.round(v)), example: !real });
    const rhythmChart = chart({ title: 'Précision rythmique (score / 100)', series: [{ name: 'Rythme', points: by((s) => (s.rhythm && s.rhythm.best != null ? s.rhythm.best : null)) }], yMaxFixed: 100, fmt: (v) => String(Math.round(v)), example: !real });
    const g = C.globalMeanRt(S.stats);
    const heat = (clef) => {
      const cells = [];
      for (let p = -6; p <= 14; p++) {
        const n = C.fromStaffPos(clef, p);
        const key = C.noteKey(clef, n);
        const col = heatColor(S.stats[key], g);
        cells.push({ ...n, key, color: col || 'rgba(59,56,48,.28)', mark: S.stats[key] && S.stats[key].err > 0.25 });
      }
      return N.heatStaff({ clef, cells, S: 13 });
    };
    const slow = C.slowestNotes(S.stats, 8);
    const statsCount = Object.keys(S.stats).length;
    main.innerHTML = `<div class="page progress"><header class="page-head"><p class="eyebrow">${real ? `${S.sessions.length} séance${S.sessions.length > 1 ? 's' : ''} · série de ${C.streak(S.sessions.map((s) => s.date), today())}` : 'Aucune séance encore : les graphiques montrent un exemple'}</p><h1 class="display">Progrès</h1></header>
      <div class="charts">${notesChart}${tempoChart}${stopsChart}${rhythmChart}</div>
      <section class="card heat-card"><div class="card-head"><h2 class="h2">Carte des notes difficiles</h2><p class="legend"><span class="lg ok"></span>rapide <span class="lg near"></span>hésitante <span class="lg bad"></span>lente ou souvent ratée <span class="lg none"></span>jamais vue</p></div>
        <div class="heat-wrap paper">${heat('treble')}${heat('bass')}</div>
        <p class="muted" id="hm-detail">${statsCount ? 'Touche une note pour voir son détail. Un point rouge marque les notes ratées plus d’une fois sur quatre.' : 'La carte se remplit au fil des exercices de notes.'}</p>
        ${slow.length ? `<h3 class="h3">Notes les plus lentes</h3><ol class="slow-list">${slow.map((x) => { const n = C.parseNoteKey(x.key); return `<li><b>${n ? nl(n) : x.key}</b><span>${n ? (n.clef === 'treble' ? 'clé de sol' : 'clé de fa') : ''}</span><span class="num">${fmtSec(x.ema)}</span><span class="num muted">${Math.round(x.err * 100)} % d’erreurs</span></li>`; }).join('')}</ol>` : ''}
      </section>
      <section class="card"><div class="card-head"><h2 class="h2">Journal</h2><button type="button" class="btn secondary sm" data-act="csv">${icon('save', 18)}<span>Exporter le journal (CSV)</span></button></div>
        ${real ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Date</th><th class="num">Sol</th><th class="num">Fa</th><th class="num">Tempo</th><th class="num">Arrêts</th><th class="num">Ressenti</th><th></th></tr></thead><tbody>${[...S.sessions].reverse().map((s) => `<tr><td>${frDate(s.date, { weekday: 'short', day: 'numeric', month: 'short' })}</td><td class="num">${fmtSec(s.notes && s.notes.treble && s.notes.treble.meanRt)}</td><td class="num">${fmtSec(s.notes && s.notes.bass && s.notes.bass.meanRt)}</td><td class="num">${s.reading ? s.reading.tempoQ : '—'}</td><td class="num">${s.reading && s.reading.pieces ? s.reading.pieces.reduce((a, p) => a + (p.stops || 0), 0) : '—'}</td><td class="num">${s.feeling || '—'}</td><td><button type="button" class="btn ghost xs" data-md="${s.id}">Markdown</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Ton journal apparaîtra ici après la première séance enregistrée.</p>'}
      </section></div>`;
    main.addEventListener('click', (e) => {
      const hm = e.target.closest('.hm');
      if (hm) {
        const st = S.stats[hm.dataset.key];
        const n = C.parseNoteKey(hm.dataset.key);
        $('#hm-detail', main).textContent = n ? (st && st.n ? `${nl(n)} (${n.clef === 'treble' ? 'clé de sol' : 'clé de fa'}) : ${st.n} essai${st.n > 1 ? 's' : ''}, ${fmtSec(st.ema)} en moyenne récente, ${Math.round(st.err * 100)} % d’erreurs.` : `${nl(n)} : pas encore travaillée.`) : '';
        return;
      }
      const md = e.target.closest('[data-md]');
      if (md) {
        const s = S.sessions.find((x) => x.id === md.dataset.md);
        if (s) exportSessionMD(s);
      }
      if (e.target.closest('[data-act="csv"]')) exportDialog('Journal en CSV', `journal-piano-${today()}.csv`, C.sessionsToCSV(S.sessions), 'text/csv');
    });
  }

  /* ---------- 5.6 Programme ---------- */
  function screenProgram(main) {
    const P = S.program;

    };
    main.innerHTML = `<div class="page program"><header class="page-head"><p class="eyebrow">12 semaines · du lundi au samedi</p><h1 class="display">Programme</h1></header>
      <div class="program-top card"><label class="field"><span class="lab">Début du programme (un lundi)</span><input class="input" type="date" id="pg-start" value="${P.startDate}"></label>
        <p class="muted">Phase 1 (sem. 1-4) : fondations · Phase 2 (sem. 5-8) : motifs · Phase 3 (sem. 9-12) : fluidité. Trois pièces nouvelles par soir, dans l’ordre.</p></div>

      <div class="row end"><button type="button" class="btn ghost" data-act="reset">Rétablir le programme par défaut</button></div></div>`;
    const save = () => persist('program');

  /* ---------- 5.7 Connexion MIDI ---------- */
  function screenMidi(main) {
    const M = Input.midi;
    const statusText = () => {
      if (!Input.midiSupported()) return ['warn', 'Le MIDI n’est pas disponible dans ce navigateur', framed ? 'Safari et les navigateurs iPad standards n’ont pas l’API Web MIDI. Ouvre l’app dans MIDIWeb Browser. Si tu y es déjà, la page est peut-être affichée dans un cadre qui ne reçoit pas le MIDI : héberge le fichier toi-même (par exemple sur GitHub Pages) et ouvre son adresse directement.' : 'Safari et les navigateurs iPad standards n’ont pas l’API Web MIDI. Ouvre cette page dans MIDIWeb Browser.'];
      if (M.status === 'requesting') return ['info', 'Demande d’accès au MIDI…', 'Accepte la demande du navigateur si elle s’affiche.'];

      if (M.status === 'ready' && Input.hasMidiPort()) return ['ok', 'Piano connecté', 'Joue une note : elle doit apparaître dans le moniteur ci-dessous.'];
      if (M.status === 'ready') return ['warn', 'MIDI actif, mais aucun port', 'Branche le câble USB au port USB TO HOST du Clavinova, allume le piano, puis attends quelques secondes.'];
      return ['info', 'MIDI pas encore activé', 'Touche « Activer le MIDI ».'];
    };
    main.innerHTML = `<div class="page midi"><header class="page-head"><p class="eyebrow">Clavinova CVP-701 · port USB TO HOST</p><h1 class="display">Connexion MIDI</h1></header>
      <div class="midi-grid">
        <section class="card" id="md-status"></section>
        <section class="card"><div class="card-head"><h2 class="h2">Moniteur</h2><span class="muted" id="md-count"></span></div><ol class="monitor" id="md-log" aria-live="polite"></ol><div class="paper mini-kbd" id="md-held"></div></section>
        <section class="card"><h2 class="h2">Test de latence</h2><p class="muted">Joue une note sur chacun des 8 clics, après 4 clics de décompte. L’app mesure l’écart moyen entre les clics et tes notes (câble, son, geste) et le retire de toutes les mesures de rythme.</p>
          <div class="lat-row"><div class="beat small" id="lt-beat">·</div><div><p class="big-num" id="lt-val">${S.settings.latencyMs} <small>ms</small></p><p class="sub">compensation actuelle</p></div></div>
          <p class="feedback" id="lt-fb"></p><div class="actions"><button type="button" class="btn primary" data-act="lat">${icon('metronome', 20)}<span>Lancer le test</span></button><button type="button" class="btn ghost" data-act="lat0">Remettre à 0</button></div></section>
        <section class="card"><h2 class="h2">Simulateur MIDI</h2><p class="muted">Pour tester sans piano : le clavier de l’ordinateur (A W S E D F T G Y H U J K) et le clavier à l’écran envoient de vrais messages MIDI, décodés comme ceux du Clavinova. Z et X changent d’octave.</p>
          <label class="switch"><input type="checkbox" id="md-sim" ${S.settings.simulator ? 'checked' : ''}><span class="sw-track"></span><span>Activer le simulateur</span></label></section>
        <section class="card"><h2 class="h2">Micro</h2><p class="muted">Sans MIDI, l’app peut écouter le piano au micro : une note à la fois (détection YIN), plus les attaques pour le déchiffrage.</p>
          <div class="mic-row"><div class="meter-bar"><span id="mc-level"></span><i id="mc-gate"></i></div><span class="mono" id="mc-pitch">—</span></div>
          <div class="actions"><button type="button" class="btn secondary" data-act="mic">${icon('mic', 20)}<span id="mc-btn">${Input.mic.status === 'on' ? 'Couper le micro' : 'Activer le micro'}</span></button><button type="button" class="btn ghost" data-act="cal">Calibrer</button></div>
          <label class="switch"><input type="checkbox" id="mc-oct" ${S.settings.octaveTolerance ? 'checked' : ''}><span class="sw-track"></span><span>Accepter la bonne note à une autre octave (micro uniquement)</span></label><p class="feedback" id="mc-fb"></p></section>
        <section class="card help"><h2 class="h2">Dépannage</h2><ol class="help-list">
          <li>Le câble va du port USB-C de l’iPad au port <b>USB TO HOST</b> du Clavinova (pas USB TO DEVICE, qui sert aux clés USB).</li>
          <li>Allume le piano <b>avant</b> d’ouvrir l’app, puis touche « Actualiser les ports ».</li>
          <li>Ouvre l’app dans <b>MIDIWeb Browser</b> : Safari, Chrome ou Firefox sur iPad n’ont pas le MIDI.</li>
          <li>Si l’app est ouverte depuis Claude, la page tourne dans un cadre qui peut bloquer le MIDI : héberge le fichier (GitHub Pages) et ouvre son adresse directement.</li>
          <li>Ferme les autres apps qui utilisent le piano (Smart Pianist, par exemple), puis débranche et rebranche le câble.</li>
          <li>Toujours rien : redémarre l’iPad et le piano. En attendant, le micro ou le clavier à l’écran prennent le relais.</li></ol></section>
      </div></div>`;
    function drawStatus() {
      const [k, t, d] = statusText();
      const ports = M.ports;
      $('#md-status', main).innerHTML = `<div class="status ${k}"><span class="dot ${k === 'ok' ? 'on' : k === 'warn' ? 'mid' : ''}"></span><div><h2 class="h2">${t}</h2><p class="muted">${d}</p></div></div>
        ${ports.length ? `<p class="lab">Ports d’entrée</p><div class="ports">${[['all', 'Tous les ports', '']].concat(ports.map((p) => [p.id, p.name, `${p.manufacturer ? p.manufacturer + ' · ' : ''}${p.state === 'connected' ? 'connecté' : p.state}`])).map(([id, name, sub]) => `<button type="button" class="port ${String(S.settings.midiPort) === String(id) ? 'on' : ''}" data-port="${esc(id)}"><b>${esc(name)}</b><span>${esc(sub)}</span></button>`).join('')}</div>` : ''}
        <div class="actions"><button type="button" class="btn primary" data-act="enable">${icon('din', 20)}<span>${M.access ? 'Actualiser les ports' : 'Activer le MIDI'}</span></button></div>`;
    }
    function drawLog() {
      const c = Input.counters;
      const ig = c.ignored;
      $('#md-count', main).textContent = `${c.received} message${c.received > 1 ? 's' : ''} · ignorés : horloge ${ig.clock}, active sensing ${ig.active}, SysEx ${ig.sysex}`;
      $('#md-log', main).innerHTML = Input.log.length ? Input.log.map((ev) => `<li><b>${nlm(ev.midi)}</b><span class="mono">n° ${ev.midi}</span><span class="mono">vél. ${ev.velocity}</span><span class="tag">${sourceLabel(ev.source)}</span></li>`).join('') : '<li class="muted">Joue une note sur le piano…</li>';
      const held = [...Input.held.keys()].sort((a, b) => a - b);
      $('#md-held', main).innerHTML = held.length ? N.card({ staff: 'grand', notes: held.map((m) => { const n = C.midiToSpelled(m); return { ...n, clef: m >= 60 ? 'treble' : 'bass' }; }), S: 9, width: 160, ariaLabel: 'Notes tenues' }) : '<span class="muted">Notes tenues</span>';
    }
    drawStatus();
    drawLog();
    const offS = Input.onStatus(() => {
      drawStatus();
      updateNavStatus();
    });
    const offI = Input.on(() => drawLog());
    const meterTimer = setInterval(() => {
      const l = $('#mc-level', main);
      if (!l) return;
      l.style.width = Math.min(100, (Input.mic.level / 0.3) * 100) + '%';
      $('#mc-gate', main).style.left = Math.min(100, (Input.mic.gate / 0.3) * 100) + '%';
      $('#mc-pitch', main).textContent = Input.mic.pitch ? `${nlm(Math.round(C.freqToMidiFloat(Input.mic.pitch, S.settings.a4)))} · ${Input.mic.pitch.toFixed(1)} Hz` : '—';
    }, 100);
    main.addEventListener('click', async (e) => {
      const port = e.target.closest('[data-port]');
      if (port) {
        S.settings.midiPort = port.dataset.port;
        Input.setPort(S.settings.midiPort);
        persist('settings');
        drawStatus();
        return;
      }
      const a = e.target.closest('[data-act]');
      if (!a) return;
      const act = a.dataset.act;
      if (act === 'enable') {
        await Input.enableMidi();
        Input.refreshPorts();
        drawStatus();
      } else if (act === 'lat') latencyTest(main);
      else if (act === 'lat0') {
        S.settings.latencyMs = 0;
        persist('settings');
        $('#lt-val', main).innerHTML = '0 <small>ms</small>';
      } else if (act === 'mic') {
        if (Input.mic.status === 'on') Input.stopMic();
        else {
          const ok = await Input.startMic({ gate: S.settings.micGate, a4: S.settings.a4 });
          if (!ok) $('#mc-fb', main).textContent = Input.mic.status === 'unsupported' ? 'Micro indisponible dans ce navigateur.' : `Accès au micro refusé (${Input.mic.error || 'refus'}). Dans une page Claude, le micro est bloqué : héberge le fichier pour l’utiliser.`;
        }
        $('#mc-btn', main).textContent = Input.mic.status === 'on' ? 'Couper le micro' : 'Activer le micro';
        updateNavStatus();
      } else if (act === 'cal') {
        if (Input.mic.status !== 'on') {
          $('#mc-fb', main).textContent = 'Active d’abord le micro.';
          return;
        }
        $('#mc-fb', main).textContent = 'Silence pendant 2 secondes…';
        const g = await Input.measureNoise(2000);
        S.settings.micGate = g;
        Input.setMicGate(g);
        $('#mc-fb', main).textContent = 'Joue maintenant le la du milieu du clavier (la3), et tiens-le.';
        const got = await new Promise((res) => {
          const off = Input.on((ev) => {
            if (ev.type === 'noteon' && ev.source === 'mic') {
              off();
              res(ev);
            }
          });
          setTimeout(() => {
            off();
            res(null);
          }, 6000);
        });
        S.settings.micCalibrated = true;
        persist('settings');
        $('#mc-fb', main).textContent = got ? `Seuil réglé. Note entendue : ${nlm(got.midi)} (${got.cents >= 0 ? '+' : ''}${got.cents} cents).${got.midi !== 69 ? ' Ce n’est pas le la3 : vérifie la transposition du piano.' : ''}` : 'Seuil réglé, mais aucune note nette entendue : rapproche l’iPad des haut-parleurs.';
      }
    });
    main.addEventListener('change', (e) => {
      if (e.target.id === 'md-sim') {
        S.settings.simulator = e.target.checked;
        Input.setKeyboardSim(S.settings.simulator);
        persist('settings');
        if (S.settings.simulator) {
          Kbd.auto(48, 84);
          toast('Simulateur actif : clavier de l’ordinateur et clavier à l’écran');
        } else Kbd.hide();
        updateNavStatus();
      }
      if (e.target.id === 'mc-oct') {
        S.settings.octaveTolerance = e.target.checked;
        persist('settings');
      }
    });
    if (S.settings.simulator) Kbd.auto(48, 84);
    active = {
      destroy() {
        offS();
        offI();
        clearInterval(meterTimer);
        if (latRun) latRun.stop();
      },
    };
  }
  let latRun = null;
  async function latencyTest(main) {
    await Sound.unlock();
    const fbEl = $('#lt-fb', main);
    const beatEl = $('#lt-beat', main);
    const metro = new Sound.Metronome();
    latRun = metro;
    const m = metro.start({
      tempoQ: 80,
      meter: '4/4',
      countInBars: 1,
      volume: S.settings.metroVolume,
      onTick: (e) => {
        if (!beatEl.isConnected) return;
        beatEl.textContent = e.countIn ? String(e.beat + 1) : '♪';
        beatEl.classList.toggle('count', e.countIn);
        beatEl.classList.remove('hit');
        void beatEl.offsetWidth;
        beatEl.classList.add('hit');
      },
    });
    if (!m) return (fbEl.textContent = 'Son indisponible.');
    fbEl.textContent = 'Décompte de 4, puis joue sur chaque clic…';
    fbEl.className = 'feedback left info';
    const onsets = [];
    const off = Input.on((ev) => {
      if ((ev.type === 'noteon' && ev.source !== 'mic') || (ev.type === 'onset' && ev.source === 'mic')) onsets.push(ev.t);
    });
    const t0 = m.t0Perf;
    const beat = m.beatMs;
    await wait(t0 + 8.4 * beat - performance.now());
    metro.stop();
    off();
    latRun = null;
    if (!fbEl.isConnected) return;
    const devs = [];
    for (let i = 0; i < 8; i++) {
      const c = t0 + i * beat;
      const near = onsets.filter((t) => Math.abs(t - c) < beat * 0.45);
      if (near.length) devs.push(near.reduce((b, t) => (Math.abs(t - c) < Math.abs(b - c) ? t : b)) - c);
    }
    beatEl.textContent = '·';
    if (devs.length < 5) {
      fbEl.textContent = `Seulement ${devs.length} note${devs.length > 1 ? 's' : ''} sur 8 reconnues. Recommence en jouant une note sur chaque clic.`;
      fbEl.className = 'feedback left bad';
      return;
    }
    const med = Math.round(C.median(devs));
    const spread = Math.round(C.std(devs));
    fbEl.innerHTML = `<span>Écart médian ${med >= 0 ? '+' : ''}${med} ms, dispersion ± ${spread} ms sur ${devs.length} notes.</span><button type="button" class="btn primary sm" data-latapply="${med}">Appliquer ${med} ms</button>`;
    fbEl.className = 'feedback left ok';
    fbEl.querySelector('[data-latapply]').addEventListener('click', () => {
      S.settings.latencyMs = C.clamp(med, -200, 400);
      persist('settings');
      $('#lt-val', main).innerHTML = `${S.settings.latencyMs} <small>ms</small>`;
      toast(`Compensation de latence : ${S.settings.latencyMs} ms`);
    });
  }

  /* ---------- 5.8 Réglages ---------- */
  function screenSettings(main) {
    const st = S.settings;
    const b = st.blocks;
    main.innerHTML = `<div class="page settings"><header class="page-head"><p class="eyebrow">Pupitre</p><h1 class="display">Réglages</h1></header>
      <div class="settings-grid">
        <section class="card"><h2 class="h2">Entrée</h2>
          <div class="field"><span class="lab">Entrée active</span>${chipsHTML('input', [['auto', 'Automatique'], ['midi', 'MIDI'], ['mic', 'Micro'], ['touch', 'Clavier à l’écran']], st.input)}<span class="sub">Automatique : MIDI si un piano est branché, sinon micro s’il est activé, sinon clavier à l’écran.</span></div>
          <div class="field"><span class="lab">Seuil d’arrêt (en temps)</span>${stepperHTML('set-stop', st.stopBeats, { min: 1, max: 6, label: 'le seuil d’arrêt' })}<span class="sub">Un arrêt = aucune note jouée pendant plus de ${st.stopBeats} temps.</span></div>
          <label class="switch"><input type="checkbox" id="set-pedal" ${st.pedalStart ? 'checked' : ''}><span class="sw-track"></span><span>La pédale de sustain lance le décompte</span></label>
          <label class="switch"><input type="checkbox" id="set-touch" ${st.touchSound ? 'checked' : ''}><span class="sw-track"></span><span>Son des touches à l’écran</span></label></section>
        <section class="card"><h2 class="h2">Séance du soir</h2>
          <div class="form-grid">${[['notes', 'Notes'], ['reading', 'Déchiffrage'], ['third', 'Rythme ou motifs'], ['report', 'Compte rendu']].map(([k, l]) => `<div class="field"><span class="lab">${l}</span>${stepperHTML('blk-' + k, b[k], { min: 1, max: 40, label: l, unit: ' min' })}</div>`).join('')}</div>
          <div class="form-grid">
            <div class="field"><span class="lab">Tempo du jour (noire)</span>${stepperHTML('set-tempo', st.tempoQ, { min: 30, max: 200, step: 2, label: 'le tempo' })}</div>
            <div class="field"><span class="lab">Pas de la règle de tempo</span>${stepperHTML('set-tstep', st.tempoStep, { min: 1, max: 12, label: 'le pas' })}</div>
            <div class="field"><span class="lab">Analyse avant chaque pièce</span>${stepperHTML('set-analyse', st.analyseSec, { min: 10, max: 120, step: 5, label: 'l’analyse', unit: ' s' })}</div>
            <div class="field"><span class="lab">Temps par motif</span>${stepperHTML('set-motif', st.motifSec, { min: 1, max: 6, label: 'le temps par motif', unit: ' s' })}</div>
          </div></section>
        <section class="card"><h2 class="h2">Métronome et son</h2>
          <label class="field"><span class="lab">Volume du métronome</span><input type="range" class="range" id="set-vol" min="0" max="1" step="0.05" value="${st.metroVolume}"></label>
          <label class="switch"><input type="checkbox" id="set-sub" ${st.metroSubdivide ? 'checked' : ''}><span class="sw-track"></span><span>Subdivisions audibles (croches)</span></label>
          <div class="actions"><button type="button" class="btn secondary" data-act="testclick">${icon('metronome', 20)}<span>Tester le métronome</span></button></div></section>
        <section class="card"><h2 class="h2">Affichage</h2>
          <div class="field"><span class="lab">Thème</span>${chipsHTML('theme', [['dark', 'Sombre'], ['light', 'Clair'], ['auto', 'Comme le système']], st.theme)}</div>
          <div class="field"><span class="lab">Taille de la notation</span>${chipsHTML('notation', [['m', 'Normale'], ['l', 'Grande'], ['xl', 'Très grande']], st.notation)}</div>
          <div class="field"><span class="lab">Numérotation des octaves</span>${chipsHTML('octaves', [['fr', 'Française : do central = do3'], ['intl', 'Internationale : do central = do4']], st.octaves)}</div></section>
        <section class="card"><h2 class="h2">Sauvegardes</h2>
          <p class="muted">Tes données restent dans ce navigateur (${Store.mode === 'idb' ? 'IndexedDB' : 'mémoire seulement'}). Dernière sauvegarde : ${S.meta.lastExportAt ? frDate(C.isoDate(new Date(S.meta.lastExportAt)), { day: 'numeric', month: 'long' }) : 'jamais'}.</p>
          <div class="actions wrap"><button type="button" class="btn primary" data-act="export">${icon('save', 20)}<span>Exporter tout (JSON)</span></button><button type="button" class="btn secondary" data-act="import">Importer une sauvegarde</button><button type="button" class="btn secondary" data-act="csv">Journal (CSV)</button></div>
          <div class="actions wrap"><button type="button" class="btn danger" data-act="wipe">Effacer toutes les données</button></div></section>
        <section class="card help"><h2 class="h2">Brancher le Clavinova</h2><ol class="help-list">
          <li>Câble USB-C vers USB-B : côté USB-C dans l’iPad, côté USB-B (carré) dans le port <b>USB TO HOST</b> sous le clavier, à gauche.</li>
          <li>Allume le piano, puis ouvre l’app dans <b>MIDIWeb Browser</b>.</li>
          <li>Onglet MIDI : « Activer le MIDI ». Le Clavinova apparaît dans les ports ; joue une note pour vérifier le moniteur.</li>
          <li>Fais une fois le test de latence, puis lance ta séance.</li></ol></section>
      </div></div>`;
    const apply = () => {
      persist('settings');
      applyTheme();
    };
    wireChips(main, (k, v) => {
      st[k] = v;
      if (k === 'input') updateNavStatus();
      apply();
    });
    wireSteppers(main, (id, v) => {
      if (id === 'set-stop') st.stopBeats = v;
      else if (id === 'set-tempo') st.tempoQ = v;
      else if (id === 'set-tstep') st.tempoStep = v;
      else if (id === 'set-analyse') st.analyseSec = v;
      else if (id === 'set-motif') st.motifSec = v;
      else if (id.startsWith('blk-')) st.blocks[id.slice(4)] = v;
      apply();
    });
    main.addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'set-pedal') st.pedalStart = e.target.checked;
      if (id === 'set-touch') st.touchSound = e.target.checked;
      if (id === 'set-sub') st.metroSubdivide = e.target.checked;
      if (id === 'set-vol') st.metroVolume = +e.target.value;
      apply();
    });
    let testMetro = null;
    main.addEventListener('click', async (e) => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      const act = a.dataset.act;
      if (act === 'export') exportAll();
      else if (act === 'import') importDialog();
      else if (act === 'csv') exportDialog('Journal en CSV', `journal-piano-${today()}.csv`, C.sessionsToCSV(S.sessions), 'text/csv');
      else if (act === 'testclick') {
        await Sound.unlock();
        if (testMetro) {
          testMetro.stop();
          testMetro = null;
          return;
        }
        testMetro = new Sound.Metronome();
        testMetro.start({ tempoQ: st.tempoQ, meter: '4/4', countInBars: 0, volume: st.metroVolume, subdivide: st.metroSubdivide });
        setTimeout(() => {
          if (testMetro) testMetro.stop();
          testMetro = null;
        }, 4200);
      } else if (act === 'wipe') {
        if (await confirmBox('Effacer toutes les données ?', 'Séances, diagnostics, statistiques, programme et réglages seront supprimés de ce navigateur. Exporte d’abord une sauvegarde si tu veux les garder.', 'Tout effacer', true)) {
          await Store.clearAll();
          S.settings = C.defaultSettings();
          S.program = C.defaultProgram();
          S.sessions = [];
          S.diagnostics = [];
          S.stats = {};
          S.done = [];
          S.meta = { createdAt: Date.now(), lastExportAt: 0, onboarded: false };
          S.draft = null;
          persistAll();
          applyTheme();
          toast('Données effacées');
          go('home');
        }
      }
    });
    active = { destroy: () => testMetro && testMetro.stop() };
  }

  /* ---------- Sauvegarde et restauration ---------- */
  async function exportAll() {
    flushAttempts();
    const attempts = await Store.allAttempts();
    const data = { app: 'pupitre-lecture', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, program: S.program, sessions: S.sessions, diagnostics: S.diagnostics, stats: S.stats, done: S.done, meta: S.meta, attempts };
    exportDialog('Sauvegarde complète', `pupitre-sauvegarde-${today()}.json`, JSON.stringify(data, null, 1), 'application/json');
  }
  function importDialog() {
    const id = 'im-' + uid();
    const m = modal({
      title: 'Importer une sauvegarde',
      wide: true,
      body: `<p class="muted">Choisis le fichier .json exporté par Pupitre, ou colle son contenu. L’import remplace toutes les données de ce navigateur.</p>
        <input type="file" accept=".json,application/json" class="input" id="${id}-file" aria-label="Fichier de sauvegarde">
        <textarea class="code" id="${id}-txt" rows="7" placeholder="…ou colle ici le contenu du fichier" aria-label="Contenu de la sauvegarde"></textarea><p class="feedback" id="${id}-fb"></p>`,
      actions: [
        { label: 'Annuler', kind: 'ghost' },
        {
          label: 'Importer',
          kind: 'primary',
          act: async (el) => {
            const fbEl = $(`#${id}-fb`, el);
            let text = $(`#${id}-txt`, el).value.trim();
            const f = $(`#${id}-file`, el).files[0];
            if (!text && f) text = await f.text();
            let data;
            try {
              data = JSON.parse(text);
            } catch (err) {
              fbEl.textContent = 'Ce contenu n’est pas un JSON valide.';
              fbEl.className = 'feedback bad';
              return false;
            }
            if (!data || data.app !== 'pupitre-lecture' || !Array.isArray(data.sessions)) {
              fbEl.textContent = 'Ce fichier ne vient pas de Pupitre (champ « app » absent).';
              fbEl.className = 'feedback bad';
              return false;
            }
            for (const k of ['settings', 'program', 'sessions', 'diagnostics', 'stats', 'done', 'meta']) if (data[k] != null) S[k] = mergeLoaded(k, data[k]);
            S.draft = null;
            persistAll();
            await Store.replaceAttempts(Array.isArray(data.attempts) ? data.attempts : []);
            applyTheme();
            Input.setPort(S.settings.midiPort);
            toast(`Sauvegarde importée : ${S.sessions.length} séance(s)`);
            go('home');
          },
        },
      ],
    });
    void m;
  }

  /* =====================================================================
     6. DÉMARRAGE
     ===================================================================== */
  function applyTheme() {
    document.documentElement.setAttribute('data-ui', S.settings.theme || 'dark');
  }
  const SCREENS = { home: screenHome, session: screenSession, free: screenFree, diag: screenDiag, diagrun: screenDiagRun, progress: screenProgress, program: screenProgram, midi: screenMidi, settings: screenSettings };
  async function boot() {
    applyTheme();
    buildNav();
    Kbd.init();
    initCapabilities();
    await load();
    applyTheme();
    Input.setPort(S.settings.midiPort);
    Input.setKeyboardSim(S.settings.simulator);
    Input.onStatus(updateNavStatus);
    document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });
    const hash = (location.hash || '').replace('#', '');
    go(SCREENS[hash] && hash !== 'diagrun' ? hash : 'home');
    if (Input.midiSupported()) Input.enableMidi();
    else {
      Input.midi.status = 'unsupported';
      updateNavStatus();
    }
    window.addEventListener('pagehide', () => {
      flushAttempts();
      persistAll();
    });
  }
  return { boot, S, go, Kbd, DEBUG, get view() { return view; }, get active() { return active; } };
})();
window.Pupitre = { App, Core, Notation, Input, Sound, Store };
App.boot();

</script>
