})();


/* ===== sound.js ===== */
/* ==========================================================================
   SOUND — contexte Web Audio, clics de métronome planifiés à l'avance,
   sons des touches à l'écran, correspondance horloge audio ↔ performance.now().
   (Nommé Sound pour ne pas masquer le constructeur global Audio.)
   ========================================================================== */
const Sound = (() => {
  'use strict';
  let ctx = null;
  let master = null;
  let primed = false;

  function context() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC({ latencyHint: 'interactive' });
    } catch (e) {
      try {
        ctx = new AC();
      } catch (e2) {
        return null;
      }
    }
    master = ctx.createGain();
    master.gain.value = 1;
    master.connect(ctx.destination);
    try {
      // iOS 17+ : joue même si l'appareil est en mode silencieux.
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
    } catch (e) {}
    return ctx;
  }

  /** À appeler depuis un geste de l'utilisateur (iOS n'autorise le son qu'après une interaction). */
  async function unlock() {
    const c = context();
    if (!c) return false;
    try {
      if (c.state !== 'running') await c.resume();
    } catch (e) {}
    if (!primed) {
      try {
        const b = c.createBuffer(1, 1, 22050);
        const s = c.createBufferSource();
        s.buffer = b;
        s.connect(c.destination);
        s.start(0);
        primed = true;
      } catch (e) {}
    }
    return c.state === 'running';
  }

  /** Temps performance.now() (ms) auquel un instant de l'horloge audio sera entendu. */
  function perfAt(audioTime) {
    const c = ctx;
    if (!c) return performance.now();
    try {
      const ts = c.getOutputTimestamp && c.getOutputTimestamp();
      if (ts && ts.performanceTime > 0 && ts.contextTime > 0) return ts.performanceTime + (audioTime - ts.contextTime) * 1000;
    } catch (e) {}
    const lat = (c.outputLatency || 0) + (c.baseLatency || 0);
    return performance.now() + (audioTime - c.currentTime + lat) * 1000;
  }

  /** Clic de métronome : temps fort plus aigu et plus fort, subdivisions discrètes. */
  function click(time, kind, volume) {
    const c = context();
    if (!c || volume <= 0) return;
    const o = c.createOscillator();
    const g = c.createGain();
    const freq = kind === 'bar' ? 1760 : kind === 'beat' ? 1175 : kind === 'wood' ? 620 : 880;
    const amp = (kind === 'sub' ? 0.28 : kind === 'bar' ? 0.9 : kind === 'wood' ? 0.8 : 0.6) * volume;
    o.type = kind === 'wood' ? 'square' : 'triangle';
    o.frequency.setValueAtTime(freq, time);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, amp), time + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time + (kind === 'wood' ? 0.09 : 0.055));
    o.connect(g);
    g.connect(master);
    o.start(time);
    o.stop(time + 0.12);
  }

  /** Son court pour les touches à l'écran (le Clavinova joue lui-même ses notes). */
  function tone(midi, volume = 0.22, dur = 0.7) {
    const c = context();
    if (!c || c.state !== 'running') return;
    const t = c.currentTime + 0.005;
    const f = 440 * 2 ** ((midi - 69) / 12);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(volume, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(master);
    for (const [type, mult, a] of [['triangle', 1, 1], ['sine', 2, 0.35]]) {
      const o = c.createOscillator();
      const og = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f * mult, t);
      og.gain.value = a;
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + dur + 0.05);
    }
  }

  /** Note planifiée à un instant performance.now() donné (écoute d'un passage). */
  function toneAt(midi, whenPerf, dur = 0.5, volume = 0.2) {
    const c = context();
    if (!c || c.state !== 'running') return;
    const t = Math.max(c.currentTime + 0.005, c.currentTime + (whenPerf - performance.now()) / 1000);
    const len = Math.max(0.25, Math.min(dur, 4));
    const f = 440 * 2 ** ((midi - 69) / 12);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(volume, t + 0.008);
    g.gain.exponentialRampToValueAtTime(volume * 0.45, t + Math.min(0.3, len * 0.5));
    g.gain.exponentialRampToValueAtTime(0.0001, t + len + 0.15);
    g.connect(master);
    for (const [type, mult, a] of [['triangle', 1, 1], ['sine', 2, 0.35]]) {
      const o = c.createOscillator();
      const og = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f * mult, t);
      og.gain.value = a;
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + len + 0.2);
    }
  }

  /** Carillon discret : fin du temps d'un bloc. */
  function chime() {
    const c = context();
    if (!c || c.state !== 'running') return;
    [76, 83].forEach((m, i) => setTimeout(() => tone(m, 0.16, 1.2), i * 180));
  }

  /**
   * Métronome. La planification anticipée (fenêtre de 150 ms, réveil toutes les 25 ms)
   * place chaque clic sur l'horloge audio : la précision ne dépend pas du fil principal.
   */
  class Metronome {
    constructor() {
      this.running = false;
      this.timer = null;
      this.timeouts = new Set();
    }
    start({ tempoQ, meter, countInBars = 1, subdivide = false, volume = 0.7, onTick = null, leadSec = 0.15 }) {
      const c = context();
      if (!c) return null;
      this.stop();
      const startTime = c.currentTime + leadSec;
      this.sched = new Core.ClickScheduler({ tempoQ, meter, countInBars, subdivide, startTime });
      this.volume = volume;
      this.onTick = onTick;
      this.offset = perfAt(startTime) - startTime * 1000;
      this.beatMs = this.sched.beatSec * 1000;
      this.quarterMs = 60000 / tempoQ;
      this.startPerf = this.toPerf(startTime);
      this.t0Perf = this.toPerf(this.sched.t0);
      this.mi = this.sched.mi;
      this.running = true;
      this.timer = setInterval(() => this.pump(), 25);
      this.pump();
      return this;
    }
    toPerf(t) {
      return t * 1000 + this.offset;
    }
    pump() {
      if (!this.running || !ctx) return;
      const evs = this.sched.upTo(ctx.currentTime + 0.15);
      for (const e of evs) {
        click(e.time, e.kind, this.volume);
        if (this.onTick) {
          const delay = this.toPerf(e.time) - performance.now();
          const id = setTimeout(() => {
            this.timeouts.delete(id);
            if (this.running && this.onTick) this.onTick({ ...e, perf: this.toPerf(e.time) });
          }, Math.max(0, delay));
          this.timeouts.add(id);
        }
      }
    }
    setVolume(v) {
      this.volume = v;
    }
    stop() {
      this.running = false;
      if (this.timer) clearInterval(this.timer);
      this.timer = null;
      for (const id of this.timeouts) clearTimeout(id);
      this.timeouts.clear();
    }
  }

  return {
    context,
    unlock,
    perfAt,
    click,
    tone,
    toneAt,
    chime,
    Metronome,
    get available() {
      return !!(window.AudioContext || window.webkitAudioContext);
    },
    get running() {
      return !!ctx && ctx.state === 'running';
    },
  };
})();


/* ===== input.js ===== */
/* ==========================================================================
   INPUT — une seule chaîne d'entrée pour toute l'app.
   Sources : MIDI (prioritaire) → micro (YIN) → clavier à l'écran → simulateur.
   Le simulateur et le clavier à l'écran fabriquent de vrais messages MIDI
   qui passent par le même décodeur que le Clavinova.
   Événements émis : { type: 'noteon'|'noteoff'|'cc'|'onset', midi, velocity, t, source }
   ========================================================================== */
const Input = (() => {
  'use strict';
  const subs = new Set();
  const statusSubs = new Set();

  const counters = { received: 0, notes: 0, ignored: { clock: 0, active: 0, sysex: 0, system: 0, other: 0, data: 0, empty: 0 } };
  const log = [];

    subs.add(fn);
    return () => subs.delete(fn);
  }
  function onStatus(fn) {
    statusSubs.add(fn);
    return () => statusSubs.delete(fn);
  }
  function notify() {
    for (const fn of [...statusSubs]) {

        fn();
      } catch (e) {
        console.error(e);
      }
    }
  }
  function emit(ev) {
    if (ev.type === 'noteon') {
      held.set(ev.midi, ev.source);
      counters.notes++;
      log.unshift({ ...ev, at: Date.now() });
      if (log.length > 14) log.pop();
    } else if (ev.type === 'noteoff') held.delete(ev.midi);
    for (const fn of [...subs]) {
      try {
        fn(ev);
      } catch (e) {
        console.error(e);
      }
    }

  const midiSupported = () => typeof navigator !== 'undefined' && typeof navigator.requestMIDIAccess === 'function';

  }

      midi.status = 'unsupported';
      notify();
      return false;
    }
    if (midi.access) {
      refreshPorts();
      return true;
    }
    midi.status = 'requesting';

      const access = await withTimeout(navigator.requestMIDIAccess({ sysex: false }), 10000);
      midi.access = access;
      midi.status = 'ready';
      midi.error = null;

        access.onstatechange = onState;
      } catch (e) {}
      try {
        if (access.addEventListener) access.addEventListener('statechange', onState);
      } catch (e) {}

      clearInterval(midi.poll);
      midi.poll = setInterval(refreshPorts, 2500);
      notify();

      let ins = access.inputs;
      if (typeof ins === 'function') ins = ins.call(access);
      if (!ins) return out;
      if (typeof ins.forEach === 'function') ins.forEach((p) => p && out.push(p));

  function onMidiMessage(e, port) {
    const portId = port ? port.id || port.name : 'sim';
    if (midi.selected !== 'all' && !(port && port.__sim) && portId !== midi.selected) return;
    const data = e && (e.data || (e.detail && e.detail.data));
    const msg = Core.parseMidi(data);
    counters.received++;
    if (msg.type === 'ignore') {
      counters.ignored[msg.reason] = (counters.ignored[msg.reason] || 0) + 1;
      return;
    }
    const now = performance.now();
    let t = now;
    const ts = e && typeof e.timeStamp === 'number' ? e.timeStamp : e && typeof e.receivedTime === 'number' ? e.receivedTime : null;
    if (ts != null && ts > 0 && Math.abs(ts - now) < 300) t = ts;
    const source = port && port.__sim ? port.__sim : 'midi';
    if (source === 'midi') lastMidiAt = now;
    if (msg.type === 'noteon') emit({ type: 'noteon', midi: msg.note, velocity: msg.velocity, t, source });
    else if (msg.type === 'noteoff') emit({ type: 'noteoff', midi: msg.note, velocity: msg.velocity, t, source });

  const TOUCH_PORT = { __sim: 'touch', id: 'touch', name: 'Clavier à l’écran' };

      let outs = access.outputs;
      if (typeof outs === 'function') outs = outs.call(access);
      if (!outs) return out;
      if (typeof outs.forEach === 'function') outs.forEach((p) => p && out.push(p));
      else if (typeof outs.values === 'function') for (const p of outs.values()) out.push(p);
      else if (Array.isArray(outs)) out.push(...outs);

  function outputPort() {
    if (!midi.access) return null;
    const outs = listOutputs(midi.access);
    if (!outs.length) return null;
    const names = midi.ports.filter((p) => p.state !== 'disconnected' && (midi.selected === 'all' || p.id === midi.selected)).map((p) => p.name);
    return outs.find((o) => names.includes(o.name)) || outs.find((o) => /clavinova|yamaha|piano|usb/i.test(o.name || '')) || outs[0];

  /** Envoie des octets au piano (horodatage optionnel, horloge performance.now()). */
  function sendOut(bytes, when) {
    const p = outputPort();

    } catch (e) {

      notify();

    const buf = mic.buf;

    mic.analyser = null;

    if (mic.onset) mic.onset.gate = g;
  }

    return new Promise((res) => {
      const vals = [];
      const id = setInterval(() => vals.push(mic.level), 50);
      setTimeout(() => {
        clearInterval(id);
        const m = vals.length ? Core.median(vals) : 0.005;
        res(Math.max(0.006, Math.min(0.15, m * 3)));

    });
  }

  /* ---------- Clavier de l'ordinateur (simulateur) ---------- */
  const KEYMAP = { KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7, KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13, KeyL: 14, KeyP: 15, Semicolon: 16, Quote: 17 };
  const kb = { enabled: false, octave: 4, down: new Map() };
  function onKey(e) {
    if (!kb.enabled || e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target || {};

    if (typing) return;

      kb.octave = Math.max(1, Math.min(7, kb.octave + (e.code === 'KeyZ' ? -1 : 1)));
      notify();
      return;
    }
    if (!(e.code in KEYMAP)) return;
    e.preventDefault();

      if (e.repeat || kb.down.has(e.code)) return;

      kb.down.set(e.code, m);
      sendBytes([0x90, m, 96], 'sim');
    } else {
      const m = kb.down.get(e.code);

  }

    kb.enabled = !!on;
    notify();
  }

  /** Source active : choix manuel, ou automatique MIDI → micro → clavier à l'écran. */

  return {

    onStatus,
    notify,
    emit,
    midi,
    mic,
    kb,
    counters,
    log,
    held,
    midiSupported,
    enableMidi,
    refreshPorts,
    setPort,
    hasMidiPort,
    sendBytes,
    sendOut,
    get hasOutput() {

    startMic,
    stopMic,
    setMicGate,
    measureNoise,
    setKeyboardSim,
    activeSource,
    get lastMidiAt() {
      return lastMidiAt;
    },
  };
})();


/* ===== store.js ===== */
/* ==========================================================================
   STORE — IndexedDB avec repli en mémoire. Chaque appel est protégé :
   si le stockage échoue, l'app continue et signale qu'il faut exporter.
   ========================================================================== */
const Store = (() => {
  'use strict';
  const NAME = 'pupitre-lecture';
  let db = null;
  let mode = 'memory';
  let lastError = null;
  const mem = new Map();
  let memAttempts = [];

  function req(r) {
    return new Promise((res, rej) => {
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  function txDone(tx) {
    return new Promise((res, rej) => {
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('Transaction annulée'));
    });
  }
  async function open() {
    try {
      if (typeof indexedDB === 'undefined' || !indexedDB) throw new Error('IndexedDB absent');
      db = await new Promise((res, rej) => {
        const r = indexedDB.open(NAME, 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
          if (!d.objectStoreNames.contains('attempts')) d.createObjectStore('attempts', { autoIncrement: true });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error || new Error('Ouverture impossible'));
        r.onblocked = () => rej(new Error('Base bloquée par un autre onglet'));
        setTimeout(() => rej(new Error('Délai dépassé')), 5000);
      });
      mode = 'idb';
      try {
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      } catch (e) {}
    } catch (e) {
      db = null;
      mode = 'memory';
      lastError = (e && e.message) || String(e);
    }
    return mode;
  }
  async function get(key) {
    if (mode !== 'idb') return mem.get(key);
    try {
      return await req(db.transaction('kv').objectStore('kv').get(key));
    } catch (e) {
      lastError = (e && e.message) || String(e);
      return mem.get(key);
    }
  }
  async function set(key, value) {
    mem.set(key, value);
    if (mode !== 'idb') return false;
    try {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(JSON.parse(JSON.stringify(value === undefined ? null : value)), key);
      await txDone(tx);
      return true;
    } catch (e) {
      lastError = (e && e.message) || String(e);
      return false;
    }
  }
  async function addAttempts(list) {
    if (!list || !list.length) return true;
    if (mode !== 'idb') {
      memAttempts = memAttempts.concat(list);
      return false;
    }
    try {
      const tx = db.transaction('attempts', 'readwrite');
      const st = tx.objectStore('attempts');
      for (const a of list) st.add(a);
      await txDone(tx);
      return true;
    } catch (e) {
      lastError = (e && e.message) || String(e);
      memAttempts = memAttempts.concat(list);
      return false;
    }
  }
  async function allAttempts() {
    if (mode !== 'idb') return memAttempts.slice();
    try {
      const all = await req(db.transaction('attempts').objectStore('attempts').getAll());
      return all.concat(memAttempts);
    } catch (e) {
      return memAttempts.slice();
    }
  }
  async function replaceAttempts(list) {
    memAttempts = [];
    if (mode !== 'idb') {
      memAttempts = list.slice();
      return;
    }
    try {
      const tx = db.transaction('attempts', 'readwrite');
      const st = tx.objectStore('attempts');
      st.clear();
      for (const a of list) st.add(a);
      await txDone(tx);
    } catch (e) {
      memAttempts = list.slice();
    }
  }
  async function clearAll() {
    mem.clear();
    memAttempts = [];
    if (mode !== 'idb') return;
    try {
      const tx = db.transaction(['kv', 'attempts'], 'readwrite');
      tx.objectStore('kv').clear();
      tx.objectStore('attempts').clear();
      await txDone(tx);
    } catch (e) {
      lastError = (e && e.message) || String(e);
    }
  }
  return {
    open,
    get,
    set,
    addAttempts,
    allAttempts,
    replaceAttempts,
    clearAll,
    get mode() {
      return mode;
    },
    get lastError() {
      return lastError;
    },
  };
})();

/* ==========================================================================
   APP — écrans, séance guidée, exercices, diagnostic, progrès, programme,
   connexion MIDI, réglages. Dépend de Core, Notation, Sound, Input, Store.
   ========================================================================== */
const App = (() => {
  'use strict';
  const C = Core;
  const N = Notation;

  /* =====================================================================
     1. ÉTAT ET PERSISTANCE
     ===================================================================== */
  const S = {
    settings: C.defaultSettings(),
    program: C.defaultProgram(),
    sessions: [],
    diagnostics: [],
    stats: {},
    done: [],
    meta: { createdAt: Date.now(), lastExportAt: 0, onboarded: false },
    draft: null,
    repertoire: { pieces: {}, custom: [], last: null, filter: 'all' },
  };
  const KEYS = ['settings', 'program', 'sessions', 'diagnostics', 'stats', 'done', 'meta', 'draft', 'repertoire'];
  let view = 'home';
  let params = {};
  /** État interne des exercices en cours, exposé pour les tests de bout en bout. */
  const DEBUG = {};
  let active = null;
  let storageWarned = false;

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  /**
   * Chaque composant reçoit un élément neuf : quand son conteneur est réutilisé,
   * l'ancien élément (et ses écouteurs) disparaît avec lui.

    const h = document.createElement('div');
    if (cls) h.className = cls;
    root.replaceChildren(h);
    return h;
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, Math.max(0, ms)));

  const persistTimers = {};
  function persist(key, delay = 250) {
    clearTimeout(persistTimers[key]);
    persistTimers[key] = setTimeout(async () => {
      const ok = await Store.set(key, S[key]);
      if (!ok && Store.mode === 'idb' && !storageWarned) {
        storageWarned = true;
        toast('Enregistrement impossible dans ce navigateur. Exporte tes données depuis Réglages.', 5000);
      }

  }
  function persistAll() {
    KEYS.forEach((k) => persist(k, 0));
  }
  function mergeLoaded(k, v) {
    if (k === 'settings') {
      const d = C.defaultSettings();
      return { ...d, ...v, blocks: { ...d.blocks, ...(v.blocks || {}) } };
    }
    if (k === 'program') {
      const d = C.defaultProgram();

      return {

  function modal({ title, body, actions = [], wide = false, onClose = null }) {
    const root = $('#modal-root');
    const el = document.createElement('div');
    el.className = 'modal-wrap';
    el.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="mdl-${uid()}">

      <div class="modal-actions">${actions.map((a, i) => `<button type="button" class="btn ${a.kind || 'secondary'}" data-mi="${i}">${a.icon ? icon(a.icon, 20) : ''}<span>${esc(a.label)}</span></button>`).join('')}</div></div>`;
    root.appendChild(el);
    const prev = document.activeElement;
    const close = () => {
      el.remove();
      if (onClose) onClose();
      if (prev && prev.focus) prev.focus({ preventScroll: true });
    };
    el.addEventListener('click', async (e) => {
      if (e.target === el) return close();

    setTimeout(() => {

  /* ---------- Verrou d'écran pendant les exercices ---------- */
  const Wake = {
    lock: null,
    want: false,
    async on() {
      this.want = true;
      try {
        if ('wakeLock' in navigator && !this.lock) {
          this.lock = await navigator.wakeLock.request('screen');
          this.lock.addEventListener && this.lock.addEventListener('release', () => (this.lock = null));
        }

        this.lock = null;
      }
    },

  /* ---------- Clavier à l'écran (entrée tactile et simulateur MIDI) ---------- */
  const Kbd = {
    lo: 48,
    hi: 72,
    visible: false,
    pinned: false,
    el: null,
    wanted() {
      return Input.activeSource(S.settings.input) === 'touch' || S.settings.simulator || this.pinned;
    },
    /** Affiche le clavier si l'entrée tactile ou le simulateur est actif, sur la plage demandée. */
    auto(lo, hi) {
      this.lo = lo;
      this.hi = hi;
      if (this.wanted()) this.show();
      else this.hide();
    },
    show() {
      this.visible = true;
      this.render();
      this.el.hidden = false;
      document.body.classList.add('has-kbd');
    },
    hide() {
      this.visible = false;
      if (this.el) this.el.hidden = true;
      document.body.classList.remove('has-kbd');
    },
    toggle() {
      this.pinned = !this.visible;
      if (this.visible) this.hide();
      else this.show();
    },
    render() {
      const isBlack = (m) => [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);
      let lo = this.lo;
      let hi = this.hi;
      while (isBlack(lo)) lo--;
      while (isBlack(hi)) hi++;
      const whites = [];
      for (let m = lo; m <= hi; m++) if (!isBlack(m)) whites.push(m);
      const n = whites.length;
      let keys = '';
      whites.forEach((m) => {
        const label = m % 12 === 0 ? `<span class="k-lab">${nlm(m)}</span>` : '';
        keys += `<button type="button" class="k w${Input.held.has(m) ? ' down' : ''}" data-m="${m}" aria-label="${nlm(m)}">${label}</button>`;
      });
      for (let m = lo; m <= hi; m++) {
        if (!isBlack(m)) continue;
        const idx = whites.filter((w) => w < m).length;
        keys += `<button type="button" class="k b${Input.held.has(m) ? ' down' : ''}" data-m="${m}" aria-label="${nlm(m)}" style="left:calc(${idx} * 100% / ${n} - (100% / ${n}) * 0.3)"></button>`;
      }
      const src = S.settings.simulator ? 'Simulateur MIDI' : 'Clavier à l’écran';
      this.el.innerHTML = `<div class="kbd-bar"><span>${src}${S.settings.simulator ? ' · touches A W S E D F… de l’ordinateur, Z/X pour changer d’octave' : ''}</span><button type="button" class="btn ghost xs" data-kact="down" aria-label="Octave plus grave">${icon('minus', 18)}</button><button type="button" class="btn ghost xs" data-kact="up" aria-label="Octave plus aiguë">${icon('plus', 18)}</button><button type="button" class="btn ghost xs" data-kact="hide">Masquer</button></div><div class="kbd" style="--n:${n}">${keys}</div>`;
    },
    init() {
      this.el = $('#kbd-dock');
      const press = new Map();
      const kind = () => (S.settings.simulator ? 'sim' : 'touch');
      this.el.addEventListener('pointerdown', (e) => {
        const a = e.target.closest('[data-kact]');
        if (a) {
          const k = a.dataset.kact;
          if (k === 'hide') {
            this.pinned = false;
            this.hide();
          } else {
            const d = k === 'up' ? 12 : -12;
            if (this.lo + d >= 21 && this.hi + d <= 108) {
              this.lo += d;
              this.hi += d;
              this.render();
            }
          }
          return;
        }
        const key = e.target.closest('.k');
        if (!key) return;
        e.preventDefault();
        Sound.unlock();
        const m = +key.dataset.m;
        try {
          key.setPointerCapture(e.pointerId);
        } catch (err) {}
        press.set(e.pointerId, m);
        Input.sendBytes([0x90, m, 90], kind());
        if (S.settings.touchSound) Sound.tone(m);
      });
      const up = (e) => {
        const m = press.get(e.pointerId);
        if (m == null) return;
        press.delete(e.pointerId);
        Input.sendBytes([0x80, m, 0], kind());
      };
      this.el.addEventListener('pointerup', up);
      this.el.addEventListener('pointercancel', up);
      Input.on((ev) => {
        if (!this.visible || (ev.type !== 'noteon' && ev.type !== 'noteoff')) return;
        const k = this.el.querySelector(`.k[data-m="${ev.midi}"]`);
        if (k) k.classList.toggle('down', ev.type === 'noteon');
      });
    },
  };
  /** Plage du clavier à l'écran adaptée à une clé (au moins deux octaves). */
  function rangeFor(clef, ledger = 2) {
    const c = C.noteCandidates({ clef, ledger, accidentals: false });
    const lo = Math.min(...c.map((x) => x.midi));
    const hi = Math.max(...c.map((x) => x.midi));
    return [Math.floor(lo / 12) * 12, Math.max(Math.ceil(hi / 12) * 12, Math.floor(lo / 12) * 12 + 24)];
  }

      if (area) {
        area.focus();

        try {
          if (document.execCommand('copy')) {
            toast('Copié dans le presse-papiers');

  async function saveFile(filename, text, mime) {
    if (downloadsCap) {
      try {
        await downloadsCap.save({ filename, data: text });
        toast('Fichier enregistré');
        return true;
      } catch (e) {
        if (e && e.code === 'declined') {
          toast('Enregistrement annulé');
          return false;
        }
      }
    }
    if (!(window.claude && typeof window.claude.use === 'function')) {
      try {
        const blob = new Blob([text], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);

  /* =====================================================================
     4. EXERCICES

  /* ---------- 4.1 Reconnaissance des notes (mode flux) ---------- */
  function NoteDrill(root, opts) {
    root = freshHost(root);
    const o = Object.assign({ mode: 'free', drill: { ...effDrill() }, durationMs: null, count: null, onUpdate: null, onDone: null, clockMs: null }, opts);
    const rng = C.rngFrom((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
    const st = { item: null, attempts: [], count: 0, errors: 0, lastKey: null, lastMidi: null, paused: false, done: false, ignoreUntil: 0, flash: 0, startedAt: performance.now(), firstShown: null, lastOk: null, clefShown: null };
    DEBUG.drill = st;
    const src = () => Input.activeSource(S.settings.input);
    const tolerant = () => src() === 'mic' && S.settings.octaveTolerance;
    const elapsed = () => (o.clockMs ? o.clockMs() : performance.now() - st.startedAt);
    const prev = previousNotes();

    root.innerHTML = `<div class="drill">
      <div class="drill-head"><p class="drill-set" id="dr-set"></p>
        ${o.mode === 'diag' ? '' : `<button type="button" class="btn ghost sm" data-act="tune">${icon('sliders', 20)}<span>Régler</span></button>`}</div>
      <div class="paper stage" id="dr-stage"><div class="pause-veil" id="dr-veil" hidden>En pause</div></div>
      <p class="feedback" id="dr-fb" aria-live="polite">Joue la note affichée${src() === 'touch' ? ' sur le clavier à l’écran' : ''}.</p>
      <div class="metrics" id="dr-metrics"></div>
      ${o.mode === 'free' ? `<div class="row end"><button type="button" class="btn secondary" data-act="finish">${icon('check', 20)}<span>Terminer</span></button></div>` : ''}
    </div>`;
    const stage = $('#dr-stage', root);

    function clefFor() {
      const m = o.drill.clefMode;
      if (m === 'treble' || m === 'bass') return m;
      if (m === 'both') return rng() < 0.5 ? 'treble' : 'bass';
      const first = m === 'sol>fa' ? 'treble' : 'bass';
      const second = first === 'bass' ? 'treble' : 'bass';
      if (o.durationMs) return elapsed() < o.durationMs / 2 ? first : second;
      return Math.floor(st.count / 12) % 2 === 0 ? first : second;
    }
    const staffFor = (clef) => (o.drill.clefMode === 'both' ? 'grand' : clef);
    function newItem() {
      const v = o.drill.variant;
      const chord = v === 'accords' || (v === 'mix' && rng() < 0.3);
      const clef = clefFor();
      if (chord) {
        const m = C.genMotif(rng, { clef, phase: phaseNow(), kind: 'mix' });
        return { kind: 'chord', clef, notes: m.notes, label: m.label, midis: m.notes.map((n) => n.midi), matcher: new C.ChordMatcher(m.notes.map((n) => n.midi), { octaveTolerant: tolerant() }), errors: 0 };
      }
      const cands = C.noteCandidates({ clef, ledger: o.drill.ledger, accidentals: o.drill.accidentals });
      const c = C.pickWeighted(cands, S.stats, rng, { avoidKey: st.lastKey, avoidMidi: st.lastMidi });
      return { kind: 'note', clef, notes: [c], key: c.key, midi: c.midi, errors: 0 };
    }
    function show(cls = '') {
      const it = st.item;
      if (!it) return;
      const veil = $('#dr-veil', root);
      const label = it.kind === 'note' ? 'Note à jouer' : 'Intervalle ou accord à jouer';
      stage.innerHTML = N.card({ staff: staffFor(it.clef), notes: it.notes.map((n) => ({ ...n, clef: it.clef, cls })), S: sizes().card, width: sizes().card * 15, ariaLabel: label });
      stage.appendChild(veil);
      stage.dataset.target = it.kind === 'note' ? String(it.midi) : it.midis.join(',');
      stage.dataset.kind = it.kind;
    }
    function next() {
      st.item = newItem();
      st.lastKey = st.item.key || null;
      st.lastMidi = st.item.midi != null ? st.item.midi : null;
      show();
      st.item.shownAt = performance.now();
      if (st.firstShown == null) st.firstShown = st.item.shownAt;
      if (st.clefShown !== st.item.clef && o.drill.clefMode !== 'both') {
        if (st.clefShown) setFb(st.item.clef === 'treble' ? 'Clé de sol maintenant.' : 'Clé de fa maintenant.', 'info');
        st.clefShown = st.item.clef;
      }
      const range = o.drill.clefMode === 'both' ? [36, 84] : rangeFor(st.item.clef, Math.max(o.drill.ledger, 1));
      if (st.kbdRange !== range.join('-')) {
        st.kbdRange = range.join('-');
        Kbd.auto(range[0], range[1]);
      }
      $('#dr-set', root).textContent = drillSummary(o.drill);
    }
    function setFb(msg, kind = '') {
      const fb = $('#dr-fb', root);
      fb.textContent = msg;
      fb.className = 'feedback ' + kind;
    }
    function success(t) {
      const it = st.item;
      const rt = Math.max(0, Math.round(t - it.shownAt));
      const base = { rt, errors: it.errors, ts: Date.now(), date: today(), src: src(), mode: o.mode };
      const a = it.kind === 'note' ? { kind: 'note', clef: it.clef, key: it.key, midi: it.midi, ...base } : { kind: 'chord', clef: it.clef, midis: it.midis, label: it.label, ...base };
      st.attempts.push(a);
      recordAttempt(a);
      st.count++;
      st.lastOk = t;
      show('n-ok');
      setFb(it.kind === 'chord' ? `Juste : ${it.label}` : `Juste : ${nl(it.notes[0])}`, 'ok');
      st.ignoreUntil = t + 60;
      update();
      if (o.count && st.count >= o.count) return finish();
      clearTimeout(st.flash);
      st.flash = setTimeout(() => {
        if (!st.done && !st.paused) next();
      }, 170);
    }
    function fail(midi) {
      const it = st.item;
      it.errors++;
      st.errors++;
      show('n-bad');
      let msg = `Tu as joué ${nlm(midi)}.`;
      if (it.errors >= 2) msg += it.kind === 'chord' ? ` Réponse : ${it.notes.map(nl).join(' – ')} (${it.label}).` : ` C’est un ${nl(it.notes[0])}.`;
      setFb(msg, 'bad');
      update();
      clearTimeout(st.flash);
      st.flash = setTimeout(() => {
        if (!st.done) show('');
      }, 700);
    }
    const off = Input.on((ev) => {
      if (ev.type !== 'noteon' || st.paused || st.done || !st.item) return;
      if (ev.t < st.ignoreUntil) return;
      const it = st.item;
      if (it.kind === 'note') {
        const ok = ev.midi === it.midi || (tolerant() && (((ev.midi - it.midi) % 12) + 12) % 12 === 0);
        if (ok) success(ev.t);
        else fail(ev.midi);
      } else {
        const r = it.matcher.feed(ev.midi, ev.t);
        if (r.status === 'correct') success(ev.t);
        else if (r.status === 'wrong') fail(ev.midi);
        else setFb(`${r.have} note${r.have > 1 ? 's' : ''} sur ${r.need}…`, 'info');
      }
    });
    function summary() {
      const s = C.summarizeAttempts(st.attempts);
      const slow = st.attempts.filter((a) => a.kind === 'note').sort((a, b) => b.rt - a.rt).slice(0, 3).map((a) => ({ key: a.key, rt: a.rt }));
      return { ...s, total: st.count, errors: st.errors, slowest: slow };
    }
    function metric(label, value, sub = '', good = false) {
      return `<div class="metric${good ? ' good' : ''}"><span class="lab">${label}</span><b>${value}</b>${sub ? `<span class="sub">${sub}</span>` : ''}</div>`;
    }
    function update() {
      const s = C.summarizeAttempts(st.attempts);
      const cmp = (cur, old) => (cur != null && old != null && cur < old ? 'record' : '');
      let h = metric('Notes', st.count) + metric('Erreurs', st.errors);
      for (const [k, lab] of [['treble', 'Clé de sol'], ['bass', 'Clé de fa']]) {
        const y = prev && prev[k] && prev[k].meanRt;
        const better = cmp(s[k].meanRt, y);
        h += metric(lab, fmtSec(s[k].meanRt), y ? `Hier ${fmtSec(y)}${better ? ' · record battu' : ''}` : 'par note', !!better);
      }
      if (s.chord.count) h += metric('Accords', fmtSec(s.chord.meanRt), `${s.chord.count} joués`);
      $('#dr-metrics', root).innerHTML = h;
      if (o.onUpdate) o.onUpdate(summary());
    }
    function finish() {
      st.done = true;
      clearTimeout(st.flash);
      flushAttempts();
      const s = summary();
      const result = { ...s, totalMs: st.lastOk != null && st.firstShown != null ? Math.round(st.lastOk - st.firstShown) : null, count: st.count };
      if (o.onDone) return o.onDone(result);
      const slow = s.slowest.map((x) => {
        const n = C.parseNoteKey(x.key);
        return n ? `${nl(n)} (${fmtSec(x.rt)})` : '';
      });
      stage.innerHTML = `<div class="done-card"><p class="eyebrow">Exercice terminé</p><p class="big-num">${st.count}<small> notes</small></p><p>${st.errors} erreur${st.errors > 1 ? 's' : ''}${slow.length ? ` · plus lentes : ${slow.join(', ')}` : ''}</p></div>`;
      setFb('');
      Kbd.hide();
      const btn = root.querySelector('[data-act="finish"]');
      if (btn) btn.outerHTML = `<button type="button" class="btn primary" data-act="restart">${icon('refresh', 20)}<span>Recommencer</span></button>`;
    }
    function tune() {
      const d = { ...o.drill };
      const m = modal({
        title: 'Réglages de l’exercice',
        body: `<div class="form">
          <div class="field"><span class="lab">Clés</span>${chipsHTML('clefMode', Object.entries(CLEF_MODES), d.clefMode)}</div>
          <div class="field"><span class="lab">Lignes supplémentaires</span>${chipsHTML('ledger', [[0, 'Aucune'], [1, '1'], [2, '2'], [3, '3']], d.ledger)}</div>
          <div class="field"><span class="lab">Altérations</span>${chipsHTML('accidentals', [['false', 'Non'], ['true', 'Dièses et bémols']], String(d.accidentals))}</div>
          <div class="field"><span class="lab">Contenu</span>${chipsHTML('variant', Object.entries(VARIANTS), d.variant)}</div></div>`,
        actions: [
          { label: 'Annuler', kind: 'ghost' },
          ...(o.mode === 'session' ? [{ label: 'Garder pour la semaine', act: () => { apply(true); } }] : []),
          { label: 'Appliquer', kind: 'primary', act: () => apply(false) },
        ],
      });
      wireChips(m.el, (k, v) => {
        if (k === 'ledger') d.ledger = +v;
        else if (k === 'accidentals') d.accidentals = v === 'true';
        else d[k] = v;
      });
      function apply(forWeek) {
        o.drill = d;
        if (opts.onDrill) opts.onDrill(d);
        if (forWeek) {
          C.weekOf(S.program, effWeek()).drill = { ...d };
          persist('program');
          toast('Réglage gardé pour la semaine ' + effWeek());
        }
        st.clefShown = null;
        next();
      }
    }
    root.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      if (a.dataset.act === 'tune') tune();
      if (a.dataset.act === 'finish') finish();
      if (a.dataset.act === 'restart') go(view, params);
    });
    next();
    update();
    const api = {
      pause() {
        st.paused = true;
        $('#dr-veil', root).hidden = false;
      },
      resume() {
        st.paused = false;
        $('#dr-veil', root).hidden = true;
        if (st.item) st.item.shownAt = performance.now();
      },
      destroy() {
        st.done = true;
        clearTimeout(st.flash);
        off();
        flushAttempts();
      },
      summary,
    };
    return api;
  }
  /** Réglages de l'exercice de notes de la semaine en cours. */
  const effDrill = () => ({ ...C.weekOf(S.program, effWeek()).drill });

  /* ---------- 4.2 Lecteur de pièce : analyse, décompte, jeu au métronome, bilan ---------- */
  const METERS = ['2/4', '3/4', '4/4', '6/8', '3/8', '2/2'];
  function PieceRunner(root, opts) {
    root = freshHost(root);
    const o = Object.assign({ piece: { label: 'Pièce libre', meter: '' }, index: 0, total: 1, tempoQ: S.settings.tempoQ, mode: 'reading', analyseSec: S.settings.analyseSec, onFinish: null, onTempo: null, fixedTempo: false }, opts);
    const st = { phase: o.mode === 'rhythm' ? 'ready' : 'analyse', meter: o.piece.meter || o.lastMeter || '4/4', tempoQ: o.tempoQ, remain: o.analyseSec * 1000, aStart: performance.now(), onsets: [], glances: 0, liveStops: 0, inGap: false, lastOnset: null, metro: null, t0: 0, beatMs: 1000, timers: [], checks: new Set(), result: null, chimed: false };
    DEBUG.piece = st;
    const src = () => Input.activeSource(S.settings.input);
    const measured = () => src() !== 'touch' || S.settings.simulator || Kbd.visible;
    function clearTimers() {
      st.timers.forEach((t) => clearInterval(t));
      st.timers = [];
    }
    function head() {
      return `<div class="pr-head"><div><p class="eyebrow">${o.mode === 'rhythm' ? 'Rythme de la pièce' : o.total > 1 ? `Pièce ${o.index + 1} sur ${o.total}` : 'Pièce'}</p><h3 class="pr-title">${esc(o.piece.label)}</h3></div>
        <div class="pr-tempo">${tempoHTML(st.tempoQ, st.meter, 9)}<span class="muted">${st.meter}</span></div></div>`;
    }
    function renderAnalyse() {
      clearTimers();
      const checks = [['armure', 'Armure'], ['mesure', 'Mesure'], ['rythme', 'Rythme de la 1re ligne'], ['passages', 'Passages délicats']];
      root.innerHTML = `<div class="pr">${head()}
        <div class="analyse">
          <div class="ring" id="pr-ring" role="timer" aria-label="Temps d’analyse restant">
            <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-bg" cx="60" cy="60" r="52"/><circle class="ring-fg" id="pr-ringfg" cx="60" cy="60" r="52" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg>
            <div class="ring-txt"><b id="pr-remain">${Math.ceil(st.remain / 1000)}</b><span>s d’analyse</span></div>
          </div>
          <div class="analyse-side">
            <ul class="checklist">${checks.map(([k, l]) => `<li><button type="button" class="check${st.checks.has(k) ? ' on' : ''}" data-check="${k}" aria-pressed="${st.checks.has(k)}">${icon('check', 20)}<span>${l}</span></button></li>`).join('')}</ul>
            <div class="field"><span class="lab">Mesure</span>${chipsHTML('meter', METERS.map((m) => [m, m]), st.meter)}</div>
            ${o.fixedTempo ? `<p class="muted">Tempo fixé pour ce test : ${tempoHTML(st.tempoQ, st.meter, 8)}</p>` : `<div class="field"><span class="lab">Tempo du jour (noire)</span>${stepperHTML('pr-tempo', st.tempoQ, { min: 30, max: 200, step: 2, label: 'le tempo' })}</div>`}
          </div>
        </div>
        <div class="actions"><button type="button" class="btn primary big" data-act="go">${icon('play', 22)}<span>Lancer le décompte</span></button><button type="button" class="btn ghost" data-act="skip">Passer l’analyse</button></div>
        ${S.settings.pedalStart && src() === 'midi' ? '<p class="hint">La pédale de sustain lance aussi le décompte.</p>' : ''}
      </div>`;
      wireChips(root.firstElementChild, (k, v) => {
        st.meter = v;
        root.querySelector('.pr-tempo').innerHTML = `${tempoHTML(st.tempoQ, st.meter, 9)}<span class="muted">${st.meter}</span>`;
      });
      if (!o.fixedTempo) {
        wireSteppers(root.firstElementChild, (id, v) => {
          st.tempoQ = v;
          if (o.onTempo) o.onTempo(v);
          root.querySelector('.pr-tempo').innerHTML = `${tempoHTML(st.tempoQ, st.meter, 9)}<span class="muted">${st.meter}</span>`;
        });
      }
      st.aStart = performance.now() - (o.analyseSec * 1000 - st.remain);
      st.timers.push(
        setInterval(() => {
          st.remain = Math.max(0, o.analyseSec * 1000 - (performance.now() - st.aStart));
          const r = $('#pr-remain', root);
          if (!r) return;
          r.textContent = Math.ceil(st.remain / 1000);
          $('#pr-ringfg', root).setAttribute('stroke-dashoffset', String(100 - (100 * st.remain) / (o.analyseSec * 1000)));
          if (st.remain <= 0 && !st.chimed) {
            st.chimed = true;
            Sound.chime();
            root.querySelector('[data-act="go"]').classList.add('pulse');
          }
        }, 200),
      );
    }
    function renderReady() {
      root.innerHTML = `<div class="pr">${head()}
        <p class="lead">Joue le rythme de la pièce sur une seule touche, en comptant à voix haute. Le métronome donne une mesure de décompte.</p>
        <div class="field"><span class="lab">Mesure</span>${chipsHTML('meter', METERS.map((m) => [m, m]), st.meter)}</div>
        <div class="actions"><button type="button" class="btn primary big" data-act="go">${icon('play', 22)}<span>Lancer le décompte</span></button></div></div>`;
      wireChips(root.firstElementChild, (k, v) => (st.meter = v));
    }
    async function start() {
      clearTimers();
      await Sound.unlock();
      st.phase = 'play';
      st.onsets = [];
      st.liveStops = 0;
      st.inGap = false;
      st.lastOnset = null;
      const mi = C.meterInfo(st.meter);
      root.innerHTML = `<div class="pr play">${head()}
        <p class="never">Ne jamais s’arrêter ni corriger.</p>
        <div class="beat-wrap"><div class="beat count" id="pr-beat" aria-live="off">1</div><p class="beat-sub" id="pr-sub">Décompte</p></div>
        <div class="metrics three">
          <div class="metric" id="pr-stopbox"><span class="lab">Arrêts</span><b id="pr-stops">0</b><span class="sub">${measured() ? `silence de plus de ${S.settings.stopBeats} temps` : 'à saisir après la pièce'}</span></div>
          <div class="metric"><span class="lab">Temps de jeu</span><b id="pr-time">0:00</b></div>
          <div class="metric"><span class="lab">Coups d’œil</span><b id="pr-gl">0</b></div>
        </div>
        <div class="actions">${o.mode === 'reading' || o.mode === 'free' ? `<button type="button" class="btn secondary big" data-act="glance">${icon('eye', 22)}<span>+1 coup d’œil</span></button>` : ''}<button type="button" class="btn primary big" data-act="end">${icon('check', 22)}<span>${o.mode === 'rhythm' ? 'Terminé' : 'Pièce terminée'}</span></button></div>
        <p class="hint">${src() === 'midi' ? 'Arrêts et régularité mesurés par le MIDI.' : src() === 'mic' ? 'Arrêts et régularité estimés au micro.' : 'Sans MIDI ni micro, tu saisis les arrêts toi-même à la fin.'}</p></div>`;
      st.metro = new Sound.Metronome();
      const m = st.metro.start({
        tempoQ: st.tempoQ,
        meter: st.meter,
        countInBars: 1,
        subdivide: S.settings.metroSubdivide,
        volume: S.settings.metroVolume,
        onTick: (e) => {
          if (e.kind === 'sub') return;
          const b = $('#pr-beat', root);
          if (!b) return;
          b.textContent = String(e.beat + 1);
          b.classList.toggle('count', e.countIn);
          b.classList.toggle('downbeat', e.kind === 'bar');
          b.classList.remove('hit');
          void b.offsetWidth;
          b.classList.add('hit');
          $('#pr-sub', root).textContent = e.countIn ? 'Décompte' : `Mesure ${e.bar + 1}`;
        },
      });
      if (!m) {
        toast('Son indisponible : le métronome ne peut pas démarrer');
        return;
      }
      st.t0 = st.metro.t0Perf;
      st.beatMs = st.metro.beatMs;
      st.startPerf = st.metro.startPerf;
      void mi;
      const limit = (S.settings.stopBeats + 0.25) * st.beatMs;
      st.timers.push(
        setInterval(() => {
          const now = performance.now();
          const t = $('#pr-time', root);
          if (t) t.textContent = clock(Math.max(0, now - st.t0));
          if (st.lastOnset != null && !st.inGap && now - st.lastOnset > limit) {
            st.inGap = true;
            st.liveStops++;
            const s = $('#pr-stops', root);
            if (s) s.textContent = st.liveStops;
            const box = $('#pr-stopbox', root);
            if (box) box.classList.add('alert');
          }
        }, 100),
      );
    }
    const offIn = Input.on((ev) => {
      if (st.phase === 'analyse' && ev.type === 'cc' && ev.controller === 64 && ev.value >= 64 && S.settings.pedalStart) {
        start();
        return;
      }
      if (st.phase !== 'play') return;
      const isOnset = (ev.type === 'noteon' && ev.source !== 'mic') || (ev.type === 'onset' && ev.source === 'mic');
      if (!isOnset) return;
      if (ev.t < st.t0 - st.beatMs * 1.05) return; // décompte (on garde la dernière noire : levée)
      st.onsets.push(ev.t);
      if (st.inGap) {
        st.inGap = false;
        const box = $('#pr-stopbox', root);
        if (box) box.classList.remove('alert');
      }
      st.lastOnset = ev.t;
    });
    function end() {
      clearTimers();
      if (st.metro) st.metro.stop();
      st.endPerf = performance.now();
      const stops = C.detectStops(st.onsets, st.beatMs, S.settings.stopBeats);
      const mi = C.meterInfo(st.meter);
      const reg = C.regularity(st.onsets, { t0: st.t0, beatMs: st.beatMs, subdiv: mi.subdiv, latencyMs: S.settings.latencyMs });
      const hasData = st.onsets.length >= 2;
      st.result = {
        stopsAuto: hasData ? stops.count : null,
        stops: hasData ? stops.count : 0,
        wrong: 0,
        glances: st.glances,
        regMs: hasData ? reg.meanAbs : null,
        inGridPct: hasData ? reg.inGridPct : null,
        durationMs: Math.round(st.endPerf - st.t0),
        playMs: hasData ? Math.round(stops.playMs) : null,
        onsets: stops.onsets,
      };
      st.phase = 'review';
      renderReview();
    }
    function renderReview() {
      const r = st.result;
      root.innerHTML = `<div class="pr review">${head()}
        <div class="review-grid">
          <div class="field"><span class="lab">Arrêts</span>${stepperHTML('rv-stops', r.stops, { min: 0, max: 30, label: 'les arrêts', big: true })}<span class="sub">${r.stopsAuto != null ? `mesurés : ${r.stopsAuto}` : 'aucune mesure : saisis-les'}</span></div>
          ${o.mode === 'rhythm' ? '' : `<div class="field"><span class="lab">Fausses notes (estimation)</span>${stepperHTML('rv-wrong', 0, { min: 0, max: 60, label: 'les fausses notes', big: true })}<span class="sub">ton estimation</span></div>`}
          ${o.mode === 'rhythm' ? '' : `<div class="field"><span class="lab">Coups d’œil au clavier</span>${stepperHTML('rv-gl', r.glances, { min: 0, max: 60, label: 'les coups d’œil', big: true })}</div>`}
        </div>
        <dl class="facts">
          <div><dt>Régularité</dt><dd>${r.regMs != null ? `écart moyen ${r.regMs} ms · ${r.inGridPct} % des attaques dans la pulsation` : '—'}</dd></div>
          <div><dt>Durée</dt><dd>${fmtDur(r.durationMs)}${r.playMs != null ? `, dont ${fmtDur(r.playMs)} de jeu effectif` : ''}</dd></div>
          <div><dt>Attaques détectées</dt><dd>${r.onsets}</dd></div>
        </dl>
        <div class="actions"><button type="button" class="btn primary big" data-act="validate">${icon('check', 22)}<span>Valider</span></button><button type="button" class="btn ghost" data-act="redo">Recommencer la pièce</button></div></div>`;
      wireSteppers(root.firstElementChild, () => {});
    }
    root.addEventListener('click', (e) => {
      const ck = e.target.closest('[data-check]');
      if (ck) {
        const k = ck.dataset.check;
        if (st.checks.has(k)) st.checks.delete(k);
        else st.checks.add(k);
        ck.classList.toggle('on', st.checks.has(k));
        ck.setAttribute('aria-pressed', st.checks.has(k));
        return;
      }
      const a = e.target.closest('[data-act]');
      if (!a) return;
      const act = a.dataset.act;
      if (act === 'go' || act === 'skip') start();
      else if (act === 'glance') {
        st.glances++;
        const g = $('#pr-gl', root);
        if (g) g.textContent = st.glances;
      } else if (act === 'end') end();
      else if (act === 'redo') {
        st.glances = 0;
        st.phase = o.mode === 'rhythm' ? 'ready' : 'analyse';
        st.remain = 0;
        if (o.mode === 'rhythm') renderReady();
        else renderAnalyse();
      } else if (act === 'validate') {
        const res = { ...st.result, stops: stepVal(root, 'rv-stops'), meter: st.meter, tempoQ: st.tempoQ, completed: true };
        if (o.mode !== 'rhythm') {
          res.wrong = stepVal(root, 'rv-wrong');
          res.glances = stepVal(root, 'rv-gl');
        }
        if (o.onFinish) o.onFinish(res);
      }
    });
    if (st.phase === 'analyse') renderAnalyse();
    else renderReady();
    return {
      destroy() {
        clearTimers();
        if (st.metro) st.metro.stop();
        offIn();
      },
      get phase() {
        return st.phase;
      },
    };
  }

  /* ---------- 4.3 Déchiffrage du soir : 3 pièces, bilan, règle de tempo ---------- */
  function ReadingBlock(root, { draft, onChange }) {
    root = freshHost(root);
    if (!draft.reading) draft.reading = { tempoQ: S.settings.tempoQ, pieces: todayPieces().map((p) => ({ ...p, status: 'todo' })) };
    const R = draft.reading;
    let child = null;
    root.innerHTML = `<div class="reading"><p class="never-strip">Ne jamais s’arrêter ni corriger.</p><div class="piece-rail" id="rd-rail"></div><div id="rd-body"></div></div>`;
    const body = $('#rd-body', root);
    function rail() {
      $('#rd-rail', root).innerHTML = R.pieces.length
        ? R.pieces
            .map((p, i) => `<div class="pc ${p.status === 'done' ? 'done' : i === current() ? 'cur' : ''}"><span class="pc-n">${p.status === 'done' ? icon('check', 16) : i + 1}</span><span class="pc-txt"><span class="pc-l">${esc(p.short || p.label)}</span>${p.status === 'done' ? `<span class="pc-r">${p.stops} arrêt${p.stops > 1 ? 's' : ''} · ${p.wrong} fausse${p.wrong > 1 ? 's' : ''} note${p.wrong > 1 ? 's' : ''}</span>` : `<span class="pc-r">${i === current() ? 'en cours' : 'à lire'}</span>`}</span></div>`)
            .join('')
        : '';
    }
    const current = () => R.pieces.findIndex((p) => p.status !== 'done');
    function kill() {
      if (child && child.destroy) child.destroy();
      child = null;
    }
    function step() {
      kill();
      rail();
      const i = current();
      if (!R.pieces.length) return empty();
      if (i < 0) return summary();
      const p = R.pieces[i];
      child = PieceRunner(body, {
        piece: p,
        index: i,
        total: R.pieces.length,
        tempoQ: R.tempoQ,
        lastMeter: i > 0 ? R.pieces[i - 1].meter : '',
        onTempo: (v) => {
          R.tempoQ = v;
          onChange();
        },
        onFinish: (res) => {
          Object.assign(p, res, { status: 'done' });
          onChange();
          step();
        },
      });
    }
    function empty() {
      body.innerHTML = `<div class="empty"><p class="lead">Aucune pièce n’est prévue pour cette semaine.</p>
        <p class="muted">Renseigne le recueil et les numéros dans Programme, ou ajoute une pièce pour ce soir.</p>
        <div class="row"><input class="input" id="rd-free" placeholder="Pièce de ce soir (ex. Schumann, op. 68 n° 3)" aria-label="Pièce de ce soir"><button type="button" class="btn primary" data-act="add">${icon('plus', 20)}<span>Ajouter</span></button></div>
        <div class="row"><button type="button" class="btn secondary" data-act="program">${icon('calendar', 20)}<span>Ouvrir le programme</span></button><button type="button" class="btn secondary" data-act="bonus">${icon('spark', 20)}<span>Déchiffrage généré</span></button></div></div>`;
    }
    function summary() {
      const done = R.pieces.filter((p) => p.status === 'done');
      const r = C.nextTempo(R.tempoQ, done, { step: S.settings.tempoStep });
      R.nextTempoQ = r.tempo;
      R.rule = r.rule;
      onChange();
      const why = { up: `Les ${done.length} pièces sont passées sans arrêt, avec 2 fausses notes au plus : +${S.settings.tempoStep}.`, down: `Une pièce a eu plus de 2 arrêts : −${S.settings.tempoStep}.`, same: 'Ni toutes les pièces sans arrêt, ni plus de 2 arrêts dans une pièce : tempo inchangé.' }[r.rule];
      body.innerHTML = `<div class="summary">
        <div class="table-wrap"><table class="tbl"><thead><tr><th>Pièce</th><th>Mesure</th><th class="num">Arrêts</th><th class="num">Fausses notes</th><th class="num">Régularité</th><th class="num">Coups d’œil</th></tr></thead>
        <tbody>${done.map((p) => `<tr><td>${esc(p.short || p.label)}</td><td>${p.meter}</td><td class="num">${p.stops}</td><td class="num">${p.wrong}</td><td class="num">${p.regMs != null ? p.regMs + ' ms' : '—'}</td><td class="num">${p.glances || 0}</td></tr>`).join('')}</tbody></table></div>
        <div class="verdict ${r.rule}"><p class="eyebrow">Tempo de la prochaine séance</p><p class="verdict-main">${tempoHTML(r.tempo, '4/4', 10)}<span class="delta">${r.rule === 'up' ? '+' + S.settings.tempoStep : r.rule === 'down' ? '−' + S.settings.tempoStep : '='}</span></p><p class="muted">${why}</p></div>
        <div class="row">${phaseNow() === 2 ? `<button type="button" class="btn secondary" data-act="impro">${icon('note', 20)}<span>Impro de 5 min dans la tonalité</span></button>` : ''}
        <button type="button" class="btn secondary" data-act="bonus">${icon('spark', 20)}<span>Bonus : déchiffrage généré</span></button>
        <button type="button" class="btn ghost" data-act="more">${icon('plus', 20)}<span>Ajouter une pièce</span></button></div></div>`;
    }
    function bonus() {
      kill();
      body.innerHTML = `<div class="row"><button type="button" class="btn ghost" data-act="back">${icon('back', 20)}<span>Retour au déchiffrage</span></button></div><div id="rd-gen"></div>`;
      child = GeneratedReader($('#rd-gen', root), {
        tempoQ: R.tempoQ,
        onResult: (res) => {
          draft.generated = (draft.generated || []).concat(res);
          onChange();
        },
      });
    }
    function impro() {
      kill();
      child = ImproTimer(body, { onBack: step });
    }
    root.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act]');
      if (!a || !root.contains(a)) return;
      const act = a.dataset.act;
      if (act === 'bonus') bonus();
      else if (act === 'back') step();
      else if (act === 'impro') impro();
      else if (act === 'program') go('program');
      else if (act === 'add' || act === 'more') {
        const inp = $('#rd-free', root);
        const label = inp && inp.value.trim() ? inp.value.trim() : `Pièce libre ${R.pieces.length + 1}`;
        R.pieces.push({ id: 'libre:' + uid(), num: '', label, short: label, meter: '', status: 'todo' });
        onChange();
        step();
      }
    });
    step();
    return { destroy: kill };
  }

  /* ---------- 4.4 Improvisation (phase 2) ---------- */
  function ImproTimer(root, { onBack }) {
    root = freshHost(root);
    const keys = ['C', 'G', 'F', 'D', 'Bb', 'A', 'Eb'];
    const key = keys[Math.floor(Math.random() * keys.length)];
    const total = 5 * 60000;
    const start = performance.now();
    const deg = (d) => C.noteLabel(C.degreeNote(key, d, 4), { withOct: false });
    root.innerHTML = `<div class="impro"><p class="eyebrow">Phase 2 · 5 minutes</p><h3 class="display-sm">Improvise en ${C.KEY_NAMES[key]}</h3>
      <p class="lead">Main gauche : les accords I – IV – V – I, une blanche par accord. Main droite : une mélodie libre sur la gamme. Garde la pulsation.</p>
      <ol class="degrees"><li><b>I</b> ${deg(0)}–${deg(2)}–${deg(4)}</li><li><b>IV</b> ${deg(3)}–${deg(5)}–${deg(0)}</li><li><b>V</b> ${deg(4)}–${deg(6)}–${deg(1)}</li><li><b>I</b> ${deg(0)}–${deg(2)}–${deg(4)}</li></ol>
      <p class="big-clock" id="im-clock">5:00</p><div class="row"><button type="button" class="btn ghost" data-act="iback">${icon('back', 20)}<span>Retour</span></button></div></div>`;
    const t = setInterval(() => {
      const left = total - (performance.now() - start);
      const el = $('#im-clock', root);
      if (el) el.textContent = clock(left);
      if (left <= 0) {
        clearInterval(t);
        Sound.chime();
      }
    }, 250);
    root.addEventListener('click', (e) => {
      if (e.target.closest('[data-act="iback"]')) {
        clearInterval(t);
        onBack();
      }
    });
    return { destroy: () => clearInterval(t) };
  }

  /* ---------- 4.5 Rythme : une cellule, jouée sur une touche au métronome ---------- */
  function RhythmTrainer(root, opts) {
    root = freshHost(root);
    const o = Object.assign({ level: phaseNow() || 1, meter: null, tempoQ: S.settings.tempoQ, onUpdate: null }, opts);
    const meters = o.level === 1 ? ['4/4', '3/4', '2/4'] : ['4/4', '3/4', '2/4', '6/8'];
    const st = { meter: o.meter || meters[Math.floor(Math.random() * meters.length)], tempoQ: Math.min(o.tempoQ, 96), cell: null, phase: 'idle', metro: null, onsets: [], t0: 0, timers: [], results: [], last: null };
    DEBUG.rhythm = st;
    const src = () => Input.activeSource(S.settings.input);
    root.innerHTML = `<div class="rhythm">
      <div class="opts">
        <div class="field"><span class="lab">Mesure</span>${chipsHTML('meter', meters.map((m) => [m, m]), st.meter)}</div>
        <div class="field"><span class="lab">Tempo (noire)</span>${stepperHTML('rh-tempo', st.tempoQ, { min: 40, max: 160, step: 4, label: 'le tempo' })}</div>
      </div>
      <div class="paper score-paper" id="rh-paper"></div>
      <p class="feedback" id="rh-fb" aria-live="polite">Lis la cellule, puis joue-la sur une seule touche après la mesure de décompte.</p>
      <button type="button" class="tap-pad" id="rh-pad" hidden>Tape ici</button>
      <div class="actions"><button type="button" class="btn secondary" data-act="listen">${icon('play', 20)}<span>Écouter le modèle</span></button><button type="button" class="btn primary big" data-act="play">${icon('metronome', 22)}<span>Jouer</span></button><button type="button" class="btn ghost" data-act="new">${icon('refresh', 20)}<span>Nouvelle cellule</span></button></div>
      <div class="history" id="rh-hist"></div></div>`;
    const paper = $('#rh-paper', root);
    function newCell() {
      st.cell = C.genRhythmCell({ meter: st.meter, level: o.level, bars: 2, seed: (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0 });
      st.last = null;
      draw();
      fb('Lis la cellule, puis joue-la sur une seule touche après la mesure de décompte.');
    }
    function draw(states) {
      let k = 0;
      const bars = [0, 1].map((b) => ({
        staves: [
          st.cell.events
            .filter((e) => e.bar === b)
            .map((e) => {
              const ev = { t: e.t, d: e.d, rest: e.rest, notes: [] };
              if (!e.rest) {
                const cls = states ? 'n-' + (states[k] === 'missed' ? 'miss' : states[k]) : '';
                ev.notes = [{ step: 6, oct: 4, alt: 0, id: 'r' + k, cls }];
                ev.cls = cls;
                k++;
              }
              return ev;
            }),
        ],
      }));
      const w = Math.max(320, Math.min(paper.clientWidth - 24 || 760, 980));
      const sc = N.score({ staves: [{ clef: 'perc' }], bars, meter: st.cell.meter, S: sizes().rhythm, width: w, above: 4.6, below: 3, justifyLast: true, ariaLabel: 'Cellule rythmique' });
      paper.innerHTML = sc.svg;
    }
    const fb = (m, k = '') => {
      const el = $('#rh-fb', root);
      el.textContent = m;
      el.className = 'feedback ' + k;
    };
    function stopAll() {
      st.timers.forEach(clearTimeout);
      st.timers = [];
      if (st.metro) st.metro.stop();
      st.phase = 'idle';
      $('#rh-pad', root).hidden = true;
    }
    async function listen() {
      stopAll();
      await Sound.unlock();
      st.metro = new Sound.Metronome();
      const m = st.metro.start({ tempoQ: st.tempoQ, meter: st.cell.meter, countInBars: 1, volume: S.settings.metroVolume * 0.6 });
      if (!m) return;
      const t0a = m.sched.t0;
      const q = 60 / st.tempoQ;
      C.rhythmExpected(st.cell).forEach((x) => Sound.click(t0a + x * q, 'wood', S.settings.metroVolume));
      const endMs = m.t0Perf + 2 * C.meterInfo(st.cell.meter).barQ * q * 1000 - performance.now();
      st.timers.push(setTimeout(stopAll, endMs + 200));
      fb('Écoute : le bois joue la cellule, le métronome bat la mesure.', 'info');
    }
    async function play() {
      stopAll();
      await Sound.unlock();
      st.onsets = [];
      st.metro = new Sound.Metronome();
      const m = st.metro.start({ tempoQ: st.tempoQ, meter: st.cell.meter, countInBars: 1, volume: S.settings.metroVolume });
      if (!m) return toast('Son indisponible');
      st.phase = 'play';
      st.t0 = m.t0Perf;
      const qMs = 60000 / st.tempoQ;
      const endT = st.t0 + 2 * C.meterInfo(st.cell.meter).barQ * qMs;
      fb('Décompte… puis joue la cellule.', 'info');
      if (src() === 'touch' && !S.settings.simulator) $('#rh-pad', root).hidden = false;
      st.timers.push(setTimeout(() => st.phase === 'play' && fb('À toi !', 'info'), st.t0 - performance.now()));
      st.timers.push(setTimeout(() => evaluate(endT, qMs), endT - performance.now() + qMs * 0.8));
    }
    function evaluate(endT, qMs) {
      const onsets = st.onsets.filter((t) => t >= st.t0 - qMs * 0.5 && t <= endT + qMs * 0.5);
      stopAll();
      const expected = C.rhythmExpected(st.cell).map((x) => st.t0 + x * qMs);
      const r = C.scoreTimed(expected, onsets, { quarterMs: qMs, latencyMs: S.settings.latencyMs });
      draw(r.items.map((i) => i.state));
      const devs = r.items.map((i) => (i.dev == null ? '×' : (i.dev > 0 ? '+' : '') + i.dev)).join(' · ');
      fb(`Score ${r.score} / 100 · ${r.onTimePct} % à l’heure${r.meanAbsDev != null ? ` · écart moyen ${r.meanAbsDev} ms` : ''}${r.extra ? ` · ${r.extra} attaque${r.extra > 1 ? 's' : ''} en trop` : ''}`, r.score >= 80 ? 'ok' : r.score >= 50 ? 'info' : 'bad');
      st.results.push({ score: r.score, meanAbsDev: r.meanAbsDev, onTimePct: r.onTimePct, meter: st.cell.meter, tempoQ: st.tempoQ, devs });
      hist();
      if (o.onUpdate) o.onUpdate({ attempts: st.results, best: Math.max(...st.results.map((x) => x.score)), mean: Math.round(C.mean(st.results.map((x) => x.score))) });
    }
    function hist() {
      $('#rh-hist', root).innerHTML = st.results.length
        ? `<p class="lab">Essais</p><ol class="tries">${st.results.map((r) => `<li><b>${r.score}</b><span>${r.meter} · ${r.devs} ms</span></li>`).join('')}</ol>`
        : '';
    }
    const off = Input.on((ev) => {
      if (st.phase !== 'play') return;
      if ((ev.type === 'noteon' && ev.source !== 'mic') || (ev.type === 'onset' && ev.source === 'mic')) st.onsets.push(ev.t);
    });
    const pad = $('#rh-pad', root);
    pad.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (st.phase === 'play') st.onsets.push(performance.now());
      pad.classList.remove('hit');
      void pad.offsetWidth;
      pad.classList.add('hit');
    });
    wireChips(root.firstElementChild, (k, v) => {
      st.meter = v;
      newCell();
    });
    wireSteppers(root.firstElementChild, (id, v) => (st.tempoQ = v));
    root.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      if (a.dataset.act === 'listen') listen();
      if (a.dataset.act === 'play') play();
      if (a.dataset.act === 'new') {
        stopAll();
        newCell();
      }
    });
    newCell();
    if (S.settings.simulator) Kbd.auto(60, 72);
    return {
      destroy() {
        stopAll();
        off();
      },
      get results() {
        return st.results;
      },
    };
  }

  /* ---------- 4.6 Motifs : intervalles et accords en moins de 2 s ---------- */
  function MotifTrainer(root, opts) {
    root = freshHost(root);
    const o = Object.assign({ phase: phaseNow() || 1, seconds: S.settings.motifSec, maxRounds: Infinity, onUpdate: null, onDone: null }, opts);
    const rng = C.rngFrom((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
    const st = { rounds: [], marks: [], item: null, deadline: 0, timer: null, phase: 'ready', done: false };
    DEBUG.motif = st;
    const src = () => Input.activeSource(S.settings.input);
    root.innerHTML = `<div class="motifs">
      <div class="motif-head"><p class="eyebrow" id="mo-round">Série 1</p><ol class="marks" id="mo-marks" aria-label="Résultats de la série"></ol></div>
      <div class="timebar"><span id="mo-bar"></span></div>
      <div class="paper stage" id="mo-stage"></div>
      <p class="feedback" id="mo-fb" aria-live="polite">Cinq motifs par série. Joue chacun en moins de ${o.seconds} s.</p>
      <div class="actions" id="mo-actions"><button type="button" class="btn primary big" data-act="start">${icon('play', 22)}<span>Commencer la série</span></button></div>
      <div class="history" id="mo-hist"></div></div>`;
    const stage = $('#mo-stage', root);
    const fb = (m, k = '') => {
      const el = $('#mo-fb', root);
      el.textContent = m;
      el.className = 'feedback ' + k;
    };
    function marks() {
      const l = st.marks.map((m) => `<li class="${m ? 'ok' : 'ko'}">${m ? icon('check', 16) : icon('close', 16)}</li>`);
      while (l.length < 5) l.push('<li></li>');
      $('#mo-marks', root).innerHTML = l.join('');
      $('#mo-round', root).textContent = `Série ${st.rounds.length + 1} · ${Math.min(st.marks.length + (st.phase === 'item' ? 1 : 0), 5)} / 5`;
    }
    function showItem(cls = '') {
      const it = st.item;
      stage.innerHTML = N.card({ staff: it.clef, notes: it.notes.map((n) => ({ ...n, clef: it.clef, cls })), S: sizes().card, width: sizes().card * 13, ariaLabel: 'Motif à jouer' });
      stage.dataset.target = it.notes.map((n) => n.midi).join(',');
    }
    function nextItem() {
      if (st.marks.length >= 5) return endRound();
      const clef = rng() < 0.5 ? 'treble' : 'bass';
      const m = C.genMotif(rng, { clef, phase: o.phase, kind: 'mix' });
      st.item = { ...m, clef, matcher: new C.ChordMatcher(m.notes.map((n) => n.midi), { octaveTolerant: src() === 'mic' && S.settings.octaveTolerance }) };
      st.phase = 'item';
      showItem();
      const [lo, hi] = rangeFor(clef, 1);
      Kbd.auto(lo, hi);
      st.deadline = performance.now() + o.seconds * 1000;
      const bar = $('#mo-bar', root);
      bar.style.transition = 'none';
      bar.style.width = '100%';
      void bar.offsetWidth;
      bar.style.transition = `width ${o.seconds}s linear`;
      bar.style.width = '0%';
      clearTimeout(st.timer);
      st.timer = setTimeout(() => resolve(false), o.seconds * 1000 + 30);
      fb('Joue le motif.', 'info');
      marks();
    }
    function resolve(ok) {
      if (st.phase !== 'item') return;
      clearTimeout(st.timer);
      st.phase = 'reveal';
      st.marks.push(ok);
      showItem(ok ? 'n-ok' : 'n-bad');
      fb(`${ok ? 'Juste' : 'Trop tard'} : ${st.item.label} (${st.item.notes.map(nl).join(' – ')})`, ok ? 'ok' : 'bad');
      marks();
      st.timer = setTimeout(nextItem, ok ? 650 : 1500);
    }
    function endRound() {
      const score = st.marks.filter(Boolean).length;
      st.rounds.push(score);
      st.marks = [];
      st.phase = 'ready';
      Kbd.hide();
      fb(`Série terminée : ${score} / 5.`, score >= 4 ? 'ok' : 'info');
      $('#mo-hist', root).innerHTML = `<p class="lab">Séries</p><ol class="tries">${st.rounds.map((r, i) => `<li><b>${r} / 5</b><span>série ${i + 1}</span></li>`).join('')}</ol>`;
      const summary = { rounds: st.rounds, first: st.rounds[0], mean: Math.round(C.mean(st.rounds) * 10) / 10 };
      if (o.onUpdate) o.onUpdate(summary);
      if (o.onDone && st.rounds.length >= o.maxRounds) {
        st.done = true;
        return o.onDone(score);
      }
      $('#mo-actions', root).innerHTML = `<button type="button" class="btn primary big" data-act="start">${icon('refresh', 22)}<span>Série suivante</span></button>`;
      marks();
    }
    const off = Input.on((ev) => {
      if (st.phase !== 'item' || ev.type !== 'noteon') return;
      const r = st.item.matcher.feed(ev.midi, ev.t);
      if (r.status === 'correct' && performance.now() <= st.deadline + 80) resolve(true);
      else if (r.status === 'wrong') fb(`Tu as joué ${nlm(ev.midi)}…`, 'bad');
    });
    root.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act="start"]');
      if (!a || st.done) return;
      $('#mo-actions', root).innerHTML = '';
      st.marks = [];
      nextItem();
    });
    stage.innerHTML = N.card({ staff: 'treble', notes: [{ step: 0, oct: 4, alt: 0, clef: 'treble' }, { step: 2, oct: 4, alt: 0, clef: 'treble' }, { step: 4, oct: 4, alt: 0, clef: 'treble' }], S: sizes().card, width: sizes().card * 13, ariaLabel: 'Exemple : accord de do majeur' });
    marks();
    return {
      destroy() {
        clearTimeout(st.timer);
        off();
      },
    };
  }

  /* ---------- 4.7 Déchiffrage généré : la pièce est connue, chaque note est évaluée ---------- */
  function GeneratedReader(root, opts) {
    root = freshHost(root);
    const o = Object.assign({ tempoQ: S.settings.tempoQ, onResult: null }, opts);
    const st = { level: C.clamp(phaseNow() || 1, 1, 3), key: 'auto', meter: 'auto', bars: phaseNow() >= 3 ? 8 : 4, tempoQ: o.tempoQ, piece: null, layout: null, played: [], phase: 'idle', metro: null, timers: [], result: null };
    DEBUG.gen = st;
    const src = () => Input.activeSource(S.settings.input);
    const keyOpts = [['auto', 'Au hasard'], ...Object.keys(C.KEY_NAMES).filter((k) => k !== 'E' && k !== 'Ab').map((k) => [k, C.KEY_NAMES[k]])];
    root.innerHTML = `<div class="gen">
      <div class="opts">
        <div class="field"><span class="lab">Niveau</span>${chipsHTML('level', [[1, 'Phase 1'], [2, 'Phase 2'], [3, 'Phase 3']], st.level)}</div>
        <div class="field"><span class="lab">Tonalité</span><select class="input" id="gn-key">${keyOpts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></div>
        <div class="field"><span class="lab">Mesure</span><select class="input" id="gn-meter">${[['auto', 'Au hasard'], ['4/4', '4/4'], ['3/4', '3/4'], ['2/4', '2/4'], ['6/8', '6/8']].map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></div>
        <div class="field"><span class="lab">Mesures</span>${chipsHTML('bars', [[4, '4'], [6, '6'], [8, '8']], st.bars)}</div>
        <div class="field"><span class="lab">Tempo (noire)</span>${stepperHTML('gn-tempo', st.tempoQ, { min: 30, max: 160, step: 2, label: 'le tempo' })}</div>
      </div>
      <p class="never-strip slim">Ne jamais s’arrêter ni corriger.</p>
      <div class="paper score-paper" id="gn-paper"></div>
      <p class="feedback" id="gn-fb" aria-live="polite"></p>
      <div class="actions" id="gn-actions"></div>
      <div id="gn-result"></div></div>`;
    const paper = $('#gn-paper', root);
    const fb = (m, k = '') => {
      const el = $('#gn-fb', root);
      el.textContent = m;
      el.className = 'feedback ' + k;
    };
    function actions() {
      $('#gn-actions', root).innerHTML =
        st.phase === 'play'
          ? `<button type="button" class="btn secondary big" data-act="stop">${icon('pause', 22)}<span>Arrêter</span></button>`
          : `<button type="button" class="btn primary big" data-act="read">${icon('metronome', 22)}<span>${st.result ? 'Rejouer cette pièce' : 'Lire avec le métronome'}</span></button><button type="button" class="btn secondary" data-act="new">${icon('refresh', 20)}<span>Nouvelle pièce</span></button>`;
    }
    function generate() {
      st.piece = C.generatePiece({ level: st.level, key: st.key === 'auto' ? null : st.key, meter: st.meter === 'auto' ? null : st.meter, bars: st.bars, seed: (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0 });
      st.result = null;
      st.stateOf = null;
      draw();
      $('#gn-result', root).innerHTML = '';
      fb(`${cap(st.piece.keyName)} · ${st.piece.meter} · ${st.piece.bars} mesures. Prends 30 s pour l’analyser avant de lancer.${src() === 'midi' || S.settings.simulator ? '' : ' La notation note par note demande le MIDI.'}`);
      actions();
    }
    function draw(stateOf) {
      const p = st.piece;
      const mi = C.meterInfo(p.meter);
      void mi;
      const toEv = (e, hand, ei) => ({ t: e.t, d: e.d, rest: !!e.rest, notes: (e.notes || []).map((n, ni) => ({ step: n.step, oct: n.oct, alt: n.alt, id: `${hand}-${ei}-${ni}`, cls: stateOf ? stateOf(hand, ei, ni) : '' })) });
      const bars = [];
      for (let b = 0; b < p.bars; b++) {
        bars.push({
          staves: [
            p.rh.map((e, i) => [e, i]).filter(([e]) => e.bar === b).map(([e, i]) => toEv(e, 'rh', i)),
            p.lh.map((e, i) => [e, i]).filter(([e]) => e.bar === b).map(([e, i]) => toEv(e, 'lh', i)),
          ],
        });
      }
      const w = Math.max(340, Math.min((paper.clientWidth || 900) - 24, 1200));
      st.layout = N.score({ staves: [{ clef: 'treble' }, { clef: 'bass' }], bars, meter: p.meter, fifths: p.fifths, S: sizes().piece, width: w, ariaLabel: `Pièce générée en ${p.keyName}` });
      paper.innerHTML = st.layout.svg;
    }
    function highlight(bar) {
      $$('.bar-hl', paper).forEach((r) => r.classList.toggle('on', +r.dataset.bar === bar));
    }
    function stopAll() {
      st.timers.forEach(clearTimeout);
      st.timers = [];
      if (st.metro) st.metro.stop();
      highlight(-1);
    }
    async function read() {
      stopAll();
      await Sound.unlock();
      st.played = [];
      st.metro = new Sound.Metronome();
      const p = st.piece;
      const m = st.metro.start({
        tempoQ: st.tempoQ,
        meter: p.meter,
        countInBars: 1,
        volume: S.settings.metroVolume,
        subdivide: S.settings.metroSubdivide,
        onTick: (e) => {
          if (e.kind === 'bar') highlight(e.bar);
        },
      });
      if (!m) return toast('Son indisponible');
      st.phase = 'play';
      st.t0 = m.t0Perf;
      st.qMs = 60000 / st.tempoQ;
      const endT = st.t0 + p.bars * C.meterInfo(p.meter).barQ * st.qMs;
      actions();
      fb('Décompte d’une mesure, puis joue. La mesure en cours est surlignée.', 'info');
      $('#gn-result', root).innerHTML = '';
      st.timers.push(setTimeout(() => finish(), endT - performance.now() + st.qMs));
      Kbd.auto(48, 84);
    }
    function finish() {
      stopAll();
      st.phase = 'idle';
      const r = C.evaluatePiece(st.piece, st.played, { t0: st.t0, quarterMs: st.qMs, latencyMs: S.settings.latencyMs });
      st.result = r;
      const map = new Map(r.notes.map((n) => [`${n.hand}-${n.ei}-${n.ni}`, n.state]));
      st.stateOf = (hand, ei, ni) => {
        const s = map.get(`${hand}-${ei}-${ni}`);
        return s ? 'n-' + (s === 'missed' ? 'miss' : s) : '';
      };
      draw(st.stateOf);
      $('#gn-result', root).innerHTML = `<div class="metrics">
        <div class="metric"><span class="lab">Justesse</span><b>${r.pitchPct} %</b><span class="sub">${r.total - r.missed} notes sur ${r.total}</span></div>
        <div class="metric"><span class="lab">Placement</span><b>${r.rhythmPct} %</b><span class="sub">${r.meanAbsDev != null ? `écart moyen ${r.meanAbsDev} ms` : '—'}</span></div>
        <div class="metric"><span class="lab">Manquées</span><b>${r.missed}</b></div>
        <div class="metric"><span class="lab">En trop</span><b>${r.extra}</b></div></div>
        <p class="legend"><span class="lg ok"></span>à l’heure <span class="lg near"></span>un peu décalée <span class="lg off"></span>décalée <span class="lg miss"></span>manquée</p>`;
      fb(r.pitchPct >= 90 && r.rhythmPct >= 80 ? 'Très bonne lecture.' : 'Relis les mesures en couleur, puis passe à une nouvelle pièce.', r.pitchPct >= 90 ? 'ok' : 'info');
      if (o.onResult) o.onResult({ level: st.piece.level, key: st.piece.key, meter: st.piece.meter, bars: st.piece.bars, tempoQ: st.tempoQ, pitchPct: r.pitchPct, rhythmPct: r.rhythmPct, missed: r.missed, extra: r.extra, date: today() });
      actions();
    }
    const off = Input.on((ev) => {
      if (st.phase !== 'play' || ev.type !== 'noteon') return;
      st.played.push({ midi: ev.midi, t: ev.t });
    });
    wireChips(root.firstElementChild, (k, v) => {
      st[k] = +v;
      generate();
    });
    wireSteppers(root.firstElementChild, (id, v) => (st.tempoQ = v));
    $('#gn-key', root).addEventListener('change', (e) => {
      st.key = e.target.value;
      generate();
    });
    $('#gn-meter', root).addEventListener('change', (e) => {
      st.meter = e.target.value;
      generate();
    });
    root.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      if (a.dataset.act === 'new') generate();
      if (a.dataset.act === 'read') read();
      if (a.dataset.act === 'stop') {
        stopAll();
        st.phase = 'idle';
        actions();
        fb('Lecture arrêtée.');
      }
    });
    generate();
    let lastW = 0;
    const onResize = () => {
      const w = paper.clientWidth;
      if (!st.piece || st.phase === 'play' || Math.abs(w - lastW) < 40) return;
      lastW = w;
      draw(st.stateOf || undefined);
    };
    window.addEventListener('resize', onResize);
    return {
      destroy() {
        stopAll();
        off();
        window.removeEventListener('resize', onResize);
      },
      get piece() {
        return st.piece;
      },
      get t0() {
        return st.t0;
      },
      get qMs() {
        return st.qMs;
      },
    };
  }
